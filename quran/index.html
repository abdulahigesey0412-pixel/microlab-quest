<style>
/* Layout: a winding path of lesson stones down one column, a rail of five stations, and a full-screen lesson stage with a sticky answer bar. */
:root{
  --bg:#F3F5F2; --panel:#FFFFFF; --sunk:#E7EBE6; --ink:#16212E; --muted:#5D6877; --line:#D5DBD3;
  --lapis:#1E5AA8; --lapis-d:#163F78; --lapis-soft:#DDE8F6;
  --gold:#C08A18; --gold-d:#8E6510; --gold-soft:#F6EBCF;
  --good:#2E9B52; --good-d:#1F6E39; --good-soft:#DDF3E3;
  --bad:#D2443A; --bad-d:#9A2C25; --bad-soft:#FBE1DE;
  --plum:#7A4FB3; --plum-soft:#EDE4F8; --teal:#178A86; --teal-soft:#D8F0EE;
  --tj-madd:#C2410C; --tj-madd2:#B91C1C; --tj-lazim:#7F1D1D; --tj-ghunna:#15803D; --tj-ikhfa:#0E7490; --tj-idgham:#4D7C0F; --tj-iqlab:#0369A1; --tj-qalq:#1D4ED8; --tj-silent:#9AA3AE; --tj-shafawi:#A21CAF;
  --quran:"Amiri Quran","Amiri","Scheherazade New","Noto Naskh Arabic","Geeza Pro",serif;
  --kufi:"Reem Kufi","Rubik",system-ui,sans-serif;
  --sans:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F151D; --panel:#17202B; --sunk:#1E2936; --ink:#E8ECF1; --muted:#9AA6B5; --line:#2A3746;
  --lapis:#6EA2EC; --lapis-d:#3F74C2; --lapis-soft:#1C2E48; --gold:#E2B44E; --gold-d:#A9822F; --gold-soft:#3A2F15;
  --good:#5BCB82; --good-d:#2F8A51; --good-soft:#163424; --bad:#F2837A; --bad-d:#B9473F; --bad-soft:#3E1D1B;
  --plum:#B494E6; --plum-soft:#2E2442; --teal:#55C7C1; --teal-soft:#123533;
  --tj-madd:#FB923C; --tj-madd2:#F87171; --tj-lazim:#FCA5A5; --tj-ghunna:#4ADE80; --tj-ikhfa:#22D3EE; --tj-idgham:#A3E635; --tj-iqlab:#38BDF8; --tj-qalq:#93B4FF; --tj-silent:#6B7685; --tj-shafawi:#E879F9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151D; --panel:#17202B; --sunk:#1E2936; --ink:#E8ECF1; --muted:#9AA6B5; --line:#2A3746;
  --lapis:#6EA2EC; --lapis-d:#3F74C2; --lapis-soft:#1C2E48; --gold:#E2B44E; --gold-d:#A9822F; --gold-soft:#3A2F15;
  --good:#5BCB82; --good-d:#2F8A51; --good-soft:#163424; --bad:#F2837A; --bad-d:#B9473F; --bad-soft:#3E1D1B;
  --plum:#B494E6; --plum-soft:#2E2442; --teal:#55C7C1; --teal-soft:#123533;
  --tj-madd:#FB923C; --tj-madd2:#F87171; --tj-lazim:#FCA5A5; --tj-ghunna:#4ADE80; --tj-ikhfa:#22D3EE; --tj-idgham:#A3E635; --tj-iqlab:#38BDF8; --tj-qalq:#93B4FF; --tj-silent:#6B7685; --tj-shafawi:#E879F9; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:16px/1.5 var(--sans);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--lapis)}
svg.i{width:1.1em;height:1.1em;vertical-align:-.18em;flex:none}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:2px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.brand{font:700 30px/1 var(--kufi);color:var(--lapis);padding:0 12px 16px;display:flex;align-items:baseline;gap:8px}
.brand small{font:500 22px/1 var(--kufi);color:var(--gold)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:12px;display:flex;gap:12px;align-items:center;color:var(--muted);font-weight:700;letter-spacing:.02em;text-transform:uppercase;font-size:14px;border:2px solid transparent}
.nav button svg{width:26px;height:26px}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="page"]{background:var(--lapis-soft);color:var(--lapis);border-color:color-mix(in srgb,var(--lapis) 45%,transparent)}
.nav button:focus-visible{outline:3px solid var(--lapis);outline-offset:1px}
.nav .badge{margin-left:auto}
.badge{font:700 11px/1 var(--sans);padding:4px 7px;border-radius:99px;background:var(--bad);color:#fff}
main{min-width:0;padding-block:22px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:800 28px/1.15 var(--sans);margin:0;text-wrap:balance}
h2{font:700 20px/1.3 var(--sans);margin:0;text-wrap:balance}
h3{font:700 16px/1.3 var(--sans);margin:0}
.eyebrow{font:700 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)} .small{font-size:14px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
/* chunky buttons */
.btn{cursor:pointer;border:2px solid var(--line);border-bottom-width:4px;background:var(--panel);padding:9px 16px;border-radius:14px;font-weight:700;letter-spacing:.02em;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:transform .06s}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn:hover{background:var(--sunk)}
.btn:focus-visible,.opt:focus-visible,.tile:focus-visible,.node:focus-visible{outline:3px solid var(--lapis);outline-offset:2px}
.btn.pri{background:var(--lapis);border-color:var(--lapis-d);color:#fff}
.btn.pri:hover{background:color-mix(in srgb,var(--lapis) 88%,#fff)}
.btn.good{background:var(--good);border-color:var(--good-d);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad-d);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold-d);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:12px}
.btn.big{padding:13px 22px;font-size:17px;text-transform:uppercase;letter-spacing:.06em}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.chip{font:700 12px/1 var(--sans);padding:5px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
.chip.m{background:var(--gold-soft);color:var(--gold-d)} .chip.d{background:var(--lapis-soft);color:var(--lapis)} .chip.g{background:var(--good-soft);color:var(--good-d)}
:root:not([data-theme="light"]) .chip.m{color:var(--gold)}
.bar{height:12px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .35s}
.bar.lapis i{background:var(--lapis)} .bar.gold i{background:var(--gold)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:800 26px/1.1 var(--sans);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
/* top stats strip */
.topstats{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ts{display:inline-flex;align-items:center;gap:6px;font-weight:800;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-variant-numeric:tabular-nums}
.ts.fire{color:var(--gold)} .ts.heart{color:var(--bad)} .ts.xp{color:var(--lapis)}
.ts svg{width:22px;height:22px}
/* Quran text */
.q{font-family:var(--quran);direction:rtl;text-align:right;font-size:30px;line-height:2.2;word-spacing:.06em}
.q.lg{font-size:36px} .q.md{font-size:27px} .q.sm{font-size:23px;line-height:2}
.q.c{text-align:center}
.ar{font-family:var(--quran);direction:rtl;font-size:1.25em}
.num{font-family:var(--quran);color:var(--gold);font-size:.8em;padding:0 .15em;white-space:nowrap}
.wtap{cursor:pointer;border-radius:6px;padding:0 .06em}
.wtap:hover{background:var(--gold-soft)}
.hid{color:transparent;background:var(--sunk);border-radius:6px;cursor:pointer;user-select:none}
.hint{color:var(--muted)}
.tr{font-size:16px}
.tr .ref{font:600 12px var(--mono);color:var(--muted);margin-right:6px}
.wbw{display:flex;flex-wrap:wrap;direction:rtl;gap:8px}
.wbw div{display:flex;flex-direction:column;align-items:center;padding:6px 8px;border:2px solid var(--line);border-radius:12px;min-width:64px;background:var(--panel);cursor:pointer}
.wbw div:hover{border-color:var(--gold)}
.wbw .wa{font-family:var(--quran);font-size:24px;line-height:1.7}
.wbw .wt{font-size:12px;font-style:italic;color:var(--muted);direction:ltr;margin-top:4px}
.wbw .wg{font-size:12px;direction:ltr;text-align:center;max-width:120px}
.mark{background:var(--gold-soft);color:var(--gold-d);border-radius:6px;padding:0 .12em;box-shadow:0 0 0 2px var(--gold) inset}
:root:not([data-theme="light"]) .mark{color:var(--gold)}
/* tajwid colours */
.tjon .tj.madda_normal{color:var(--tj-madd)} .tjon .tj.madd_muttasil,.tjon .tj.madd_munfasil{color:var(--tj-madd2)} .tjon .tj.madda_necessary{color:var(--tj-lazim)}
.tjon .tj.madd_arid,.tjon .tj.madd_lin{color:var(--tj-madd)}
.tjon .tj.ghunnah{color:var(--tj-ghunna)} .tjon .tj.ikhafa{color:var(--tj-ikhfa)} .tjon .tj.idgham_ghunnah,.tjon .tj.idgham_wo_ghunnah,.tjon .tj.idgham_mutajanisayn,.tjon .tj.idgham_mutaqaribayn{color:var(--tj-idgham)}
.tjon .tj.iqlab{color:var(--tj-iqlab)} .tjon .tj.qalqala_s,.tjon .tj.qalqala_k{color:var(--tj-qalq)} .tjon .tj.ham_wasl,.tjon .tj.laam_shamsiyah,.tjon .tj.slnt{color:var(--tj-silent)}
.tjon .tj.ikhafa_shafawi,.tjon .tj.idgham_shafawi{color:var(--tj-shafawi)}
.tj{font-style:normal}
.tj.focus{color:var(--bad)!important;background:var(--bad-soft);border-radius:4px;box-shadow:0 0 0 2px var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--sunk)}
/* path */
.unit{border-radius:var(--r);padding:16px 18px;color:#fff;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;border-bottom:4px solid rgba(0,0,0,.18)}
.unit>div{min-width:0}
.unit h2{color:#fff} .unit .sub{opacity:.9;font-size:14px;font-weight:500}
.unit .uar{font-family:var(--quran);font-size:30px;line-height:1.2}
.unit .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:52px 0 8px;overflow:hidden}
.nodewrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{all:unset;cursor:pointer;width:74px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);border-bottom:7px solid color-mix(in srgb,var(--sunk) 70%,#000);color:var(--muted);position:relative;transition:transform .08s}
.node svg{width:34px;height:34px}
.node:active{transform:translateY(4px);border-bottom-width:3px}
.node.done{background:var(--gold);border-bottom-color:var(--gold-d);color:#fff}
.node.cur{background:var(--ucol,var(--lapis));border-bottom-color:color-mix(in srgb,var(--ucol,var(--lapis)) 60%,#000);color:#fff}
.node.cur::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid color-mix(in srgb,var(--ucol,var(--lapis)) 35%,transparent);animation:pulse 1.6s ease-in-out infinite}
.node.locked{cursor:default;opacity:.85}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.55}}
.bubble{position:absolute;bottom:calc(100% + 10px);white-space:nowrap;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:800;color:var(--ucol,var(--lapis));text-transform:uppercase;font-size:13px;letter-spacing:.06em;animation:bob 2s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--line)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.nlabel{font-size:12px;font-weight:600;color:var(--muted);margin-top:6px;max-width:160px;text-align:center}
/* lesson stage */
.stage{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.stage>*{min-width:0}
.stage header{display:flex;gap:14px;align-items:center;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));max-width:900px;width:100%;margin:0 auto}
.stage header .bar{flex:1;height:16px}
.stage .x{all:unset;cursor:pointer;color:var(--muted);display:grid;place-items:center;width:36px;height:36px;border-radius:10px}
.stage .x:hover{background:var(--sunk)}
.stage .x svg{width:26px;height:26px}
.stage .body{overflow:auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px))}
.stage .inner{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:100%;justify-content:center}
.stage .kind{font:800 13px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--plum)}
.stage h2{font-size:24px}
.foot{border-top:2px solid var(--line);background:var(--bg);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.foot .in{max-width:900px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.foot.ok{background:var(--good-soft);border-color:transparent} .foot.no{background:var(--bad-soft);border-color:transparent}
.foot .msg{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.foot .msg b{font-size:21px} .foot.ok .msg b{color:var(--good-d)} .foot.no .msg b{color:var(--bad-d)}
:root:not([data-theme="light"]) .foot.ok .msg b{color:var(--good)} :root:not([data-theme="light"]) .foot.no .msg b{color:var(--bad)}
.foot .sol{font-size:15px;max-height:9em;overflow:auto}
.combo{font:800 14px var(--sans);color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
/* options & tiles */
.opts{display:grid;gap:10px}
.opt{all:unset;cursor:pointer;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 14px;background:var(--panel);display:flex;gap:12px;align-items:center;font-weight:500}
.opt:hover{background:var(--sunk)}
.opt .k{font:700 12px var(--sans);color:var(--muted);border:2px solid var(--line);border-radius:8px;width:24px;height:24px;display:grid;place-items:center;flex:none}
.opt.sel{border-color:var(--lapis);background:var(--lapis-soft);color:var(--lapis)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.arq{font-family:var(--quran);font-size:25px;direction:rtl;line-height:1.8}
.opt.big{flex-direction:column;justify-content:center;text-align:center;padding:18px 10px}
.opt.big .arw{font-family:var(--quran);font-size:34px;line-height:1.5}
.answer{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-content:flex-start}
.answer.rtl,.bank.rtl{direction:rtl}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:6px}
.tile{all:unset;cursor:pointer;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:6px 12px;background:var(--panel);font-weight:500}
.tile.ar{font-family:var(--quran);font-size:24px;line-height:1.7;padding:2px 12px}
.tile.ghost{color:transparent;background:var(--sunk);border-color:var(--sunk);cursor:default}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .opt{justify-content:center;text-align:center;min-height:58px}
.pairs .opt.done{opacity:.35;cursor:default}
.speaker{all:unset;cursor:pointer;width:84px;height:84px;border-radius:22px;background:var(--lapis);border-bottom:6px solid var(--lapis-d);display:grid;place-items:center;color:#fff}
.speaker svg{width:40px;height:40px}
.introcard{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.lex{font-family:var(--quran);font-size:60px;line-height:1.5;direction:rtl}
.tip{background:var(--plum-soft);border:2px solid color-mix(in srgb,var(--plum) 40%,transparent);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.tip p{margin:0;max-width:66ch;line-height:1.65}
.tip ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.ex{border-left:4px solid var(--gold);padding:4px 12px}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grades .btn{flex-direction:column;gap:0;padding:8px}
.grades .btn small{font:500 11px var(--sans);opacity:.85}
.result{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.result .big{font:800 34px/1.1 var(--sans);color:var(--gold)}
.rstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:520px}
.rstats div{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.rstats div b{display:block;font:800 22px var(--sans);padding:10px 4px}
.rstats div span{display:block;font:800 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#fff;padding:5px}
/* misc */
.list{display:flex;flex-direction:column}
.list>div{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:2px solid var(--line);align-items:center}
.list>div:last-child{border-bottom:0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:700 11px var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
td.n{font-variant-numeric:tabular-nums;text-align:right}
.juzmap{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}

  .brand{display:none}

/* transliteration */

.opt.big .otl{text-align:center;font-size:14px}

.wrap .wrap{margin:0;max-width:none;width:100%;min-width:0}

</head>
<body>
<div class="app">
  <aside class="rail"><div class="brand">Sabaq <small>سَبَق</small></div><nav class="nav" id="nav" aria-label="Sections"></nav></aside>
  <main><div class="wrap" id="view"><div class="loading">Opening the mushaf…</div></div></main>
</div>
<div id="sheet" hidden></div>
<script>
'use strict';

const R={};
const wordH=(i,k)=>{const t=S.set.tjc?tjSync(i):null;return t?t[k]:esc(A(i)[7][k])};
const start=(i,n=4)=>A(i)[7].slice(0,n).join(' ');
function distinctStarts(right,cands,n=3){const seen=new Set([right]);const out=[];for(const c of cands){if(!seen.has(c)){seen.add(c);out.push(c)}if(out.length>=n)break}return out}
/* ========== utilities ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AD=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const range=(a,b)=>{const r=[];if(a<=b)for(let i=a;i<=b;i++)r.push(i);else for(let i=a;i>=b;i--)r.push(i);return r};
const pct=(a,b)=>b?Math.round(1000*a/b)/10:0;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
async function J(p){const r=await fetch(p);if(!r.ok)throw new Error(p+' → '+r.status);return r.json()}
const sk=w=>w.replace(/[^ء-غف-يٱ]/g,'').replace(/[ٱأإآ]/g,'ا').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ء/g,'');

/* ========== data ========== */
let D, KEY={}, SI={}, LESSONS=[], SIM={};
const WJ={}, TRC={}, TFC={}; let INFO=null;
const A=i=>D.ayahs[i];             // s,a,page,juz,hizb,rub,sajda,words,line0,line1,ruku,page1,sahih
const sName=s=>D.surahs[s-1][1];
const ref=i=>A(i)[0]+':'+A(i)[1];
function juzWords(j){if(!WJ[j])WJ[j]=J(`data/w/${String(j).padStart(2,'0')}.json`);return WJ[j]}
async function W(i){const a=A(i);return (await juzWords(a[3]))[a[0]+':'+a[1]]}
const PUB=!!window.SABAQ_PUBLIC;
const TRN={20:'Saheeh International',85:'Abdel Haleem',84:'Taqi Usmani',19:'Pickthall',22:'Yusuf Ali',149:'Bridges (Fadel Soliman)',203:'Hilali & Khan'};
if(PUB){delete TRN[85];delete TRN[84];delete TRN[149]}
const TRO=()=>[20,85,84,19,22,149,203].filter(k=>TRN[k]);const trSel=()=>TRN[S.set.tr]?+S.set.tr:20;
async function trText(i,id){id=+id;if(!TRN[id])id=20;if(id===20)return A(i)[12];if(!TRC[id])TRC[id]=J(`data/t/${id}.json`);return (await TRC[id])[i]}
const TFN={16:['Tafsīr al-Muyassar','ar'],91:['Tafsīr as-Saʿdī','ar'],169:['Ibn Kathīr (abridged, English)','en']};
if(PUB)delete TFN[169];
async function tafsir(i,id){if(!TFN[id])id=16;
  for(let k=i;k>=0&&A(k)[0]===A(i)[0];k--){
    const j=A(k)[3],key=id+'/'+j;
    if(!TFC[key])TFC[key]=J(`data/tf/${id}/${String(j).padStart(2,'0')}.json`).catch(()=>({}));
    const t=(await TFC[key])[ref(k)];
    if(t)return {html:t,from:k};
  }
  return null;
}
function lineCodes(i){const a=A(i),o=[];for(let p=a[2];p<=a[11];p++){const l0=p===a[2]?a[8]:1,l1=p===a[11]?a[9]:15;for(let l=l0;l<=l1;l++)o.push(p*16+l)}return o}
function countLines(list){const s=new Set();list.forEach(i=>lineCodes(i).forEach(c=>s.add(c)));return s.size}

/* ========== state ========== */
const SK='sabaq_v1';
let S={};try{S=JSON.parse(localStorage.getItem(SK))||{}}catch(e){S={}}
S=Object.assign({ay:{},lex:{},gram:{},days:{},games:{},set:{}},S);
S.set=Object.assign({daily:5,order:'back',tr:20,tf:16,rev:150,lexNew:10,pool:'mem'},S.set);
function save(){try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}}
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dnum=s=>Math.round(Date.parse(s+'T00:00:00Z')/864e5);
const TD=()=>dnum(ymd(new Date()));
function dayLog(k,n=1){const d=ymd(new Date());const o=S.days[d]=S.days[d]||{};o[k]=(o[k]||0)+n;save()}
/* SM-2 style scheduling in whole days. g: 0 again, 1 hard, 2 good, 3 easy */
function sched(rec,g){
  const t=TD();rec=rec||{n:0,iv:0,ef:2.4,lp:0};
  if(g===0){rec.n=0;rec.iv=0;rec.lp=(rec.lp||0)+1;rec.ef=Math.max(1.3,rec.ef-.2);rec.due=t}
  else{
    rec.n++;
    if(rec.n===1)rec.iv=g===3?3:1;
    else if(rec.n===2)rec.iv=g===1?2:g===3?6:4;
    else rec.iv=Math.max(rec.iv+1,Math.round(rec.iv*rec.ef*(g===1?.6:g===3?1.3:1)));
    rec.iv=Math.min(rec.iv,365);
    rec.ef=Math.min(2.8,Math.max(1.3,rec.ef+(g===3?.1:g===1?-.15:0)));
    rec.due=t+rec.iv;
  }
  rec.last=t;return rec;
}
const memo=i=>S.ay[i]&&S.ay[i].n>0;
function memList(){return Object.keys(S.ay).map(Number).filter(memo).sort((a,b)=>a-b)}
function dueAyat(){const t=TD();return Object.keys(S.ay).map(Number).filter(i=>S.ay[i].due<=t).sort((a,b)=>a-b)}

/* ========== hifz order ========== */
let ORDER=[];
function buildOrder(){
  const surs=S.set.order==='back'?[1,...range(114,2)]:range(1,114);
  ORDER=[];for(const s of surs){const n=D.surahs[s-1][7];for(let a=0;a<n;a++)ORDER.push(SI[s]+a)}
}
function nextLesson(){
  const out=[];let ln=0;const tgt=S.set.daily;
  for(const i of ORDER){
    if(S.ay[i])continue;
    if(out.length&&A(i)[0]!==A(out[out.length-1])[0]){if(ln>=tgt*.6)break}
    if(out.length&&i!==out[out.length-1]+1&&A(i)[0]===A(out[out.length-1])[0])break;
    out.push(i);ln=countLines(out);if(ln>=tgt)break;
  }
  if(out.length){let rest=[],k=out[out.length-1]+1;while(k<6236&&A(k)[0]===A(out[0])[0]&&!S.ay[k]){rest.push(k);k++}if(rest.length&&countLines([...out,...rest])-ln<=Math.max(3,tgt*.6))out.push(...rest)}
  return out;
}

/* ========== rendering helpers ========== */
function ayahHTML(i,opts={}){
  const w=A(i)[7];
  const words=w.map((x,k)=>`<span class="wtap" data-i="${i}" data-k="${k}">${wordH(i,k)}</span>`).join(' ');
  return words+` <span class="num">﴿${AD(A(i)[1])}﴾</span>`;
}
function fadeHTML(i,level,seed){
  const w=A(i)[7];
  return w.map((x,k)=>{
    let show=true;
    if(level===1)show=(k+seed)%2===0;
    else if(level>=2)show=false;
    if(show)return `<span>${esc(x)}</span>`;
    if(level===2){const M='[\u064b-\u065f\u0670\u06d6-\u06ed]*';const f=x.match(new RegExp('^(?:[\u0648\u0641]'+M+')?(?:[\u0671\u0627]\u0644'+M+')?[\u0621-\u064a\u0671]'+M));return `<span class="hint">${esc(f?f[0]:x[0])}…</span>`}
    return `<span class="hid" data-reveal="${esc(x)}">${esc(x)}</span>`;
  }).join(' ')+` <span class="num">﴿${AD(A(i)[1])}﴾</span>`;
}
document.addEventListener('click',e=>{const h=e.target.closest('.hid');if(h){h.classList.remove('hid');}});
const AUDIO_BASE='https://everyayah.com/data/Abdul_Basit_Murattal_192kbps/';
let player=null,audioBlocked=false;
function playAyat(list,reps=1,onEnd){
  if(player){player.pause();player=null}
  const q=[];list.forEach(i=>{for(let r=0;r<reps;r++)q.push(i)});
  let k=0;const au=new Audio();player=au;
  const go=()=>{if(k>=q.length||player!==au){onEnd&&onEnd();return}const a=A(q[k]);au.src=AUDIO_BASE+String(a[0]).padStart(3,'0')+String(a[1]).padStart(3,'0')+'.mp3';au.play().catch(err)};
  const err=()=>{if(player!==au)return;audioBlocked=true;toast('Audio is blocked in this view. Use the Quran.com ↗ link beside Play to hear the āyah.');player=null};
  au.onended=()=>{k++;go()};au.onerror=err;go();
}
function stopAudio(){if(player){player.pause();player=null}}


/* ========== word-by-word & ayah sheet ========== */
const TAGN={PERF:'past (māḍī)',IMPF:'present (muḍāriʿ)',IMPV:'command (amr)',PASS:'passive',NOM:'nominative (marfūʿ)',ACC:'accusative (manṣūb)',GEN:'genitive (majrūr)',
 'MOOD:IND':'indicative','MOOD:SUBJ':'subjunctive (manṣūb)','MOOD:JUS':'jussive (majzūm)',INDEF:'indefinite',ACT_PCPL:'active participle',PASS_PCPL:'passive participle',VN:'verbal noun (maṣdar)',
 PN:'proper noun',ADJ:'adjective',PRON:'pronoun',DEM:'demonstrative',REL:'relative pronoun',T:'time adverb',LOC:'place adverb',NEG:'negative particle',CONJ:'conjunction',P:'preposition',
 COND:'conditional',INTG:'interrogative',VOC:'vocative',EMPH:'emphatic',CERT:'particle of certainty',SUB:'subordinating',REM:'resumption',DET:'definite article',FUT:'future particle',RES:'restriction',PRO:'prohibition',EXP:'exception',ACC_P:'accusative particle',CIRC:'circumstantial',SUP:'supplemental',RSLT:'result',ANS:'answer',INC:'inceptive',PREV:'preventive',CAUS:'cause',AMD:'amendment',EXL:'explanation',EXH:'exhortation',RET:'retraction',SUR:'surprise',AVR:'aversion',INL:'initial letters',INT:'interpretation',EQ:'equalisation',COM:'comitative',ATT:'attention',ADDR:'addressee',DIST:'distance',NV:'verb-like noun',MD:'modal'};
const ROMAN=['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
function pgnName(t){const m=t.match(/^([123])?([MF])?([SDP])?$/);if(!m||t==='')return null;const p={1:'1st',2:'2nd',3:'3rd'}[m[1]]||'';const g={M:'masculine',F:'feminine'}[m[2]]||'';const n={S:'singular',D:'dual',P:'plural'}[m[3]]||(m[2]&&!m[1]?'singular':'');return [p&&p+' person',g,n].filter(Boolean).join(' ')}
function parseWord(d){
  const [gl,tl,ln,li,ri,pos,tags,aff]=d;const T=tags?tags.split(' '):[];
  const out=[];out.push({N:'Noun (ism)',V:'Verb (fiʿl)',P:'Particle (ḥarf)'}[pos]||pos);
  for(const t of T){
    if(t.startsWith('VF:')){out.push('Form '+ROMAN[+t.slice(3)]);continue}
    if(t.startsWith('FAM:')){out.push('family of '+t.slice(4));continue}
    const p=pgnName(t);if(p){out.push(p);continue}
    if(TAGN[t])out.push(TAGN[t]);
  }
  return out.join(' · ');
}
function affName(a){const t=a[1].slice(1).split(' ');return (a[1][0]==='+'?'prefix ':'suffix ')+a[0]+' = '+t.map(x=>TAGN[x]||pgnName(x)||x).filter(Boolean).join(', ')}
async function wbwHTML(i){
  const ws=await W(i),ar=A(i)[7];
  return `<div class="wbw">${ws.map((d,k)=>`<div data-wi="${i}" data-wk="${k}"><span class="wa">${esc(ar[k])}</span><span class="wt">${esc(tlWord(i,k)||d[1])}</span><span class="wg">${esc(gl(d[0]))}</span></div>`).join('')}</div>`;
}
document.addEventListener('click',async e=>{
  const w=e.target.closest('.wtap,[data-wi]');if(!w||e.target.closest('.opts'))return;
  const i=+(w.dataset.i??w.dataset.wi),k=+(w.dataset.k??w.dataset.wk);
  if(Number.isNaN(i))return;
  openWord(i,k);
});
async function openWord(i,k){
  const d=(await W(i))[k],ar=A(i)[7][k];
  const lem=d[3]>=0?D.lemmas[d[3]]:null,root=d[4]>=0?D.roots[d[4]]:null;
  sheet(`<div class="spread"><span class="eyebrow">Word ${k+1} · ${ref(i)}</span><button class="btn sm ghost" data-close>Close</button></div>
   <div class="lex">${esc(ar)}</div>
   <div class="tlbig">${esc(tlWord(i,k))}</div><div style="text-align:center"><b>${esc(gl(d[0]))}</b></div>
   <div class="card"><h3>Grammar</h3><div>${esc(parseWord(d))}</div>${d[7].length?`<div class="small muted">${d[7].map(a=>esc(affName(a))).join('<br>')}</div>`:''}</div>
   ${lem?`<div class="card"><h3>Lemma</h3><div class="row"><span class="ar" style="font-size:28px">${esc(lem[0])}</span><span class="tli">${esc(tlText(lem[0]))}</span><span>${esc(lem[4])}</span><span class="chip">${lem[3]}× in the Quran</span></div>
     <div class="row">${lem[1]==='V'?`<button class="btn sm" id="wverb">Conjugations in the Quran</button>`:''}<button class="btn sm" id="wlearn">${S.lex[d[3]]?'In your word deck':'Add to my word deck'}</button></div></div>`:''}
   ${root?`<div class="card"><h3>Root ${rootHTML(root[0])} <span class="chip">${root[1]}×</span></h3>
     <div class="list">${root[2].slice(0,14).map(l=>`<div><span><span class="ar" style="font-size:22px">${esc(D.lemmas[l][0])}</span> <span class="tli">${esc(tlText(D.lemmas[l][0]))}</span></span><span class="small">${esc(D.lemmas[l][4])}</span><span class="chip">${D.lemmas[l][3]}×</span></div>`).join('')}</div>

function matchQ(q,d,prev,next){

  if(q.notTags&&q.notTags.some(t=>T.includes(t)))return false;

function buildUnits(){
  const surs=S.set.order==='back'?[1,...range(114,2)]:range(1,114);
  UNITS=[];NODE={};
  for(const s of surs){
    const ay=range(SI[s],SI[s]+D.surahs[s-1][7]-1);const chunks=[];let acc=[];
    for(const i of ay){if(acc.length&&countLines([...acc,i])>7){chunks.push(acc);acc=[]}acc.push(i)}
    if(acc.length){const last=chunks[chunks.length-1];if(last&&countLines(acc)<=2&&countLines([...last,...acc])<=9)last.push(...acc);else chunks.push(acc)}
    chunks.forEach((list,ci)=>{
      const steps=[];let st=[];for(const i of list){if(st.length&&(countLines([...st,i])>3||st.length>=4)){steps.push(st);st=[]}st.push(i)}if(st.length)steps.push(st);
      const u={id:'u'+list[0],ix:UNITS.length,s,list,steps,part:ci,parts:chunks.length,nodes:[]};
      const add=(k,step)=>{const n={id:u.id+'-'+k+(step??''),k,step,u};u.nodes.push(n);NODE[n.id]=n};
      add('w');steps.forEach((x,k)=>{add('a',k);if(k===0)add('g');if(k===Math.min(1,steps.length-1))add('t')});add('s');
      UNITS.push(u);
    });
  }
}

async function reviewBits(n=2){const out=[];const due=shuffle(dueAyat()).slice(0,n);for(const i of due){const c=Math.random()<.5&&i<6235&&A(i+1)[0]===A(i)[0]?chNext(i):chGap(i);if(c){c.kind='Review · '+c.kind;out.push(c)}}
  const t=TD();const dl=shuffle(Object.keys(S.lex).map(Number).filter(k=>S.lex[k].n>0&&S.lex[k].due<=t)).slice(0,n);for(const li of dl)out.push(chLemma(li,'Review · word'));return out}
function chLemma(li,kind='Words'){const L=D.lemmas[li];return chMCQ({kind,prompt:`<h2>What does this word mean?</h2><div class="lex" style="text-align:center">${esc(L[0])}</div>${tlx()?`<div class="tlbig">${esc(tlText(L[0]))}</div>`:''}`,opts:shuffle([L[4],...glossDistractors(L[4])]),ans:L[4],lex:li,sol:`<span class="ar">${esc(L[0])}</span> <i>${esc(tlText(L[0]))}</i> = ${esc(L[4])}${L[2]?` · root ${rootHTML(L[2])}`:''}`})}
async function passageLemmas(list){const m=new Map();for(const i of list){const ws=await W(i);ws.forEach((d,k)=>{if(d[3]<0)return;const L=D.lemmas[d[3]];if(L[0].replace(/[ً-ٰۖ-ۭ]/g,'').length<2||!L[4])return;if(!m.has(d[3]))m.set(d[3],{li:d[3],i,k})})}return [...m.values()]}
async function buildWords(n){const u=n.u;await ensureTJ(u.list);const all=await passageLemmas(u.list);
  let fresh=all.filter(x=>!(S.lex[x.li]&&S.lex[x.li].n>0)).sort((a,b)=>D.lemmas[b.li][3]-D.lemmas[a.li][3]).slice(0,7);let review=false;

  const qs=[];for(const x of fresh)qs.push(chLemma(x.li));
  for(const x of shuffle(fresh).slice(0,3)){const L=D.lemmas[x.li];const ds=lemmaDistractors(x.li);qs.push(chMCQ({kind:'Words',prompt:`<h2>Which word means “${esc(L[4])}”?</h2>`,opts:shuffle([x.li,...ds]).map(k=>D.lemmas[k][0]),ans:L[0],ar:true,big:true,sol:`<span class="ar">${esc(L[0])}</span> = ${esc(L[4])}`}))}
  if(!AUD.blocked)for(const x of shuffle(fresh).slice(0,2)){const d=(await W(x.i))[x.k];const u2=wordAudio(d);if(u2){const ds=lemmaDistractors(x.li);qs.push(chMCQ({kind:'Listen',prompt:`<h2>Tap what you hear</h2><div class="row" style="justify-content:center"><button class="speaker" data-url="${u2}" aria-label="Play">${ico('speaker')}</button></div>`,autoplay:u2,noTL:true,opts:shuffle([A(x.i)[7][x.k],...ds.map(k=>D.lemmas[k][0])]),ans:A(x.i)[7][x.k],ar:true,big:true,sol:`<span class="ar">${esc(A(x.i)[7][x.k])}</span> “${esc(d[0])}”`}))}}

}
async function buildAyat(n){const u=n.u,L=u.steps[n.step];await ensureTJ(L.concat(L[0]>0?[L[0]-1]:[]));const items=[];

async function buildGrammar(n){const l=(S.done[n.id]&&LESSONS.find(x=>x.id===S.done[n.id].lesson))||nextLessonOf('arabic');return grammarLesson(l,n,n.u.list)}

const WAQF={'ۘ':'Necessary stop (lāzim)','ۙ':'Do not stop here','ۖ':'Better to continue','ۗ':'Better to stop','ۚ':'Stopping or continuing are equal','ۛ':'Stop at one of the pair, not both'};
async function tajwidDrill(l,want,pref){const items=[];
  const scanList=[...new Set([...pref,...shuffle(memList()),...shuffle(D.ayahs.map((a,i)=>i).filter(i=>A(i)[3]===30)),...shuffle(range(0,6235)).slice(0,400)])];
  if(l.drill==='ra'){for(const i of scanList){if(items.length>=want)break;const w=A(i)[7];const k=w.findIndex(x=>/ر[ّ]?[َُِ]/.test(x));if(k<0)continue;const m=w[k].match(/رّ?([َُِ])/);const light=m[1]==='ِ';
      items.push(chMCQ({kind:'Tajwīd · rāʾ',prompt:`<h2>Is the rāʾ in the highlighted word heavy or light?</h2>${qwrap(A(i)[7].map((x,j)=>j===k?`<span class="mark">${esc(x)}</span>`:esc(x)).join(' '))}`,opts:['Heavy (tafkhīm)','Light (tarqīq)'],ans:light?'Light (tarqīq)':'Heavy (tafkhīm)',sol:light?'Its rāʾ has a kasra, so it is light.':'Its rāʾ has a fatḥa or ḍamma, so it is heavy.'}))}return items}
  if(l.drill==='waqf'){for(const i of scanList){if(items.length>=want)break;const w=A(i)[7];const k=w.findIndex(x=>/[ۖۗۘۙۚۛ]/.test(x));if(k<0)continue;const mk=w[k].match(/[ۖۗۘۙۚۛ]/)[0];
      items.push(chMCQ({kind:'Tajwīd · pause marks',prompt:`<h2>What does the pause mark after the highlighted word mean?</h2>${qwrap(A(i)[7].map((x,j)=>j===k?`<span class="mark">${esc(x)}</span>`:esc(x)).join(' '))}<div class="q c" style="font-size:44px">${mk}</div>`,opts:shuffle(Object.values(WAQF)).slice(0,3).concat(WAQF[mk]).filter((v,ix,a)=>a.indexOf(v)===ix).slice(-4),ans:WAQF[mk],sol:`${mk} = ${WAQF[mk]}`}))}
    items.forEach(c=>{if(!c.opts.includes(c.ans))c.opts[0]=c.ans;c.opts=shuffle(c.opts)});return items}
  const cls=l.drill==='sila'?['madda_normal']:(l.tj||[]);if(!cls.length)return items;

    const spots=[];t.forEach((h,k)=>{const re=/<i class="tj ([a-z_]+)">([^<]*)<\/i>/g;let m,c=0;while((m=re.exec(h))){if(cls.includes(m[1])&&(l.drill!=='sila'||/[ۥۦ]/.test(m[2])))spots.push([k,c,m[1],m[2]]);c++}});

    else{ans=TJN[cl];const grp=TJGROUP.find(g=>g.includes(cl))||[];opts=[...new Set([ans,...shuffle(cls.filter(x=>x!==cl).map(x=>TJN[x])),...shuffle(grp.filter(x=>x!==cl).map(x=>TJN[x]))])].slice(0,4);opts=shuffle(opts)}
    items.push(chMCQ({kind:'Tajwīd · '+l.title,prompt:`<h2>Which rule applies to the letters in red?</h2><div class="small muted">${ref(i)}</div><div class="q md">${html}</div>${tlx()?tlLine(i):''}`,opts,ans,sol:`<div class="q sm tjon">${t.join(' ')}</div>`}))}
  return items}
async function buildTajwid(n){const l=(S.done[n.id]&&LESSONS.find(x=>x.id===S.done[n.id].lesson))||nextLessonOf('tajwid');return tajwidLesson(l,n,n.u.list)}

async function buildSeal(n){const u=n.u;await ensureTJ(u.list);const items=[];

const ACH=[
 ['l1','First steps','Finish your first lesson',()=>S.stats.lessons,1],['l25','Steady','Finish 25 lessons',()=>S.stats.lessons,25],['l100','Devoted','Finish 100 lessons',()=>S.stats.lessons,100],
 ['p5','Flawless','5 perfect lessons',()=>S.stats.perfect,5],['s3','Three days','A 3-day streak',streak,3],['s7','A full week','A 7-day streak',streak,7],['s30','A month of Quran','A 30-day streak',streak,30],
 ['x500','500 XP','Earn 500 XP',()=>S.xp,500],['x5k','5,000 XP','Earn 5,000 XP',()=>S.xp,5000],
 ['fat','Umm al-Kitāb','Memorise al-Fātiḥah',()=>range(0,6).filter(memo).length,7],['a50','Fifty āyāt','Memorise 50 āyāt',()=>memList().length,50],['a564','Juz ʿAmma','Memorise all of Juz ʿAmma',()=>D.ayahs.filter((a,i)=>a[3]===30&&memo(i)).length,564],
 ['a1k','A thousand āyāt','Memorise 1,000 āyāt',()=>memList().length,1000],['hafiz','Ḥāfiẓ','Memorise the whole Quran',()=>memList().length,6236],
 ['w100','100 words','Learn 100 Quranic words',()=>Object.values(S.lex).filter(x=>x.n>0).length,100],['w500','500 words','Learn 500 Quranic words',()=>Object.values(S.lex).filter(x=>x.n>0).length,500],
 ['g10','Grammarian','Pass 10 Arabic lessons',()=>LESSONS.filter(l=>l.track==='arabic'&&S.gram[l.id]&&S.gram[l.id].done).length,10],['gall','Naḥw complete','Pass all 40 Arabic lessons',()=>LESSONS.filter(l=>l.track==='arabic'&&S.gram[l.id]&&S.gram[l.id].done).length,40],
 ['tall','Mujawwid','Pass all 16 tajwīd lessons',()=>LESSONS.filter(l=>l.track==='tajwid'&&S.gram[l.id]&&S.gram[l.id].done).length,16],['r100','Keeper','Recite 100 reviews',()=>S.stats.reviews,100]];
function checkAch(){const out=[];for(const [id,t,d,f,n] of ACH){if(PRESS&&id[0]==='x')continue;if(!S.ach[id]&&f()>=n){S.ach[id]=ymd(new Date());out.push({id,t})}}if(out.length)save();return out}
R.profile=()=>{checkAch();const mem=memList();const per={},tot={};D.ayahs.forEach((a,i)=>{tot[a[3]]=(tot[a[3]]||0)+1;if(memo(i))per[a[3]]=(per[a[3]]||0)+1});
  const days=[];const d0=new Date();for(let k=0;k<119;k++){const x=new Date(d0);x.setDate(d0.getDate()-118+k);days.push(((S.days[ymd(x)]||{}).xp)||0)}
  const wk=range(6,0).map(k=>{const x=new Date();x.setDate(x.getDate()-k);return [x.toLocaleDateString(undefined,{weekday:'short'}),(S.days[ymd(x)]||{}).xp||0]});const mx=Math.max(S.set.goal,...wk.map(w=>w[1]));
  const bySurah={};mem.forEach(i=>{bySurah[A(i)[0]]=(bySurah[A(i)[0]]||0)+1});
  V().innerHTML=`<div class="spread"><div><div class="eyebrow">${PRESS?'Record':'Profile'}</div><h1>${PRESS?'What you have kept.':'Your progress'}</h1></div>${topStats()}</div>
  <div class="grid g4"><div class="card stat"><b>${streak()}</b><span>${PRESS?'days in a row':'day streak'}</span></div><div class="card stat"><b>${(PRESS?S.stats.lessons:S.xp).toLocaleString()}</b><span>${PRESS?'lessons kept':'total XP'}</span></div><div class="card stat"><b>${mem.length.toLocaleString()}</b><span>āyāt memorised (${pct(mem.length,6236)}%)</span></div><div class="card stat"><b>${Object.values(S.lex).filter(x=>x.n>0).length}</b><span>words learned</span></div></div>
  <div class="grid g2"><div class="card"><h2>This week</h2><svg viewBox="0 0 280 120" role="img" aria-label="${PRESS?'Work per day this week':'XP per day this week'}" style="width:100%;height:auto">${wk.map(([l,v],k)=>{const h=Math.round(80*v/mx);return `<rect x="${12+k*38}" y="${92-h}" width="26" height="${Math.max(2,h)}" rx="5" fill="var(--${v>=S.set.goal?'gold':'lapis'})"></rect><text x="${25+k*38}" y="110" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(l)}</text><text x="${25+k*38}" y="${86-h}" text-anchor="middle" font-size="10" fill="var(--ink)">${PRESS?'':v||''}</text>`}).join('')}<line x1="6" x2="274" y1="${92-Math.round(80*S.set.goal/mx)}" y2="${92-Math.round(80*S.set.goal/mx)}" stroke="var(--gold)" stroke-dasharray="4 4"></line></svg><div class="small muted">${PRESS?'Dashed line: your daily portion.':`Dashed line: daily goal of ${S.set.goal} XP.`}</div></div>
   <div class="card"><h2>Last 17 weeks</h2><div class="heat">${days.map(v=>`<i class="${v>=S.set.goal?'l3':v>=10?'l2':v>0?'l1':''}"></i>`).join('')}</div><div class="juzmap" id="jm">${range(1,30).map(j=>`<div data-j="${j}" title="Juzʾ ${j}: ${pct(per[j]||0,tot[j])}%"><i style="width:${pct(per[j]||0,tot[j])}%"></i><span>${j}</span></div>`).join('')}</div><div class="small muted">Juzʾ grid: green fill is the share memorised.</div></div></div>
  <div class="card"><h2>${PRESS?'Marks':'Achievements'}</h2><div class="ach">${ACH.filter(a=>!PRESS||a[0][0]!=='x').map(([id,t,d,f,n])=>{if(PRESS)[t,d]=pressMark(id,t,d);return `<div class="${S.ach[id]?'got':''}">${PRESS?'':ico('star')}<b>${t}</b><span>${d}</span><div class="bar gold"><i style="width:${Math.min(100,pct(f(),n))}%"></i></div></div>`}).join('')}</div></div>
  <div class="card"><h2>Settings</h2><div class="row">
    <label class="field">${PRESS?'Daily portion':'Daily goal'}<select id="sgoal">${[10,20,30,50,80].map((n,k)=>`<option ${n===S.set.goal?'selected':''} value="${n}">${PRESS?['Light: about one lesson','Steady: one or two lessons','Regular: two lessons','Full: three lessons','Long: five lessons'][k]:n+' XP'}</option>`).join('')}</select></label>
    <label class="field" ${PRESS?'hidden':''}>Hearts<select id="shrt"><option value="1" ${S.set.hearts?'selected':''}>On</option><option value="0" ${S.set.hearts?'':'selected'}>Off</option></select></label>
    <label class="field">Sounds<select id="ssnd"><option value="1" ${S.set.sound?'selected':''}>On</option><option value="0" ${S.set.sound?'':'selected'}>Off</option></select></label>
    <label class="field">Transliteration<select id="stl"><option value="easy" ${S.set.tl==='easy'?'selected':''}>Easy English (Bismillaahir-Rahmaan)</option><option value="academic" ${S.set.tl==='academic'?'selected':''}>Academic (bismillāhir-raḥmān)</option><option value="off" ${S.set.tl==='off'?'selected':''}>Off</option></select></label>
    <label class="field">Transliteration in exercises<select id="stlx"><option value="1" ${S.set.tlx!==false?'selected':''}>Show</option><option value="0" ${S.set.tlx===false?'selected':''}>Hide (harder)</option></select></label>
    <label class="field">Language<select id="slang">${LANGS.map(l=>`<option value="${l.code}" ${l.code===S.set.lang?'selected':''}>${esc(l.name)}</option>`).join('')}</select></label>
    <label class="field">Tajwīd colours<select id="stjc"><option value="1" ${S.set.tjc?'selected':''}>On</option><option value="0" ${S.set.tjc?'':'selected'}>Off</option></select></label>
    <label class="field">Path<select id="so"><option value="back" ${S.set.order==='back'?'selected':''}>al-Fātiḥah, then an-Nās → al-Baqarah</option><option value="fwd" ${S.set.order==='fwd'?'selected':''}>Mushaf order</option></select></label>
    <label class="field">Translation<select id="st">${TRO().map(k=>`<option value="${k}" ${k===trSel()?'selected':''}>${TRN[k]}</option>`).join('')}</select></label>
    <label class="field">Review cap<select id="sr">${[20,50,100,300].map(n=>`<option ${n===S.set.rev?'selected':''}>${n}</option>`).join('')}</select></label></div>
   <div class="small muted">Progress is saved in this browser. Copy a backup now and then; paste it back to restore or move devices.</div>
   <div class="row"><button class="btn sm" id="bk">Copy backup</button><button class="btn sm" id="rs2">Restore</button><button class="btn sm ghost" id="rz">Reset everything…</button></div><div id="bkbox"></div></div>
  <div class="card"><div class="spread"><h2>Sūrahs you already know</h2><span class="small muted">${PRESS?'Mark a sūrah you already know and it goes straight to review.':'Mark them: they skip the path and go straight to review.'}</span></div>
   ${PRESS?`<ul class="passages known">${D.surahs.map(s=>{const m=bySurah[s[0]]||0;return `<li><div class="pa-t"><b>${s[0]}. ${esc(s[1])}</b><small>${s[7]} āyāt${m?' · '+m+' memorised':''}</small></div><span class="pa-ar" lang="ar" aria-hidden="true">${esc(s[3])}</span>${m<s[7]?`<button class="tlink" data-know="${s[0]}">I know it</button>`:'<span class="pa-kept">Complete</span>'}</li>`}).join('')}</ul></div>`:`<div class="tbl"><table><thead><tr><th>#</th><th>Sūrah</th><th class="n">Āyāt</th><th style="width:30%">Memorised</th><th></th></tr></thead><tbody>${D.surahs.map(s=>{const m=bySurah[s[0]]||0;return `<tr><td class="n">${s[0]}</td><td><b>${esc(s[1])}</b> <span class="ar">${esc(s[3])}</span></td><td class="n">${s[7]}</td><td><div class="bar"><i style="width:${pct(m,s[7])}%"></i></div></td><td>${m<s[7]?`<button class="btn sm" data-know="${s[0]}">I know it</button>`:'<span class="chip g">complete</span>'}</td></tr>`}).join('')}</tbody></table></div></div>`}
  <div class="card small muted"><h3>Sources</h3>${sourcesHTML()}</div>`;
  $('#jm').onclick=e=>{const d=e.target.closest('[data-j]');if(d)go('mushaf',{page:A(D.ayahs.findIndex(a=>a[3]==d.dataset.j))[2]})};
  V().querySelectorAll('[data-know]').forEach(b=>b.onclick=()=>{const s=+b.dataset.know;markKnown(range(SI[s],SI[s]+D.surahs[s-1][7]-1));R.profile();toast(`${sName(s)} added to review`)});
  const on=(id,f)=>$('#'+id).onchange=e=>{f(e.target.value);save();nav()};
  on('sgoal',v=>S.set.goal=+v);on('shrt',v=>S.set.hearts=v==='1');on('ssnd',v=>S.set.sound=v==='1');on('stjc',v=>S.set.tjc=v==='1');on('so',v=>{S.set.order=v;buildOrder();buildUnits()});on('st',v=>{S.set.tr=+v;S.set.trPicked=1});on('stl',v=>{S.set.tl=v});on('stlx',v=>{S.set.tlx=v==='1'});on('slang',v=>{S.set.lang=v;save();location.reload()});on('sr',v=>S.set.rev=+v);
  $('#bk').onclick=()=>{const t=JSON.stringify(S);$('#bkbox').innerHTML=`<textarea id="bkt" rows="4" style="width:100%;margin-top:8px" readonly>${esc(t)}</textarea>`;const ta=$('#bkt');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Backup copied')).catch(()=>{ta.select();toast('Select all and copy the text')})};
  $('#rs2').onclick=()=>{$('#bkbox').innerHTML=`<textarea id="rst" rows="4" style="width:100%;margin-top:8px" placeholder="Paste a backup here"></textarea><button class="btn sm pri" id="rsg">Restore</button>`;$('#rsg').onclick=()=>{try{const o=JSON.parse($('#rst').value);if(!o.ay||!o.set)throw 0;S=o;save();location.reload()}catch(e){toast('That text is not a Sabaq backup')}}};
  $('#rz').onclick=()=>{$('#bkbox').innerHTML=`<div class="note">${PRESS?'This erases every memorised āyah, every word and every day kept in this browser.':'This erases every memorised āyah, word, XP and streak in this browser.'} <button class="btn sm bad" id="rzy">Erase everything</button> <button class="btn sm ghost" id="rzn">Keep it</button></div>`;$('#rzy').onclick=()=>{try{localStorage.removeItem(SK)}catch(e){}location.reload()};$('#rzn').onclick=()=>$('#bkbox').innerHTML=''};
};
function pressColophon(){return window.SABAQ_PRESS?`<div class="colophon"><b>Sabaq, The Foundations Press edition</b><span>Edition of ${window.SABAQ_EDITION||''}. A study tool. Its texts have not yet been through the Press’s scholarly review, and it issues no rulings. Report an error to the Press and it is recorded on the <a href="/errata/">errata page</a>.</span><span>Left out of this edition because their publishers hold the rights: the Abdel Haleem, Usmani and Bridges translations, the abridged Ibn Kathīr, and the Tafhīm introductions.</span></div>`:''}
function sourcesHTML(){return pressColophon()+`<div>Quran text: Uthmani Ḥafṣ (King Fahd Complex script) via the Quran.com API, checked against <a href="https://tanzil.net" target="_blank" rel="noopener">Tanzil</a> Uthmani 1.1 (CC BY 3.0). Page and line layout: the 604-page Madani mushaf. Tajwīd colouring: Quran.com.</div>
 <div>${PUB?'Translations: Saheeh International (non-commercial use with credit), Pickthall, Yusuf Ali, Hilali &amp; Khan. Tafsīr: al-Muyassar and as-Saʿdī. Copyrighted translations and commentary are left out of this public copy.':'Translations: Saheeh International, Abdel Haleem, Taqi Usmani, Pickthall, Yusuf Ali, Bridges, Hilali &amp; Khan. Tafsīr: al-Muyassar, as-Saʿdī, Ibn Kathīr (abridged). Sūrah introductions: Quran.com.'} Word-by-word glosses, transliteration and word audio: Quran.com.</div>
 <div>Grammar, roots, lemmas and verb forms: the <a href="https://corpus.quran.com" target="_blank" rel="noopener">Quranic Arabic Corpus</a> 0.4 (GPL), corrected edition by mustafa0x. Recitation: ʿAbd al-Bāsiṭ ʿAbd aṣ-Ṣamad (murattal), everyayah.com.</div>
 <div>Course order: Safina Society’s <i>Arabic Grammar in 40 Lessons</i> and <i>The Science of Tajwid</i> (Shadee Elmasry), and the sarf topics of <i>From the Treasures of Arabic Morphology</i>. The lesson texts here are written fresh for Sabaq. Nuh Ha Mim Keller’s <i>The Quran Beheld</i> is not included: it has no licensed digital text.</div>`}

/* ========== navigation & boot ========== */
const VIEWS=window.SABAQ_PRESS?[['learn','Today','learn'],['practice','Review','practice'],['mushaf','Mushaf','mushaf'],['library','Library','library'],['profile','Record','profile']]:[['learn','Learn','learn'],['practice','Practice','practice'],['mushaf','Mushaf','mushaf'],['library','Library','library'],['profile','Profile','profile']];
let cur='learn';
function nav(){const due=dueAyat().length;$('#nav').innerHTML=VIEWS.map(([k,l,ic])=>`<button data-v="${k}" ${k===cur?'aria-current="page"':''}>${ico(ic)}<span>${l}</span>${k==='practice'&&due?`<span class="badge">${due}</span>`:''}</button>`).join('')}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)});
function go(v,arg){stopAudio();if(!R[v])v='learn';const navv=VIEWS.some(x=>x[0]===v)?v:(v==='hifz'?'learn':v==='words'?'library':cur);cur=navv;nav();$('#view').innerHTML='';window.scrollTo(0,0);R[v](arg);try{history.replaceState(null,'','#'+navv)}catch(e){}}
const V=()=>$('#view');
let keyOpts=null;
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea'))return;
  if(/^[1-9]$/.test(e.key)&&keyOpts){keyOpts(+e.key-1);return}
  if(e.key==='Enter'){const b=$('#fbtn');if(b&&!b.disabled){e.preventDefault();b.click()}}});
(async()=>{
  try{
    const firstRun=window.SABAQ_PRESS&&!S.welcomed&&!(S.stats&&S.stats.lessons);
    /* The welcome needs no data. It is put on screen and given one frame to paint before the mushaf is read:
       parsing three megabytes first could hold the headline back by seconds on a slow phone. */
    let welcomeP=null;
    if(firstRun){welcomeP=pressWelcome();await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,60)))}else{const w0=$('#welcome');if(w0)w0.remove()}
    const dataP=Promise.all([J('data/core.json'),J('data/lessons.json'),J('data/sim.json')]);dataP.catch(()=>{});
    if(welcomeP)await welcomeP;
    [D,LESSONS,SIM]=await dataP;
    D.ayahs.forEach((a,i)=>{KEY[a[0]+':'+a[1]]=i;if(a[1]===1)SI[a[0]]=i});
    if(window.SABAQ_NAMES)D.surahs.forEach((s,i)=>{if(window.SABAQ_NAMES[i])s[1]=window.SABAQ_NAMES[i]});
    buildOrder();buildUnits();hearts();await loadLang(S.set.lang);i18nWatch();nav();
    const h=(location.hash||'').slice(1);go(VIEWS.some(v=>v[0]===h)?h:'learn');
  }catch(e){console.error(e);V().innerHTML=`<div class="card"><h2>The mushaf data did not load</h2><div class="muted">${esc(e.message)}. Reload the page; if it persists, the data files are missing from this copy.</div></div>`}
})();

</script>
