<style>
/* Layout: a fixed left rail of stations (Today → Progress) beside one working column; the mushaf line is the hero element everywhere. */
:root{
  --bg:#EEF0EC; --panel:#FBFBF9; --sunk:#E4E7E1; --ink:#17202B; --muted:#5A6472; --line:#D3D8D0;
  --lapis:#1C4C86; --lapis-soft:#DCE5F1; --gold:#9C6F12; --gold-soft:#F1E6CC; --good:#2B7A4B; --good-soft:#DCEFE3; --bad:#B0281E; --bad-soft:#F6DEDB;
  --quran:"Amiri Quran","Amiri","Scheherazade New","Noto Naskh Arabic","Geeza Pro",serif;
  --kufi:"Reem Kufi","IBM Plex Sans",system-ui,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D131B; --panel:#141C27; --sunk:#1A2431; --ink:#E5E9EF; --muted:#97A2B1; --line:#263345;
  --lapis:#86AEE6; --lapis-soft:#1D2D45; --gold:#D8B260; --gold-soft:#3A2F17; --good:#63C38E; --good-soft:#173324; --bad:#F08A80; --bad-soft:#3D1D1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D131B; --panel:#141C27; --sunk:#1A2431; --ink:#E5E9EF; --muted:#97A2B1; --line:#263345;
  --lapis:#86AEE6; --lapis-soft:#1D2D45; --gold:#D8B260; --gold-soft:#3A2F17; --good:#63C38E; --good-soft:#173324; --bad:#F08A80; --bad-soft:#3D1D1B; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15px/1.55 var(--sans);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--lapis)}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--panel)}
.brand{font:700 26px/1 var(--kufi);color:var(--lapis);padding:0 10px 4px;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font:500 20px/1 var(--kufi);color:var(--gold)}
.tagline{font-size:12px;color:var(--muted);padding:0 10px 14px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--lapis-soft);color:var(--lapis)}
.nav button:focus-visible{outline:2px solid var(--lapis);outline-offset:1px}
.badge{font:500 11px/1 var(--mono);padding:3px 6px;border-radius:99px;background:var(--gold-soft);color:var(--gold)}
.railfoot{margin-top:auto;font-size:11px;color:var(--muted);padding:0 10px}
main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:700 30px/1.15 var(--kufi);margin:0;text-wrap:balance}
h2{font:600 19px/1.3 var(--sans);margin:0;text-wrap:balance}
h3{font:600 15px/1.3 var(--sans);margin:0}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--lapis)}
.btn:focus-visible,.opt:focus-visible,.wtap:focus-visible{outline:2px solid var(--lapis);outline-offset:2px}
.btn.pri{background:var(--lapis);border-color:var(--lapis);color:var(--panel)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--panel)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:600 26px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lapis);border-radius:99px}
.bar.gold i{background:var(--gold)}
/* Quran text */
.q{font-family:var(--quran);direction:rtl;text-align:right;font-size:30px;line-height:2.15;word-spacing:.06em}
.q.lg{font-size:36px} .q.md{font-size:26px} .q.sm{font-size:22px;line-height:1.9}
.ar{font-family:var(--quran);direction:rtl;font-size:1.25em}
.num{font-family:var(--quran);color:var(--gold);font-size:.8em;padding:0 .15em;white-space:nowrap}
.wtap{cursor:pointer;border-radius:6px;padding:0 .06em;transition:background .15s}
.wtap:hover{background:var(--gold-soft)}
.wtap.sel{background:var(--lapis-soft);color:var(--lapis)}
.hid{color:transparent;background:var(--sunk);border-radius:6px;cursor:pointer;user-select:none}
.hint{color:var(--muted)}
.tr{font-size:15px;color:var(--ink)}
.tr .ref{font:500 12px var(--mono);color:var(--muted);margin-right:6px}
.wbw{display:flex;flex-wrap:wrap;direction:rtl;gap:8px}
.wbw div{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;min-width:64px;background:var(--panel);cursor:pointer}
.wbw div:hover{border-color:var(--gold)}
.wbw .wa{font-family:var(--quran);font-size:24px;line-height:1.7}
.wbw .wt{font-size:11px;color:var(--muted);direction:ltr}
.wbw .wg{font-size:12px;direction:ltr;text-align:center;max-width:120px}
/* Mushaf page */
.page{container-type:inline-size;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px 20px;box-shadow:0 0 0 6px var(--sunk) inset}
.mline{font-family:var(--quran);direction:rtl;font-size:clamp(14px,4.3cqi,30px);line-height:2.05;text-align:justify;text-align-last:justify;min-height:2.05em;white-space:nowrap;overflow:hidden}
.mline.c{text-align:center;text-align-last:center}
.sh .sa{font-family:var(--quran);font-size:21px;font-weight:400}
.sh{font:700 15px/1.4 var(--kufi);text-align:center;color:var(--lapis);border:1px solid var(--line);border-radius:6px;padding:9px;margin:4px 0;background:var(--lapis-soft)}
.aytap{cursor:pointer;border-radius:4px}
.aytap:hover,.aytap.on{background:var(--gold-soft)}
.aytap.mem{color:var(--good)}
.pnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pnav input,.pnav select,.field input,.field select,.field textarea{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
/* Quiz */
.opts{display:grid;gap:10px}
.opt{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel);display:flex;gap:10px;align-items:center}
.opt:hover{border-color:var(--lapis)}
.opt .k{font:500 12px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.arq{font-family:var(--quran);font-size:24px;direction:rtl;justify-content:flex-start;line-height:1.8}
.fb{border-radius:8px;padding:10px 12px;font-size:14px}
.fb.ok{background:var(--good-soft);color:var(--good)} .fb.no{background:var(--bad-soft);color:var(--bad)}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grades .btn{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px}
.grades .btn small{font:400 11px var(--mono);color:var(--muted)}
.gA{border-color:var(--bad)!important} .gH{border-color:var(--gold)!important} .gG{border-color:var(--good)!important} .gE{border-color:var(--lapis)!important}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font:500 12px var(--mono);padding:5px 10px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.steps span.on{background:var(--lapis);color:var(--panel)}
.steps span.done{background:var(--good-soft);color:var(--good)}
.chip{font:500 11px var(--mono);padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.m{background:var(--gold-soft);color:var(--gold)} .chip.d{background:var(--lapis-soft);color:var(--lapis)}
.list{display:flex;flex-direction:column}
.list>div{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);align-items:center}
.list>div:last-child{border-bottom:0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.juzmap{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.juzmap div{border-radius:6px;padding:6px 4px;text-align:center;font:500 12px var(--mono);background:var(--sunk);position:relative;overflow:hidden}
.juzmap div i{position:absolute;left:0;bottom:0;top:0;background:var(--good-soft);z-index:0}
.juzmap div span{position:relative}
.heat{display:flex;flex-wrap:wrap;gap:3px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--sunk)}
.heat i.l1{background:var(--good-soft)} .heat i.l2{background:color-mix(in srgb,var(--good) 55%,var(--good-soft))} .heat i.l3{background:var(--good)}
.lex{font-family:var(--quran);font-size:52px;line-height:1.6;text-align:center;direction:rtl}
.flip{min-height:140px;justify-content:center;text-align:center}
.lesson p{margin:0 0 10px;max-width:68ch}
.lesson ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.ex{border-left:3px solid var(--gold);padding:4px 12px}
.mark{background:var(--gold-soft);color:var(--gold);border-radius:5px;padding:0 .1em}
.sheet{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 35%,transparent);display:flex;justify-content:flex-end;z-index:20}
.sheet>div{width:min(560px,100%);height:100%;overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:22px max(18px,env(safe-area-inset-right,0px)) 40px 22px;display:flex;flex-direction:column;gap:14px}
.tafsir{font-size:15px;line-height:1.7}
.tafsir.arx{font-family:"Amiri","Noto Naskh Arabic","Geeza Pro",serif;direction:rtl;text-align:right;font-size:19px;line-height:2}
.tafsir .ar{color:var(--lapis)}
.tafsir h2,.tafsir h3{font-size:15px;margin:10px 0 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--lapis-soft);color:var(--lapis)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:40}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:10px 12px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.kbd{font:500 11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:10;flex-direction:row;align-items:center;padding:10px max(12px,env(safe-area-inset-left,0px));gap:10px;border-right:0;border-bottom:1px solid var(--line)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
  .brand{font-size:20px;padding:0} .brand small,.tagline,.railfoot{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;min-width:0}
  .nav button{padding:7px 10px;white-space:nowrap}
  .nav .badge{display:none}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .q{font-size:26px} .q.lg{font-size:30px}
  .juzmap{grid-template-columns:repeat(6,minmax(0,1fr))}
}
@media (max-width:480px){.g2{grid-template-columns:minmax(0,1fr)} .grades{grid-template-columns:repeat(2,minmax(0,1fr))} h1{font-size:25px} .page{padding:14px 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div class="app">
  <aside class="rail">
    <div class="brand">Sabaq <small>سَبَق</small></div>
    <div class="tagline">Ḥifẓ, meaning and Arabic, from one mushaf.</div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="railfoot">Text: Tanzil &amp; Quran.com (Ḥafṣ). Grammar: Quranic Arabic Corpus.</div>
  </aside>
  <main><div class="wrap" id="view"><div class="loading">Opening the mushaf…</div></div></main>
</div>
<div id="sheet" hidden></div>

<script>
'use strict';
/* ========== utilities ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AD=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const range=(a,b)=>{const r=[];if(a<=b)for(let i=a;i<=b;i++)r.push(i);else for(let i=a;i>=b;i--)r.push(i);return r};
const pct=(a,b)=>b?Math.round(1000*a/b)/10:0;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
async function J(p){const r=await fetch(p);if(!r.ok)throw new Error(p+' → '+r.status);return r.json()}
const sk=w=>w.replace(/[^ء-غف-يٱ]/g,'').replace(/[ٱأإآ]/g,'ا').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ء/g,'');

/* ========== data ========== */
let D, KEY={}, SI={}, LESSONS=[], SIM={};
const WJ={}, TRC={}, TFC={}; let INFO=null;
const A=i=>D.ayahs[i];             // s,a,page,juz,hizb,rub,sajda,words,line0,line1,ruku,page1,sahih
const sName=s=>D.surahs[s-1][1];
const ref=i=>A(i)[0]+':'+A(i)[1];
function juzWords(j){if(!WJ[j])WJ[j]=J(`data/w/${String(j).padStart(2,'0')}.json`);return WJ[j]}
async function W(i){const a=A(i);return (await juzWords(a[3]))[a[0]+':'+a[1]]}
const PUB=!!window.SABAQ_PUBLIC;
const TRN={20:'Saheeh International',85:'Abdel Haleem',84:'Taqi Usmani',19:'Pickthall',22:'Yusuf Ali',149:'Bridges (Fadel Soliman)',203:'Hilali & Khan'};
if(PUB){delete TRN[85];delete TRN[84];delete TRN[149]}
const TRO=()=>[20,85,84,19,22,149,203].filter(k=>TRN[k]);const trSel=()=>TRN[S.set.tr]?+S.set.tr:20;
async function trText(i,id){id=+id;if(!TRN[id])id=20;if(id===20)return A(i)[12];if(!TRC[id])TRC[id]=J(`data/t/${id}.json`);return (await TRC[id])[i]}
const TFN={16:['Tafsīr al-Muyassar','ar'],91:['Tafsīr as-Saʿdī','ar'],169:['Ibn Kathīr (abridged, English)','en']};
if(PUB)delete TFN[169];
async function tafsir(i,id){if(!TFN[id])id=16;
  for(let k=i;k>=0&&A(k)[0]===A(i)[0];k--){
    const j=A(k)[3],key=id+'/'+j;
    if(!TFC[key])TFC[key]=J(`data/tf/${id}/${String(j).padStart(2,'0')}.json`).catch(()=>({}));
    const t=(await TFC[key])[ref(k)];
    if(t)return {html:t,from:k};
  }
  return null;
}
function lineCodes(i){const a=A(i),o=[];for(let p=a[2];p<=a[11];p++){const l0=p===a[2]?a[8]:1,l1=p===a[11]?a[9]:15;for(let l=l0;l<=l1;l++)o.push(p*16+l)}return o}
function countLines(list){const s=new Set();list.forEach(i=>lineCodes(i).forEach(c=>s.add(c)));return s.size}

/* ========== state ========== */
const SK='sabaq_v1';
let S={};try{S=JSON.parse(localStorage.getItem(SK))||{}}catch(e){S={}}
S=Object.assign({ay:{},lex:{},gram:{},days:{},games:{},set:{}},S);
S.set=Object.assign({daily:5,order:'back',tr:20,tf:16,rev:150,lexNew:10,pool:'mem'},S.set);
function save(){try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}}
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dnum=s=>Math.round(Date.parse(s+'T00:00:00Z')/864e5);
const TD=()=>dnum(ymd(new Date()));
function dayLog(k,n=1){const d=ymd(new Date());const o=S.days[d]=S.days[d]||{};o[k]=(o[k]||0)+n;save()}
/* SM-2 style scheduling in whole days. g: 0 again, 1 hard, 2 good, 3 easy */
function sched(rec,g){
  const t=TD();rec=rec||{n:0,iv:0,ef:2.4,lp:0};
  if(g===0){rec.n=0;rec.iv=0;rec.lp=(rec.lp||0)+1;rec.ef=Math.max(1.3,rec.ef-.2);rec.due=t}
  else{
    rec.n++;
    if(rec.n===1)rec.iv=g===3?3:1;
    else if(rec.n===2)rec.iv=g===1?2:g===3?6:4;
    else rec.iv=Math.max(rec.iv+1,Math.round(rec.iv*rec.ef*(g===1?.6:g===3?1.3:1)));
    rec.iv=Math.min(rec.iv,365);
    rec.ef=Math.min(2.8,Math.max(1.3,rec.ef+(g===3?.1:g===1?-.15:0)));
    rec.due=t+rec.iv;
  }
  rec.last=t;return rec;
}
const memo=i=>S.ay[i]&&S.ay[i].n>0;
function memList(){return Object.keys(S.ay).map(Number).filter(memo).sort((a,b)=>a-b)}
function dueAyat(){const t=TD();return Object.keys(S.ay).map(Number).filter(i=>S.ay[i].due<=t).sort((a,b)=>a-b)}

/* ========== hifz order ========== */
let ORDER=[];
function buildOrder(){
  const surs=S.set.order==='back'?[1,...range(114,2)]:range(1,114);
  ORDER=[];for(const s of surs){const n=D.surahs[s-1][7];for(let a=0;a<n;a++)ORDER.push(SI[s]+a)}
}
function nextLesson(){
  const out=[];let ln=0;const tgt=S.set.daily;
  for(const i of ORDER){
    if(S.ay[i])continue;
    if(out.length&&A(i)[0]!==A(out[out.length-1])[0]){if(ln>=tgt*.6)break}
    if(out.length&&i!==out[out.length-1]+1&&A(i)[0]===A(out[out.length-1])[0])break;
    out.push(i);ln=countLines(out);if(ln>=tgt)break;
  }
  if(out.length){let rest=[],k=out[out.length-1]+1;while(k<6236&&A(k)[0]===A(out[0])[0]&&!S.ay[k]){rest.push(k);k++}if(rest.length&&countLines([...out,...rest])-ln<=Math.max(3,tgt*.6))out.push(...rest)}
  return out;
}

/* ========== rendering helpers ========== */
function ayahHTML(i,opts={}){
  const w=A(i)[7];
  const words=w.map((x,k)=>`<span class="wtap" data-i="${i}" data-k="${k}">${esc(x)}</span>`).join(' ');
  return words+` <span class="num">﴿${AD(A(i)[1])}﴾</span>`;
}
function fadeHTML(i,level,seed){
  const w=A(i)[7];
  return w.map((x,k)=>{
    let show=true;
    if(level===1)show=(k+seed)%2===0;
    else if(level>=2)show=false;
    if(show)return `<span>${esc(x)}</span>`;
    if(level===2){const M='[\u064b-\u065f\u0670\u06d6-\u06ed]*';const f=x.match(new RegExp('^(?:[\u0648\u0641]'+M+')?(?:[\u0671\u0627]\u0644'+M+')?[\u0621-\u064a\u0671]'+M));return `<span class="hint">${esc(f?f[0]:x[0])}…</span>`}
    return `<span class="hid" data-reveal="${esc(x)}">${esc(x)}</span>`;
  }).join(' ')+` <span class="num">﴿${AD(A(i)[1])}﴾</span>`;
}

const AUDIO_BASE='https://everyayah.com/data/Abdul_Basit_Murattal_192kbps/';
let player=null,audioBlocked=false;
function playAyat(list,reps=1,onEnd){
  if(player){player.pause();player=null}
  const q=[];list.forEach(i=>{for(let r=0;r<reps;r++)q.push(i)});
  let k=0;const au=new Audio();player=au;
  const go=()=>{if(k>=q.length||player!==au){onEnd&&onEnd();return}const a=A(q[k]);au.src=AUDIO_BASE+String(a[0]).padStart(3,'0')+String(a[1]).padStart(3,'0')+'.mp3';au.play().catch(err)};
  const err=()=>{if(player!==au)return;audioBlocked=true;toast('Audio is blocked in this view. Use the Quran.com ↗ link beside Play to hear the āyah.');player=null};
  au.onended=()=>{k++;go()};au.onerror=err;go();
}
function stopAudio(){if(player){player.pause();player=null}}

    B.querySelectorAll('[data-ay]').forEach(c=>c.querySelectorAll('[data-gr]').forEach(g=>g.onclick=()=>{
      H.grades[c.dataset.ay]=+g.dataset.gr;c.querySelectorAll('[data-gr]').forEach(x=>x.style.opacity=x===g?1:.4);
      $('#hdone').disabled=Object.keys(H.grades).length<L.length;
    }));
    $('#hdone').onclick=()=>{
      L.forEach(i=>{const g=H.grades[i];S.ay[i]=sched(null,g===0?0:g);S.ay[i].t0=TD();if(g===0){S.ay[i].n=1;S.ay[i].iv=0;S.ay[i].due=TD()}});
      dayLog('new',L.length);save();
      const done=L.length;H=null;
      V().innerHTML=`<div class="card"><div class="eyebrow">Sealed</div><h1>${done} āyāt added to your mushaf</h1>
      <div class="muted">They come back tomorrow, then at growing intervals. Āyāt you marked "Again" are due again today.</div>
      <div class="row"><button class="btn pri" id="d1">Review what is due</button><button class="btn" id="d2">Back to Today</button><button class="btn" id="d3">Test this passage</button></div></div>`;
      $('#d1').onclick=()=>go('review');$('#d2').onclick=()=>go('today');$('#d3').onclick=()=>go('games',{game:'next',scope:L});
      nav();
    };
  }

/* ========== word-by-word & ayah sheet ========== */
const TAGN={PERF:'past (māḍī)',IMPF:'present (muḍāriʿ)',IMPV:'command (amr)',PASS:'passive',NOM:'nominative (marfūʿ)',ACC:'accusative (manṣūb)',GEN:'genitive (majrūr)',
 'MOOD:IND':'indicative','MOOD:SUBJ':'subjunctive (manṣūb)','MOOD:JUS':'jussive (majzūm)',INDEF:'indefinite',ACT_PCPL:'active participle',PASS_PCPL:'passive participle',VN:'verbal noun (maṣdar)',
 PN:'proper noun',ADJ:'adjective',PRON:'pronoun',DEM:'demonstrative',REL:'relative pronoun',T:'time adverb',LOC:'place adverb',NEG:'negative particle',CONJ:'conjunction',P:'preposition',
 COND:'conditional',INTG:'interrogative',VOC:'vocative',EMPH:'emphatic',CERT:'particle of certainty',SUB:'subordinating',REM:'resumption',DET:'definite article',FUT:'future particle',RES:'restriction',PRO:'prohibition',EXP:'exception',ACC_P:'accusative particle',CIRC:'circumstantial',SUP:'supplemental',RSLT:'result',ANS:'answer',INC:'inceptive',PREV:'preventive',CAUS:'cause',AMD:'amendment',EXL:'explanation',EXH:'exhortation',RET:'retraction',SUR:'surprise',AVR:'aversion',INL:'initial letters',INT:'interpretation',EQ:'equalisation',COM:'comitative',ATT:'attention',ADDR:'addressee',DIST:'distance',NV:'verb-like noun',MD:'modal'};
const ROMAN=['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
function pgnName(t){const m=t.match(/^([123])?([MF])?([SDP])?$/);if(!m||t==='')return null;const p={1:'1st',2:'2nd',3:'3rd'}[m[1]]||'';const g={M:'masculine',F:'feminine'}[m[2]]||'';const n={S:'singular',D:'dual',P:'plural'}[m[3]]||(m[2]&&!m[1]?'singular':'');return [p&&p+' person',g,n].filter(Boolean).join(' ')}
function parseWord(d){
  const [gl,tl,ln,li,ri,pos,tags,aff]=d;const T=tags?tags.split(' '):[];
  const out=[];out.push({N:'Noun (ism)',V:'Verb (fiʿl)',P:'Particle (ḥarf)'}[pos]||pos);
  for(const t of T){
    if(t.startsWith('VF:')){out.push('Form '+ROMAN[+t.slice(3)]);continue}
    if(t.startsWith('FAM:')){out.push('family of '+t.slice(4));continue}
    const p=pgnName(t);if(p){out.push(p);continue}
    if(TAGN[t])out.push(TAGN[t]);
  }
  return out.join(' · ');
}
function affName(a){const t=a[1].slice(1).split(' ');return (a[1][0]==='+'?'prefix ':'suffix ')+a[0]+' = '+t.map(x=>TAGN[x]||pgnName(x)||x).filter(Boolean).join(', ')}

function nextDueTxt(){const t=TD();const ds=Object.values(S.ay).map(r=>r.due).filter(d=>d>t).sort((a,b)=>a-b);if(!ds.length)return 'later';const d=ds[0]-t;return d===1?'tomorrow':`in ${d} days`}

    ${r.k>0?g.slice(0,r.k).map(j=>`<div class="q sm muted">${esc(A(j)[7].join(' '))} <span class="num">﴿${AD(A(j)[1])}﴾</span></div>`).join(''):
     prev!==null?`<div class="small muted">Cue: the āyah before</div><div class="q sm muted">${esc(A(prev)[7].join(' '))} <span class="num">﴿${AD(A(prev)[1])}﴾</span></div>`:'<div class="small muted">Cue: the start of the sūrah</div>'}

  </div>

async function mushafRender(){

  }

        const cls=`aytap${memo(i)?' mem':''}${MP.hl===i?' on':''}`;
        return k<0?`<span class="${cls} num" data-ay="${i}">﴿${AD(A(i)[1])}﴾</span>`:`<span class="${cls}" data-ay="${i}">${esc(A(i)[7][k])}</span>`}).join(' ')+'</div>';
    } else html+=extra[L]||(p<=2?'':'<div class="mline"></div>');
  }

  <div class="pnav">
    <button class="btn sm" id="mp">◂ Prev</button><input id="mpg" type="number" min="1" max="604" value="${p}" style="width:84px" aria-label="Page">

  $('#msr').onkeydown=e=>{if(e.key==='Enter')search(e.target.value)};
}
function fitLines(){document.querySelectorAll('#mpage .mline').forEach(e=>{e.style.fontSize='';if(e.scrollWidth>e.clientWidth+1){const f=parseFloat(getComputedStyle(e).fontSize);e.style.fontSize=(f*e.clientWidth/e.scrollWidth*.985).toFixed(2)+'px'}})}

function search(q){
  q=q.trim();const box=$('#mres');if(!q){box.innerHTML='';return}
  const m=q.match(/^(\d{1,3})\s*[:.]\s*(\d{1,3})$/);
  if(m){const s=+m[1],a=+m[2];if(SI[s]!=null&&a>=1&&a<=D.surahs[s-1][7]){const i=SI[s]+a-1;MP.page=A(i)[2];MP.hl=i;mushafRender().then(()=>openAyah(i))}return}
  let hits=[];

  $('#mrc').onclick=()=>box.innerHTML='';
  box.querySelectorAll('[data-go]').forEach(d=>d.onclick=()=>{const i=+d.dataset.go;MP.page=A(i)[2];MP.hl=i;mushafRender().then(()=>openAyah(i))});

function markKnown(list){

/* ========== WORDS (vocabulary from the Quran) ========== */
function lexQueue(){
  const t=TD();const due=Object.keys(S.lex).map(Number).filter(k=>S.lex[k].due<=t);
  const d=ymd(new Date()),newToday=(S.days[d]&&S.days[d].lexNew)||0;
  const room=Math.max(0,S.set.lexNew-newToday);
  const fresh=lexOrder().filter(k=>!S.lex[k]).slice(0,room);
  return [...due,...fresh];
}
let LEXORD=null,LEXMEMKEY='';
function lexOrder(){
  // lemmas in your memorised āyāt first (by Quran frequency), then the rest by frequency; skip particles of one letter
  const mem=memList();const key=mem.length+':'+Object.values(WJ).filter(p=>p.done).length;
  if(LEXORD&&LEXMEMKEY===key)return LEXORD;
  const all=D.lemmas.map((l,k)=>k).filter(k=>D.lemmas[k][0].replace(/[ً-ٰ]/g,'').length>1).sort((a,b)=>D.lemmas[b][3]-D.lemmas[a][3]);
  const inMem=new Set();
  if(mem.length){for(const i of mem){const j=A(i)[3];if(!WJ[j]||!WJ[j].done)continue;for(const d of WJ[j].done[ref(i)])if(d[3]>=0)inMem.add(d[3])}}
  LEXORD=[...all.filter(k=>inMem.has(k)),...all.filter(k=>!inMem.has(k))];LEXMEMKEY=key;return LEXORD;
}
async function preloadMemWords(){const js=[...new Set(memList().map(i=>A(i)[3]))];for(const j of js){const p=juzWords(j);if(!p.done)p.done=await p}}

  <div class="grid g4">

  </div>

function matchQ(q,d,prev,next){
  const [gl,tl,ln,li,ri,pos,tags,aff]=d;const T=tags?tags.split(' '):[];
  if(q.pos&&pos!==q.pos)return false;
  if(q.tags&&!q.tags.every(t=>T.includes(t)))return false;
  if(q.tagsAny&&!q.tagsAny.some(t=>T.includes(t)))return false;
  if(q.notTags&&q.notTags.some(t=>T.includes(t)))return false;
  if(q.hasRoot&&ri<0)return false;
  if(q.hasCase&&!['NOM','ACC','GEN'].some(t=>T.includes(t)))return false;
  if(q.affHas&&!aff.some(a=>a[1].includes(q.affHas)))return false;
  if(q.weak&&!(ri>=0&&/[ويءأ]/.test(D.roots[ri][0])))return false;
  if(q.afterPrep){const pre=aff.some(a=>a[1]==='+P');const pw=prev&&prev[5]==='P'&&prev[6].split(' ').includes('P')&&!prev[7].some(a=>a[1].includes('PRON'));if(!(T.includes('GEN')&&(pre||pw)))return false}
  if(q.idafa){if(aff.some(a=>a[1].includes('DET'))||T.includes('INDEF')||T.includes('PRON')||T.includes('PN')||!['NOM','ACC','GEN'].some(t=>T.includes(t)))return false;if(!(next&&next[5]==='N'&&next[6].split(' ').includes('GEN')&&!next[7].some(a=>a[1]==='+P')))return false}
  if(q.afterFam){if(!(prev&&prev[6].includes('FAM:')))return false;if(!['NOM','ACC'].some(t=>T.includes(t)))return false}
  return true;
}
const DRILL={
  pos3:{ask:'What kind of word is this?',ans:d=>({N:'Noun (ism)',V:'Verb (fiʿl)',P:'Particle (ḥarf)'})[d[5]],opts:()=>['Noun (ism)','Verb (fiʿl)','Particle (ḥarf)']},
  root:{ask:'What is its root?',ans:d=>d[4]>=0?D.roots[d[4]][0].split('').join(' '):null,opts:a=>{const L=a.replace(/ /g,'');const c=shuffle(D.roots.filter(r=>r[0]!==L&&[...r[0]].some(x=>L.includes(x))&&r[1]>8)).slice(0,3).map(r=>r[0].split('').join(' '));return shuffle([a,...c])},ar:true},
  def:{ask:'Is this noun definite or indefinite?',ans:d=>d[7].some(a=>a[1].includes('DET'))?'Definite (maʿrifa)':d[6].split(' ').includes('INDEF')?'Indefinite (nakira)':null,opts:()=>['Definite (maʿrifa)','Indefinite (nakira)']},
  gender:{ask:'Masculine or feminine?',ans:d=>{const t=d[6].split(' ').find(x=>/^[MF][SDP]?$/.test(x));return t?(t[0]==='M'?'Masculine':'Feminine'):null},opts:()=>['Masculine','Feminine']},
  number:{ask:'Singular, dual or plural?',ans:d=>{const t=d[6].split(' ').find(x=>/^[MF][SDP]?$/.test(x));return t?({S:'Singular',D:'Dual',P:'Plural'})[t[1]||'S']:null},opts:()=>['Singular','Dual','Plural']},
  case:{ask:'Which case is it in?',ans:d=>{const T=d[6].split(' ');return T.includes('NOM')?'Nominative (marfūʿ)':T.includes('ACC')?'Accusative (manṣūb)':T.includes('GEN')?'Genitive (majrūr)':null},opts:()=>['Nominative (marfūʿ)','Accusative (manṣūb)','Genitive (majrūr)']},
  pgn:{ask:'Who is doing the action?',ans:d=>{const t=d[6].split(' ').find(x=>/^[123][MF]?[SDP]$/.test(x));return t?pgnName(t):null},opts:a=>{const all=['3MS','3FS','3MD','3MP','3FP','2MS','2FS','2MP','1S','1P'].map(pgnName);return shuffle([a,...shuffle(all.filter(x=>x!==a)).slice(0,3)])}},
  tense:{ask:'Past, present or command?',ans:d=>{const T=d[6].split(' ');return T.includes('PERF')?'Past (māḍī)':T.includes('IMPF')?'Present (muḍāriʿ)':T.includes('IMPV')?'Command (amr)':null},opts:()=>['Past (māḍī)','Present (muḍāriʿ)','Command (amr)']},
  mood:{ask:'Which mood is this present-tense verb in?',ans:d=>{const T=d[6].split(' ');return T.includes('MOOD:IND')?'Indicative (marfūʿ)':T.includes('MOOD:SUBJ')?'Subjunctive (manṣūb)':T.includes('MOOD:JUS')?'Jussive (majzūm)':null},opts:()=>['Indicative (marfūʿ)','Subjunctive (manṣūb)','Jussive (majzūm)']},
  voice:{ask:'Active or passive?',ans:d=>d[5]==='V'?(d[6].split(' ').includes('PASS')?'Passive':'Active'):null,opts:()=>['Active','Passive']},
  form:{ask:'Which verb form (wazn) is it?',ans:d=>{const t=d[6].split(' ').find(x=>x.startsWith('VF:'));return t?'Form '+ROMAN[+t.slice(3)]:null},opts:a=>{const all=range(1,10).map(n=>'Form '+ROMAN[n]).filter(x=>x!=='Form IX');return shuffle([a,...shuffle(all.filter(x=>x!==a)).slice(0,3)])}},
  pcpl:{ask:'Active or passive participle?',ans:d=>{const T=d[6].split(' ');return T.includes('ACT_PCPL')?'Active participle (ism fāʿil)':T.includes('PASS_PCPL')?'Passive participle (ism mafʿūl)':null},opts:()=>['Active participle (ism fāʿil)','Passive participle (ism mafʿūl)']},
  pron:{ask:'Whom does the attached pronoun refer to?',ans:d=>{const a=d[7].find(x=>x[1].includes('PRON'));if(!a)return null;const t=a[1].split(' ').find(x=>/^[123][MF]?[SDP]$/.test(x));return t?pgnName(t):null},opts:a=>{const all=['3MS','3FS','3MD','3MP','3FP','2MS','2MP','1S','1P'].map(pgnName);return shuffle([a,...shuffle(all.filter(x=>x!==a)).slice(0,3)])}},
  gloss:{ask:'What does it mean here?',ans:d=>d[0]||null,opts:(a,pool)=>{const nk=x=>x.toLowerCase().replace(/[()\[\].,]/g,'').trim();const seen=new Set([nk(a)]);const o=[];for(const x of shuffle(pool)){if(!x)continue;const k=nk(x);if(seen.has(k))continue;seen.add(k);o.push(x);if(o.length>=3)break}return shuffle([a,...o])}}
};
async function findExamples(q,want=40){
  const mem=memList();const out=[];const seen=new Set();
  const scan=async(list)=>{for(const i of list){if(out.length>=want)return;const ws=await W(i);for(let k=0;k<ws.length;k++){if(matchQ(q,ws[k],ws[k-1],ws[k+1])){const key=i+':'+k;if(!seen.has(key)){seen.add(key);out.push([i,k])}}}}};
  await scan(shuffle(mem));
  if(out.length<want&&q.juz){await juzWords(q.juz);await scan(shuffle(D.ayahs.map((a,i)=>i).filter(i=>A(i)[3]===q.juz)))}
  if(out.length<want){for(const j of shuffle(range(1,30)).slice(0,3)){await juzWords(j);await scan(shuffle(D.ayahs.map((a,i)=>i).filter(i=>A(i)[3]===j)).slice(0,300));if(out.length>=want)break}}
  return out;
}

/* ========== generic quiz runner ========== */
let keyOpts=null;
function runQuiz(cfg){
  let r=0,score=0;const n=cfg.n;
  const step=async()=>{
    if(r>=n){keyOpts=null;dayLog('q',n);dayLog('ok',score);
      const extra=cfg.done?cfg.done(score,n):'';
      V().innerHTML=`<div class="card"><div class="eyebrow">${esc(cfg.title)}</div><h1>${score} / ${n}</h1><div class="muted">${score===n?'Flawless.':score>=n*.8?'Strong. Repeat tomorrow to lock it in.':'Go back over the ones you missed, then try again.'}</div>${extra||`<div class="row"><button class="btn pri" id="qa">Play again</button><button class="btn" id="qb">All tests</button></div>`}</div>`;
      if(cfg.after)cfg.after();else{$('#qa').onclick=()=>cfg.again?cfg.again():go('games');$('#qb').onclick=()=>go('games')}
      return}
    const it=await cfg.make(r);
    if(!it){r++;step();return}
    V().innerHTML=`<div class="spread"><div><div class="eyebrow">${esc(cfg.title)} · ${r+1} of ${n}</div></div><div class="row"><span class="chip">${score} correct</span><button class="btn ghost sm" id="qx">Quit</button></div></div>
    <div class="bar"><i style="width:${pct(r,n)}%"></i></div>
    <div class="card">${it.prompt}<div class="opts grid ${it.opts.length>3&&!it.wide?'g2':''}">${it.opts.map((o,k)=>`<button class="opt${it.ar?' arq':''}" data-k="${k}"><span class="k">${k+1}</span><span>${it.raw?o:esc(o)}</span></button>`).join('')}</div><div id="qf"></div></div>`;
    $('#qx').onclick=()=>{keyOpts=null;go('games')};
    let answered=false;
    const choose=k=>{
      if(answered)return;answered=true;const o=it.opts[k],ok=o===it.ans;if(ok)score++;
      const bs=V().querySelectorAll('.opt');bs.forEach((b,j)=>{if(it.opts[j]===it.ans)b.classList.add('ok');else if(j===k)b.classList.add('no')});
      $('#qf').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'Correct.':'Not quite.'}</div>${it.explain?`<div class="small" style="margin-top:8px">${it.explain}</div>`:''}<div class="row" style="margin-top:10px"><button class="btn pri" id="qn">Next <span class="kbd">enter</span></button></div>`;
      if(cfg.onAnswer)cfg.onAnswer(it,ok);
      $('#qn').onclick=()=>{r++;step()};$('#qn').focus();
    };
    V().querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.k));
    keyOpts=k=>choose(k);
  };
  step();
}
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,select,textarea'))return;

  if(e.key===' '){const b=$('#rs')||$('#lsh');if(b){e.preventDefault();b.click()}}
  if(e.key==='Enter'){const b=$('#qn');if(b){e.preventDefault();b.click()}}
});

  V().innerHTML=`<div><div class="eyebrow">Tests</div><h1>Test your ḥifẓ, meaning and Arabic</h1></div>
  <div class="card"><div class="spread"><div><h3>Draw questions from</h3><div class="small muted">${mem.length} āyāt memorised</div></div>
  <div class="seg" id="gpool">${[['mem','My memorised āyāt'],['30','Juz ʿAmma'],['all','Whole Quran']].map(([k,l])=>`<button data-p="${k}" aria-pressed="${S.set.pool===k}">${l}</button>`).join('')}</div></div>
  ${S.set.pool==='mem'&&mem.length<8?'<div class="note">You have fewer than 8 āyāt memorised, so questions come from Juz ʿAmma for now.</div>':''}</div>
  <div class="grid g3">${GAMES.map(([k,t,d])=>`<div class="card"><h3>${t}</h3><div class="small muted" style="flex:1">${d}</div><div><button class="btn sm pri" data-g="${k}">Play 10</button> <span class="small muted">${S.games[k]?`best ${S.games[k]}/10`:''}</span></div></div>`).join('')}</div>`;
  $('#gpool').onclick=e=>{const b=e.target.closest('button');if(b){S.set.pool=b.dataset.p;save();R.games()}};
  V().querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>playGame(b.dataset.g));
};
function poolAyat(scope){
  if(scope&&scope.length)return scope;
  const mem=memList();
  if(S.set.pool==='mem'&&mem.length>=8)return mem;
  if(S.set.pool==='all')return D.ayahs.map((a,i)=>i);
  return D.ayahs.map((a,i)=>i).filter(i=>A(i)[3]===30);
}
const start=(i,n=4)=>A(i)[7].slice(0,n).join(' ');
function distinctStarts(right,cands,n=3){const seen=new Set([right]);const out=[];for(const c of cands){if(!seen.has(c)){seen.add(c);out.push(c)}if(out.length>=n)break}return out}
async function playGame(g,scope){
  const P=poolAyat(scope);const title=GAMES.find(x=>x[0]===g)[1];
  const surahOf=i=>A(i)[0];const inS=i=>D.ayahs.map((a,j)=>j).filter(j=>A(j)[0]===A(i)[0]);
  const sameSurahStartOk=i=>i<6235&&A(i+1)[0]===A(i)[0];
  const done=(score,n)=>{S.games[g]=Math.max(S.games[g]||0,Math.round(score*10/n));save();return ''};
  const base={title,n:10,done,again:()=>playGame(g,scope)};
  if(g==='next'||g==='prev'){
    const cand=P.filter(i=>g==='next'?sameSurahStartOk(i):(i>0&&A(i-1)[0]===A(i)[0]));
    if(!cand.length){V().innerHTML='<div class="card">Memorise a passage of at least two āyāt first.</div>';return}
    runQuiz({...base,make:()=>{
      const i=pick(cand),t=g==='next'?i+1:i-1;const right=start(t);
      const sims=(SIM[t]||[]).map(([j])=>start(j));
      const near=shuffle(inS(i).filter(j=>j!==t&&j!==i)).map(j=>start(j));
      const opts=shuffle([right,...distinctStarts(right,[...sims,...near,...shuffle(P).map(j=>start(j))])]);
      return {prompt:`<div class="small muted">${esc(sName(surahOf(i)))} · ${ref(i)}</div><div class="q md">${esc(A(i)[7].join(' '))} <span class="num">﴿${AD(A(i)[1])}﴾</span></div><h3>${g==='next'?'How does the next āyah begin?':'How does the āyah before it begin?'}</h3>`,opts:opts.map(o=>o+' …'),ans:right+' …',ar:true,wide:true,explain:`<div class="q sm">${esc(A(t)[7].join(' '))} <span class="num">﴿${AD(A(t)[1])}﴾</span></div><span class="muted">${ref(t)} · ${esc(A(t)[12])}</span>`}
    }});return;
  }
  if(g==='build'){
    const cand=P.filter(i=>A(i)[7].length>=3&&A(i)[7].length<=40);
    const i=pick(cand),w=A(i)[7];const pool=[...new Set(inS(i).flatMap(j=>A(j)[7]))];
    runQuiz({...base,title:`${title} · ${ref(i)}`,n:w.length,make:(r)=>{const right=w[r];return {prompt:`<div class="small muted">${esc(sName(surahOf(i)))} · ${ref(i)}</div><div class="q md">${esc(w.slice(0,r).join(' '))} <span class="hint">…</span></div>`,opts:shuffle([right,...shuffle(pool.filter(x=>sk(x)!==sk(right))).slice(0,3)]),ans:right,ar:true}},
      done:(s,n)=>{S.games.build=Math.max(S.games.build||0,Math.round(s*10/n));save();return ''}});return;
  }
  if(g==='gap'){
    runQuiz({...base,make:()=>{const i=pick(P.filter(j=>A(j)[7].length>=4)),w=A(i)[7];const k=1+(Math.random()*(w.length-1)|0);const right=w[k];
      const pool=[...new Set([...(SIM[i]||[]).flatMap(([j])=>A(j)[7]),...inS(i).flatMap(j=>A(j)[7])])].filter(x=>sk(x)!==sk(right));
      return {prompt:`<div class="small muted">${ref(i)}</div><div class="q md">${w.map((x,j)=>j===k?'<span class="mark">ــــــ</span>':esc(x)).join(' ')}</div>`,opts:shuffle([right,...shuffle(pool).slice(0,3)]),ans:right,ar:true,explain:`<span class="muted">${esc(A(i)[12])}</span>`}}});return;
  }
  if(g==='mutash'){
    let cand=P.filter(i=>SIM[i]&&SIM[i].some(([j,r])=>A(j)[7].join(' ')!==A(i)[7].join(' ')));
    if(cand.length<3)cand=Object.keys(SIM).map(Number).filter(i=>SIM[i].some(([j])=>A(j)[7].join(' ')!==A(i)[7].join(' ')));
    runQuiz({...base,make:()=>{const i=pick(cand);const prev=i>0&&A(i-1)[0]===A(i)[0]?i-1:null;
      const right=A(i)[7].join(' ');const others=[...new Set(SIM[i].map(([j])=>A(j)[7].join(' ')).filter(x=>x!==right))].slice(0,3);
      return {prompt:`<div class="small muted">${esc(sName(surahOf(i)))} · ${ref(i)}. Which wording is the one in this place?</div>${prev!=null?`<div class="q sm muted">${esc(A(prev)[7].join(' '))} <span class="num">﴿${AD(A(prev)[1])}﴾</span></div>`:'<div class="small muted">(first āyah of the sūrah)</div>'}`,
        opts:shuffle([right,...others]),ans:right,ar:true,wide:true,explain:SIM[i].filter(([j])=>A(j)[7].join(' ')!==right).slice(0,3).map(([j])=>diffPair(i,j)).join('')}}});return;
  }
  if(g==='where'){
    runQuiz({...base,make:()=>{const i=pick(P);const s=surahOf(i);const near=shuffle(range(Math.max(1,s-6),Math.min(114,s+6)).filter(x=>x!==s)).slice(0,3);
      return {prompt:`<div class="q md">${esc(A(i)[7].join(' '))}</div><h3>Which sūrah is this āyah from?</h3>`,opts:shuffle([s,...near]).map(x=>`${x}. ${D.surahs[x-1][1]}`),ans:`${s}. ${sName(s)}`,explain:`${ref(i)} · <span class="muted">${esc(A(i)[12])}</span>`}}});return;
  }
  if(g==='order'){
    const cand=P.filter(i=>i+3<6236&&A(i+3)[0]===A(i)[0]&&[1,2,3].every(d=>P.includes(i+d)||S.set.pool!=='mem'||P.length<8));
    const cands=cand.length?cand:D.ayahs.map((a,i)=>i).filter(i=>A(i)[3]===30&&i+3<6236&&A(i+3)[0]===A(i)[0]);
    orderGame(cands,title);return;
  }
  if(g==='opener'){
    const pages=[...new Set(P.map(i=>A(i)[2]))].filter(p=>p>1);
    const firstOf=p=>D.ayahs.findIndex(a=>a[2]===p||(a[2]<p&&a[11]>=p));
    runQuiz({...base,make:async()=>{const p=pick(pages);const i=firstOf(p);
      // the page may open mid-āyah: take the words of i that sit on page p
      const ws=await W(i);let pg=A(i)[2],last=0;const onP=[];ws.forEach((d,k)=>{if(d[2]<last)pg++;last=d[2];if(pg===p)onP.push(A(i)[7][k])});
      const right=onP.slice(0,3).join(' ');
      const others=shuffle(pages.filter(x=>Math.abs(x-p)<=12&&x!==p)).slice(0,6).map(x=>{const j=firstOf(x);return start(j,3)});
      return {prompt:`<h3>How does page ${p} begin?</h3><div class="small muted">${esc(sName(A(i)[0]))} · juzʾ ${A(i)[3]}</div>`,opts:shuffle([right,...distinctStarts(right,others)]).map(o=>o+' …'),ans:right+' …',ar:true,explain:`Page ${p} opens inside ${ref(i)}.`}}});return;
  }
  if(g==='meaning'){
    runQuiz({...base,make:()=>{const i=pick(P);const others=shuffle(inS(i).filter(j=>j!==i)).slice(0,3);while(others.length<3)others.push(pick(D.ayahs.map((a,j)=>j)));
      return {prompt:`<div class="q md">${esc(A(i)[7].join(' '))} <span class="num">﴿${AD(A(i)[1])}﴾</span></div><h3>What does it mean?</h3>`,opts:shuffle([i,...others]).map(j=>A(j)[12]),ans:A(i)[12],wide:true,explain:`${ref(i)} · Saheeh International`}}});return;
  }
  if(g==='wmean'||g==='roots'||g==='parse'){
    const P2=shuffle(P).slice(0,160);await Promise.all([...new Set(P2.map(i=>A(i)[3]))].map(juzWords));
    const glossPool=[];for(const i of P2)for(const d of await W(i))glossPool.push(d[0]);
    const fields=['tense','case','form','pgn','pos3','def','number','voice'];
    runQuiz({...base,make:async()=>{
      for(let t=0;t<60;t++){const i=pick(P2),ws=await W(i),k=Math.random()*ws.length|0,d=ws[k];
        let dr,a;
        if(g==='wmean'){if(!d[0]||d[5]==='P')continue;dr=DRILL.gloss;a=d[0]}
        else if(g==='roots'){if(d[4]<0)continue;dr=DRILL.root;a=dr.ans(d)}
        else{const f=pick(fields);dr=DRILL[f];a=dr.ans(d);if(!a)continue}
        const opts=dr.opts(a,glossPool);
        return {prompt:`<div class="small muted">${ref(i)}</div><div class="q md">${wordInAyah(i,k)}</div><h3>${dr.ask}</h3>`,opts,ans:a,ar:dr.ar,explain:`<b>${esc(A(i)[7][k])}</b> “${esc(d[0])}”: ${esc(parseWord(d))}${d[4]>=0?` · root ${esc(D.roots[d[4]][0])}`:''}`}
      }return null}});return;
  }
}
function diffPair(i,j){
  const a=A(i)[7],b=A(j)[7],sa=a.map(sk),sb=b.map(sk);
  const m=a.map(()=>0),n=b.map(()=>0);const dp=Array.from({length:a.length+1},()=>new Array(b.length+1).fill(0));
  for(let x=a.length-1;x>=0;x--)for(let y=b.length-1;y>=0;y--)dp[x][y]=sa[x]===sb[y]?dp[x+1][y+1]+1:Math.max(dp[x+1][y],dp[x][y+1]);
  let x=0,y=0;while(x<a.length&&y<b.length){if(sa[x]===sb[y]){m[x]=n[y]=1;x++;y++}else if(dp[x+1][y]>=dp[x][y+1])x++;else y++}
  const show=(w,k)=>w.map((t,q)=>k[q]?esc(t):`<span class="mark">${esc(t)}</span>`).join(' ');
  return `<div class="ex" style="margin-top:6px"><div class="small"><b>Here, ${ref(i)}</b></div><div class="q sm">${show(a,m)}</div><div class="small"><b>Elsewhere, ${ref(j)}</b> ${esc(sName(A(j)[0]))}</div><div class="q sm">${show(b,n)}</div></div>`;
}
function orderGame(cands,title){
  let r=0,score=0;const n=6;
  const round=()=>{
    if(r>=n){S.games.order=Math.max(S.games.order||0,Math.round(score*10/n));save();dayLog('q',n);dayLog('ok',score);V().innerHTML=`<div class="card"><div class="eyebrow">${title}</div><h1>${score} / ${n}</h1><div class="row"><button class="btn pri" id="oa">Play again</button><button class="btn" id="ob">All tests</button></div></div>`;$('#oa').onclick=()=>orderGame(cands,title);$('#ob').onclick=()=>go('games');return}
    const i=pick(cands);const set=[i,i+1,i+2,i+3];const sh=shuffle(set);let got=[];let miss=false;
    const draw=()=>{V().innerHTML=`<div class="spread"><div class="eyebrow">${title} · ${r+1} of ${n} · ${esc(sName(A(i)[0]))}</div><span class="chip">${score} correct</span></div>
      <div class="card"><h3>Tap the āyāt in order, first to last</h3><div class="opts grid">${sh.map(j=>`<button class="opt arq ${got.includes(j)?'ok':''}" data-j="${j}" ${got.includes(j)?'disabled':''}>${esc(A(j)[7].join(' '))}</button>`).join('')}</div><div id="of"></div></div>`;
      V().querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;if(j===set[got.length]){got.push(j);if(got.length===4){if(!miss)score++;r++;toast(miss?'Done, with a slip':'Perfect order');setTimeout(round,700);return}draw()}else{miss=true;b.classList.add('no');setTimeout(()=>b.classList.remove('no'),500)}});};
    draw();
  };round();
}

/* ========== PROGRESS & SETTINGS ========== */

  const mem=memList();const bySurah={};mem.forEach(i=>{bySurah[A(i)[0]]=(bySurah[A(i)[0]]||0)+1});
  const pagesFull=range(1,604).filter(p=>{const on=D.ayahs.map((a,i)=>i).filter(i=>A(i)[2]===p);return on.length&&on.every(memo)}).length;
  const days=[];const d=new Date();for(let k=0;k<119;k++){const x=new Date(d);x.setDate(d.getDate()-118+k);const o=S.days[ymd(x)]||{};const v=(o.new||0)*3+(o.rev||0)+(o.q||0)/2+(o.lex||0)/3;days.push(v)}
  const strong=mem.filter(i=>S.ay[i].iv>=21).length;
  V().innerHTML=`<div><div class="eyebrow">Progress</div><h1>Where you stand</h1></div>
  <div class="grid g4">
   <div class="card stat"><b>${mem.length.toLocaleString()}</b><span>āyāt memorised (${pct(mem.length,6236)}%)</span></div>
   <div class="card stat"><b>${pagesFull}</b><span>complete mushaf pages of 604</span></div>
   <div class="card stat"><b>${strong}</b><span>āyāt held 3 weeks or longer</span></div>
   <div class="card stat"><b>${Object.values(S.gram).filter(g=>g.done).length}/${LESSONS.length}</b><span>grammar lessons passed</span></div>
  </div>
  <div class="card"><h2>Last 17 weeks</h2><div class="heat">${days.map(v=>`<i class="${v>=30?'l3':v>=10?'l2':v>0?'l1':''}"></i>`).join('')}</div></div>
  <div class="card"><div class="spread"><h2>Sūrahs</h2><div class="small muted">Mark what you already know: it goes straight into review, spread over a week.</div></div>
  <div class="tbl"><table><thead><tr><th>#</th><th>Sūrah</th><th></th><th class="n">Āyāt</th><th style="width:30%">Memorised</th><th></th></tr></thead><tbody>
  ${D.surahs.map(s=>{const m=bySurah[s[0]]||0;return `<tr><td class="n">${s[0]}</td><td><b>${esc(s[1])}</b> <span class="ar">${esc(s[3])}</span><div class="small muted">${esc(s[4])}</div></td><td><span class="chip ${s[5]==='M'?'m':'d'}">${s[5]==='M'?'Makkan':'Madinan'}</span></td><td class="n">${s[7]}</td><td><div class="bar"><i style="width:${pct(m,s[7])}%"></i></div><span class="small muted">${m}/${s[7]}</span></td><td>${m<s[7]?`<button class="btn sm" data-know="${s[0]}">I know it</button>`:'<span class="chip d">complete</span>'}</td></tr>`}).join('')}
  </tbody></table></div></div>
  <div class="card"><h2>Settings</h2>
   <div class="row">
    <label class="field">New lines a day<select id="sd">${[3,5,7,10,15,30].map(n=>`<option ${n===S.set.daily?'selected':''} value="${n}">${n}${n===15?' (one page)':n===30?' (two pages)':''}</option>`).join('')}</select></label>
    <label class="field">Path<select id="so"><option value="back" ${S.set.order==='back'?'selected':''}>al-Fātiḥah, then an-Nās → al-Baqarah</option><option value="fwd" ${S.set.order==='fwd'?'selected':''}>Mushaf order</option></select></label>
    <label class="field">Review cap a day<select id="sr">${[50,100,150,300,1000].map(n=>`<option ${n===S.set.rev?'selected':''}>${n}</option>`).join('')}</select></label>
    <label class="field">New words a day<select id="sw">${[5,10,15,20,30].map(n=>`<option ${n===S.set.lexNew?'selected':''}>${n}</option>`).join('')}</select></label>
    <label class="field">Translation<select id="st">${TRO().map(k=>`<option value="${k}" ${k===trSel()?'selected':''}>${TRN[k]}</option>`).join('')}</select></label>
   </div>
   <div class="small muted">Progress is saved in this browser only. Copy a backup now and then, and paste it back to restore or move devices.</div>
   <div class="row"><button class="btn sm" id="bk">Copy backup</button><button class="btn sm" id="rs2">Restore from backup</button><button class="btn sm ghost" id="rz">Reset everything…</button></div>
   <div id="bkbox"></div>
  </div>

${PUB?`   <div>Translations: Saheeh International (via Tanzil and Quran.com, for non-commercial use with credit); Pickthall; Yusuf Ali; Hilali &amp; Khan (King Fahd Complex). Word-by-word glosses and transliteration: Quran.com.</div>

`:`   <div>Translations: Saheeh International (via Tanzil and Quran.com); M.A.S. Abdel Haleem, Taqi Usmani, Pickthall, Yusuf Ali, Bridges (Fadel Soliman), Hilali &amp; Khan via Quran.com. Word-by-word glosses and transliteration: Quran.com.</div>

`}   <div>Nuh Ha Mim Keller’s <i>The Quran Beheld</i> is not included: it has no licensed digital text.</div>
  </div>`;
  V().querySelectorAll('[data-know]').forEach(b=>b.onclick=()=>{const s=+b.dataset.know;markKnown(range(SI[s],SI[s]+D.surahs[s-1][7]-1));R.progress();toast(`${sName(s)} added to review`)});
  $('#sd').onchange=e=>{S.set.daily=+e.target.value;save()};
  $('#so').onchange=e=>{S.set.order=e.target.value;save();buildOrder()};
  $('#sr').onchange=e=>{S.set.rev=+e.target.value;save()};
  $('#sw').onchange=e=>{S.set.lexNew=+e.target.value;save()};

  $('#rs2').onclick=()=>{$('#bkbox').innerHTML=`<textarea id="rst" rows="4" style="width:100%;margin-top:8px" placeholder="Paste a backup here"></textarea><button class="btn sm pri" id="rsg">Restore</button>`;$('#rsg').onclick=()=>{try{const o=JSON.parse($('#rst').value);if(!o.ay||!o.set)throw 0;S=o;save();buildOrder();nav();toast('Restored');R.progress()}catch(e){toast('That text is not a Sabaq backup')}}};
  $('#rz').onclick=()=>{$('#bkbox').innerHTML=`<div class="note">This erases every memorised āyah, word and score in this browser. <button class="btn sm" id="rzy" style="border-color:var(--bad);color:var(--bad)">Erase everything</button> <button class="btn sm ghost" id="rzn">Keep it</button></div>`;$('#rzy').onclick=()=>{S={ay:{},lex:{},gram:{},days:{},games:{},set:S.set};save();nav();R.progress();toast('Reset')};$('#rzn').onclick=()=>$('#bkbox').innerHTML=''};
};

    buildOrder();nav();
    const h=(location.hash||'').slice(1);go(VIEWS.some(v=>v[0]===h)?h:'today');
  }catch(e){V().innerHTML=`<div class="card"><h2>The mushaf data did not load</h2><div class="muted">${esc(e.message)}. Reload the page; if it persists, the data files are missing from this copy.</div></div>`}
})();
