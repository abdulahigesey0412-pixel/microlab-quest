}

  --t-gr:#8E887C; --t-gn:#6BC27A; --t-bl:#7FB1EE; --t-m2:#E3B544; --t-m246:#F09553; --t-m45:#F07070; --t-m6:#D27B7B; color-scheme:dark}

body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-ui);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-read);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:1.75rem;line-height:1.15}
h2{font-size:1.3rem;line-height:1.2}
h3{font-size:1.05rem}
p{margin:0}
.read{font-family:var(--f-read);font-size:1.06rem;line-height:1.55}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:8px 16px}
.date-ar{font-family:var(--f-ar);font-size:1.15rem;color:var(--green)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card.main{border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.note{background:var(--gold-soft);border-radius:12px;padding:12px 14px;font-size:.93rem}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .95rem var(--f-ui);padding:10px 14px;border-radius:10px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--paper)}
.btn.ghost{background:transparent}
.btn:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--gold) 70%,transparent);outline-offset:2px}
.btn[disabled]{opacity:.5}
a{color:var(--green)}
textarea,input[type=text],input[type=date],select{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:84px;resize:vertical;font-family:var(--f-read);font-size:1.02rem}
.ar{font-family:var(--f-ar);direction:rtl;text-align:right;font-size:1.45rem;line-height:2.1}
.q{font-family:var(--f-q);direction:rtl;text-align:right;font-size:1.75rem;line-height:2.35}
.src{font-size:.82rem;color:var(--muted);font-style:italic;font-family:var(--f-read)}
blockquote{margin:0;padding:0 0 0 14px;border-left:3px solid var(--gold)}
/* steps */
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.step .dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.85rem;font-weight:600;color:var(--muted)}
.step.done .dot{background:var(--green);border-color:var(--green);color:var(--paper)}
.step b{display:block;font-weight:600}
.step span.sub{font-size:.85rem;color:var(--muted)}
.step .min{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.week{display:flex;flex-direction:column;gap:0}
.wk{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.wk:last-child{border-bottom:0}
.tick{width:20px;height:20px;border-radius:6px;border:2px solid var(--line)}
.wk.done .tick{background:var(--green);border-color:var(--green)}
.wk .when{font-size:.8rem;color:var(--muted)}
.pill{font-size:.75rem;padding:3px 9px;border-radius:99px;background:var(--green-soft);color:var(--green);font-weight:600;white-space:nowrap}
.pill.gold{background:var(--gold-soft);color:var(--gold)}

.panel{position:fixed;inset:0;background:var(--paper);z-index:20;overflow:auto}
.panel .wrap{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--green);font:500 1rem var(--f-ui);padding:8px 0;cursor:pointer;min-height:44px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}

nav.tabs button .ar-l{font-family:var(--f-ar);font-size:1.15rem;line-height:1.2}
nav.tabs button[aria-current="page"]{color:var(--green)}

.ayah{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}
.ayah:last-child{border-bottom:0}
.ayah .tl{font-family:var(--f-read);font-style:italic;font-size:1.02rem}
.ayah .en{font-family:var(--f-read);font-size:.95rem;color:var(--muted)}
.ayah .ctl{display:flex;gap:8px;flex-wrap:wrap}

.end{color:var(--gold);font-family:var(--f-q)}
.keyrow{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem}
.keyrow span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:currentColor;vertical-align:-1px}
.playing{background:var(--green-soft);border-radius:10px}

.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}

.scroll{overflow-x:auto}
.month{padding:12px 16px}
.month summary{list-style:none}

.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 14px;font:500 .92rem var(--f-ui);color:var(--ink);cursor:pointer;min-height:42px}

.progress-dots{display:flex;gap:6px}
.progress-dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}

.person{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.days{display:flex;gap:5px}
.days i{flex:1;height:8px;border-radius:4px;background:var(--line);max-width:34px}
.days i.on{background:var(--green)}
.honest{font-size:.78rem;color:var(--muted);text-align:center;padding-top:8px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* ---------- shared progress (works when the course page is opened on claude.ai; otherwise this phone only) ---------- */
let DB=null, USER=null, UID=null, PEOPLE={}, NAMES={}, SYNC="local", pushTimer=null, pushing=false, pushAgain=false;
function summary(){
  const last7=[...Array(7)].map((_,i)=>{ const d=iso(new Date(Date.now()-(6-i)*DAY)); return !!(S.log[d]||{}).daily; });
  const lastCardKey=Object.keys(S.cards||{}).sort((a,b)=>+b.slice(1)-+a.slice(1))[0];
  return {label:S.label||"", start:S.start||null, week:started()?weekNo():0, last7, days:Object.values(S.log).filter(v=>v.daily).length,
    lessons:(S.sessions.arabic||0)+(S.sessions.belief||0), arabic:S.sessions.arabic||0, belief:S.sessions.belief||0,
    known:knownCount(), cov:coverage(), openQ:S.questions.filter(q=>!q.ans).length, exam:!!S.exam,
    card: lastCardKey ? {week:+lastCardKey.slice(1), ...S.cards[lastCardKey]} : null, active:today()};
}
function schedulePush(){ if(!DB||!UID||!S.start) return; clearTimeout(pushTimer); pushTimer=setTimeout(push,1200); }
async function push(){
  if(pushing){ pushAgain=true; return; }
  pushing=true;
  try{
    if(DB==="rest"){ const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({k:KEY,state:S,summary:summary()})}); if(!r.ok) throw {code:"http"}; PEOPLE[UID]={summary:summary()}; paintTogether(); }
    else await DB.doc("progress/"+UID).set({state:JSON.parse(JSON.stringify(S)), summary:summary(), updated:new Date().toISOString()});
    SYNC="shared"; }
  catch(e){ SYNC = (e&&e.code==="invalid_argument") ? "readonly" : SYNC; }
  pushing=false; if(pushAgain){ pushAgain=false; push(); }
}
async function connect(){
  try{
    if(!window.claude||!window.claude.use) return;
    USER = await window.claude.use("user"); DB = await window.claude.use("db");
    if(!DB||!USER){ DB=null; return; }
    UID = await USER.id(); if(!UID){ DB=null; return; }
    if(!S.label){ try{ const me=await USER.me(); if(me&&me.name) S.label=me.name.split(" ")[0]; }catch(e){} }
    const snap = await DB.doc("progress/"+UID).get();
    if(snap.exists){ const r=snap.data(); if(r&&r.state&&(!S.updatedAt || (r.state.updatedAt||"")>S.updatedAt)){ S=JSON.parse(JSON.stringify(r.state)); try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} if(panel.hidden) render(); } else if(S.start) push(); }
    else if(S.start) push();
    SYNC = SYNC==="readonly" ? SYNC : "shared";
    DB.collection("progress").onSnapshot(async qs => {
      PEOPLE={}; qs.docs.forEach(d=>{ const v=d.data(); if(v&&v.summary) PEOPLE[d.id]=v; });
      try{ const ps=await USER.profiles(Object.keys(PEOPLE)); for(const id in ps) NAMES[id]=ps[id].name||""; }catch(e){}
      paintTogether();
    }, () => {});
  }catch(e){ DB=null; }
}

const API = window.MIFTAH_API || null; let KEY=null;
async function connectRest(){
  try{
    KEY=LINK_KEY;
    if(!KEY){ SYNC="nokey"; paintTogether(); return; }
    const r=await fetch(API+"?k="+encodeURIComponent(KEY),{cache:"no-store"});
    if(!r.ok){ SYNC = r.status===403 ? "badkey" : "local"; paintTogether(); return; }
    const j=await r.json(); DB="rest"; UID=j.me.id;
    if(S.owner && S.owner!==UID){ S=load.fresh(); }
    S.owner=UID; if(!S.label) S.label=j.me.label;
    const rs=j.me.state;
    if(rs && (!S.updatedAt || (rs.updatedAt||"")>S.updatedAt)){ S=rs; try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} if(panel.hidden) render(); }
    else if(S.start) push();
    SYNC="shared"; PEOPLE=j.people||{}; paintTogether();
    document.addEventListener("visibilitychange", async () => { if(document.visibilityState!=="visible") return; try{ const r2=await fetch(API+"?k="+encodeURIComponent(KEY),{cache:"no-store"}); if(r2.ok){ PEOPLE=(await r2.json()).people||{}; paintTogether(); } }catch(e){} });
  }catch(e){ SYNC="local"; paintTogether(); }
}
const personName = id => id===UID ? "You" : ((PEOPLE[id]&&PEOPLE[id].summary.label) || NAMES[id] || "Your study partner");
function togetherHTML(full){
  const ids=Object.keys(PEOPLE).sort((a,b)=>a===UID?-1:b===UID?1:0);
  if(SYNC==="nokey") return `<p class="small muted">Open the course from your personal link once, and your progress will be kept with your study partner’s.</p>`;
  if(SYNC==="badkey") return `<p class="small muted">This link is not one of the course’s personal links. Your progress is kept on this phone.</p>`;

  if(ids.length<2) return `<p class="small muted">When your study partner opens the course and begins Day One, their week appears here beside yours.</p>` + ids.map(id=>personRow(id,full)).join("");

function personRow(id, full){

/* ---------- dates ---------- */
const DAY = 86400000;
const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const today = () => iso(new Date());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const daysBetween = (a,b) => Math.round((parse(b) - parse(a))/DAY);
const WD = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
/* tabular Islamic calendar; the moon may move a date by a day */
const HM = ["Muḥarram","Ṣafar","Rabīʿ al‑Awwal","Rabīʿ al‑Thānī","Jumādā al‑Ūlā","Jumādā al‑Ākhira","Rajab","Shaʿbān","Ramaḍān","Shawwāl","Dhū al‑Qaʿda","Dhū al‑Ḥijja"];

function hijri(d){
  const y=d.getFullYear(), m=d.getMonth()+1, day=d.getDate();
  const a=Math.floor((14-m)/12), yy=y+4800-a, mm=m+12*a-3;
  const jd = day+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;
  const l0 = jd-1948440+10632, n = Math.floor((l0-1)/10631);
  let l = l0-10631*n+354;
  const j = Math.floor((10985-l)/5316)*Math.floor(50*l/17719)+Math.floor(l/5670)*Math.floor(43*l/15238);
  l = l-Math.floor((30-j)/15)*Math.floor(17719*j/50)-Math.floor(j/16)*Math.floor(15238*j/43)+29;
  const hm = Math.floor(24*l/709), hd = l-Math.floor(709*hm/24), hy = 30*n+j-30;
  return {y:hy, m:hm, d:hd};
}

/* ---------- SRS ---------- */
const BOX = [0,1,3,7,16,35];
function dueWords(){ const n=unlocked(), t=today(), out=[]; for(let i=0;i<n;i++){ const s=S.srs[i]; if(!s || s.due<=t) out.push(i);} return out; }
function knownCount(){ return Object.values(S.srs).filter(s=>s.box>=3).length; }
function coverage(){ let f=0; for(const [i,s] of Object.entries(S.srs)) if(s.box>=2) f+=DATA.words[i].f; return Math.round(1000*f/DATA.total)/10; }
function grade(i, ok){ const s=S.srs[i]||{box:0}; s.box = ok ? Math.min(5,s.box+1) : 0; s.due = iso(new Date(Date.now()+BOX[s.box]*DAY)); S.srs[i]=s; save(); }

/* ---------- speech ---------- */
function speak(t){ try{ const u=new SpeechSynthesisUtterance(t.replace(/[ً-ْٰ]/g, m=>m)); const v=speechSynthesis.getVoices().find(v=>/^ar/i.test(v.lang)); if(!v) return false; u.voice=v; u.lang=v.lang; u.rate=.8; speechSynthesis.cancel(); speechSynthesis.speak(u); return true; }catch(e){ return false; } }

/* Day One */
function dayOne(step){
  const dots = `<div class="progress-dots">${[0,1,2,3].map(i=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div>`;
  const shell = (inner, next, label="Next") => { app.innerHTML = `<div class="wrap stack" style="padding-top:28px">${dots}${inner}
    <button class="btn primary" id="nx">${label}</button><p class="honest">Prepared by Basma Press. Not yet read by a teacher.</p></div>`; $("#nx").onclick = next; window.scrollTo(0,0); };
  if(step===0) return shell(`<div class="stack"><div class="eyebrow">Day One · twenty minutes · nothing to decide</div>
    <h1>Before any book, the intention.</h1>
    <p class="ar">أَنْ يُحْسِنَ نِيَّتَهُ، وَيُطَهِّرَ قَلْبَهُ مِنَ الْأَدْنَاسِ، لِيَصْلُحَ لِقَبُولِ الْعِلْمِ وَحِفْظِهِ وَاسْتِمْرَارِهِ</p>
    <blockquote class="read">“That he make his intention good, and cleanse his heart of stains, so that it is fit to receive knowledge, to keep it, and to go on in it.”</blockquote>
    <p class="src">al‑Shahīd al‑Thānī (d. 965 AH / 1558 CE), Munyat al‑Murīd: the first of the student’s disciplines in himself, ed. al‑Mukhtārī, p. 224. English ours.</p>
    <p class="read">He likens it to preparing the ground before planting. Write one sentence: why are you doing this? No one grades it.</p>
    <label class="small muted" for="why">Why I am doing this</label><textarea id="why" placeholder="In your own words">${esc(S.why)}</textarea></div>`,
    () => { S.why = $("#why").value.trim(); save(); dayOne(1); });
  if(step===1) return shell(`<div class="stack"><div class="eyebrow">The key</div><h1>Its key is the question.</h1>
    <p class="ar">إِنَّ هٰذَا الْعِلْمَ عَلَيْهِ قُفْلٌ، وَمِفْتَاحُهُ الْمَسْأَلَةُ</p>
    <blockquote class="read">“This knowledge has a lock on it, and its key is the question.”</blockquote>
    <p class="src">Imam Jaʿfar al‑Ṣādiq (ʿa), in al‑Kulaynī (d. 329 AH / 941 CE), al‑Kāfī, vol. 1, Kitāb Faḍl al‑ʿIlm, chapter on asking the scholar, ḥadīth 3, by two chains.</p>
    <p class="read">Write the first question you want answered. Anything at all. It goes to your teacher, and a person will answer it.</p>
    <label class="small muted" for="fq">My first question</label><textarea id="fq" placeholder="Ask anything"></textarea></div>`,
    () => { const t=$("#fq").value.trim(); if(t){ S.questions.push({id:Date.now(), t, date:today()}); save(); } dayOne(2); });
  if(step===2){ shell(`<div class="stack"><div class="eyebrow">The first recitation · ten minutes</div><h1>Listen, then repeat.</h1>
    <p class="read">Tap an āyah to hear it from a teacher of recitation, then say it after him. Do not try to be right yet. Only listen and repeat.</p>
    <div class="card" id="fat"></div></div>`, () => dayOne(3)); fatiha($("#fat")); return; }
  if(step===3){
    const opts=["After Fajr","After Maghrib","Before sleep","On the way to university"];
    shell(`<div class="stack"><div class="eyebrow">Your plan</div><h1>Fifteen minutes, at one moment.</h1>
    <p class="read">The scholars of learning name dawn, and the time between Maghrib and ʿIshāʾ, as the best times. Choose the moment that already happens every day.</p>
    <div class="chips" id="mo">${opts.map(o=>`<button class="chip" aria-pressed="${S.moment===o}">${o}</button>`).join("")}</div>
    <div class="note"><b>A plan, not a vow.</b> Nothing here is a nadhr, an ʿahd or an oath, and nothing is owed if a day is missed. Missing one day does no harm. Never miss two.</div>
    <p class="read">The size of it has a report behind it:</p>
    <p class="ar">أَحَبُّ الْأَعْمَالِ إِلَى اللّٰهِ عَزَّ وَجَلَّ مَا دَاوَمَ عَلَيْهِ الْعَبْدُ وَإِنْ قَلَّ</p>
    <blockquote class="read">“The most beloved of deeds to Allah is the one the servant keeps up, even if it is little.”</blockquote>
    <p class="src">Imam al‑Bāqir (ʿa), al‑Kāfī, vol. 2, chapter on balance and constancy in deeds, ḥadīth 2; al‑Majlisī: ḥasan ka‑l‑ṣaḥīḥ.</p></div>`,

function fatiha(el){
  const key = `<div class="keyrow"><span class="g-gr">grey: not said</span><span class="g-gn">green: hum, two counts</span><span class="g-bl">blue: bounce</span><span class="g-m2">gold: long, two counts</span><span class="g-m45">red: longer, four or five</span><span class="g-m246">orange: where you stop, 2, 4 or 6</span></div>`;
  el.innerHTML = `<div class="row" style="justify-content:space-between"><h3>Sūrat al‑Fātiḥa</h3><button class="btn" id="all">Play all</button></div>${key}` +
    DATA.fatiha.map(a => `<div class="ayah" data-n="${a.n}"><div class="q">${a.ar}</div><div class="tl">${a.tl}</div><div class="en">${esc(a.en)}</div>
    <div class="ctl"><button class="btn" data-play="${a.n}">▶ Listen</button><button class="btn ghost" data-rep="${a.n}">Repeat 3 times</button></div></div>`).join("") +
    `<p class="src" style="margin-top:10px">Recitation: Shaykh Maḥmūd Khalīl al‑Ḥuṣarī, the teaching recitation (al‑Muʿallim), from everyayah.com. English: ʿAlī Qulī Qarāʾī. Colours and transliteration: Basma Press.</p>`;
  const audio = new Audio(); let queue=[];
  const play = n => { el.querySelectorAll(".ayah").forEach(x=>x.classList.toggle("playing", x.dataset.n==n)); audio.src = DATA.fatiha[n-1].au; audio.play().catch(()=>{}); };
  audio.onended = () => { if(queue.length){ play(queue.shift()); } else el.querySelectorAll(".ayah").forEach(x=>x.classList.remove("playing")); };
  el.addEventListener("click", e => {
    const p=e.target.closest("[data-play]"), r=e.target.closest("[data-rep]");
    if(e.target.id==="all"){ queue=[2,3,4,5,6,7]; play(1); }
    else if(p){ queue=[]; play(+p.dataset.play); }
    else if(r){ const n=+r.dataset.rep; queue=[n,n]; play(n); }
  });
}

function step(k,n,t,s,min,L){ return `<button class="step ${L[k]?"done":""}" data-step="${k}"><span class="dot">${L[k]?"✓":n}</span><span><b>${t}</b><span class="sub">${esc(s)}</span></span><span class="min">${min} min</span></button>`; }
function mark(k){ const t=today(); S.log[t]={...(S.log[t]||{}), [k]:true}; save(); }

function openPanel(html, after){ panel.innerHTML = `<div class="wrap stack"><button class="back" id="bk">‹ Back</button>${html}</div>`; panel.hidden=false; panel.scrollTop=0; $("#bk").onclick=closePanel; if(after) after(); }
function closePanel(){ panel.hidden=true; panel.innerHTML=""; render(); }

function openStep(k){
  if(k==="recite") return openPanel(`<div class="eyebrow">Recite · five minutes</div><h1>Al‑Fātiḥa</h1><p class="read">Listen to each āyah, then say it after him. Watch the colours: each one is a rule you will learn by ear before you learn it by name.</p><div class="card" id="fat"></div><button class="btn primary" id="ok">I recited today</button>`,
    () => { fatiha($("#fat")); $("#ok").onclick=()=>{ mark("recite"); closePanel(); }; });
  if(k==="words"){ TAB="words"; render(); return; }
  if(k==="recall"){
    let qs;
    if(weekNo()===1) qs = W1.recall;
    else { const pool=[...Array(unlocked()).keys()]; qs=[]; for(let j=0;j<2&&pool.length;j++){ const i=pool.splice(Math.floor(Math.random()*pool.length),1)[0]; qs.push([`What does ${DATA.words[i].a} mean?`, DATA.words[i].g]); }
      qs.push(["Say aloud, without notes, the main point of your last session.","Check it against your notes. If you could not say it, that lesson is worth a second listen."]); }
    return openPanel(`<div class="eyebrow">Three questions · five minutes</div><h1>Answer, then look.</h1><p class="read">Answering from memory is what makes it stay. Tap a question when you have answered it in your head.</p>
      ${qs.map(([q,a])=>`<details class="card"><summary class="read" style="cursor:pointer"><b>${esc(q)}</b></summary><p class="read" style="margin-top:8px">${esc(a)}</p></details>`).join("")}
      <button class="btn primary" id="ok">Done</button>`, () => $("#ok").onclick=()=>{ mark("recall"); closePanel(); });
  }
}

function sessionPanel(k){

  const after = w1 ? `<details class="card"><summary style="cursor:pointer"><b>The key</b> (open after you answer)</summary><ol class="read">${W1[k].key.map(x=>`<li>${esc(x)}</li>`).join("")}</ol><p class="small muted">Eighty percent is a pass.</p></details>`
    : `<div class="card"><b>After the lesson, three questions to yourself</b><ol class="read"><li>What is the main claim?</li><li>What does it rest on?</li><li>What would someone who disagrees say, and how would the teacher answer?</li></ol></div>`;
  const link = k==="arabic"
    ? `<p class="read">Lesson ${n} of <i>First Steps to Understanding Ṣarf</i> (Al‑Qalam Institute, 22 lessons). Grammar is shared ground across the schools.</p><a class="btn primary" href="${LINKS.sarf}" target="_blank" rel="noopener">Open the lessons</a>`

       ${w1?`<blockquote class="read">“It is necessary for a Muslim to believe in the fundamentals of faith with his own insight and understanding, and he cannot follow anyone in this respect … In matters of religious laws … a person must act according to the verdicts (Fatwa) of the most learned Mujtahid.”</blockquote><p class="src">The office of Sayyid al‑Sīstānī, sistani.org/15510, accessed 27 November 2026. Read this before the lesson.</p>`:""}
       <div class="row"><a class="btn primary" href="${LINKS.shomali}" target="_blank" rel="noopener">Open the lessons</a><a class="btn" href="${LINKS.faithText}" target="_blank" rel="noopener">The book</a></div>`;
  openPanel(`<div class="eyebrow">${k==="arabic"?"Arabic":"Belief"} · forty minutes</div><h1>${k==="arabic"?"Morphology":"Belief"}, lesson ${n}</h1>

function openWeek(k){
  if(k==="arabic"||k==="belief") return sessionPanel(k);
  if(k==="kumayl") return openPanel(`<div class="eyebrow">Thursday night · twenty minutes</div><h1>Duʿāʾ Kumayl</h1>
    <p class="read">Nothing to study tonight. Open your booklet and read. If the Arabic is too fast, read the English beside it; the Arabic will come.</p>
    <button class="btn primary" id="ok">Read tonight</button>`, () => $("#ok").onclick=()=>{ mark("kumayl"); closePanel(); });
  if(k==="friday"){
    const wn=weekNo(), p = PRACTICE[wn] || {t:MONTHS[Math.min(11,Math.floor((wn-1)/4.3))][4], body:`<p class="read">This month’s practice topic, from your fiqh book. Read one section, write one ruling and one question.</p>`};
    const c = S.cards[weekKey()] || {};
    openPanel(`<div class="eyebrow">Friday · one hour</div><h1>The Friday hour</h1>
      <p class="src">Al‑Kāfī preserves a report, attributed to the Prophet ﷺ, reproaching whoever “does not free himself every Friday for the matter of his religion, to look after it and ask about his religion” (vol. 1, chapter on asking the scholar, ḥadīth 5; al‑Majlisī: mursal, so held as a report).</p>
      <div class="card stack"><div class="eyebrow">1 · Practice · 25 minutes</div><h3>${esc(p.t)}</h3>${p.body}</div>
      <div class="card stack"><div class="eyebrow">2 · Mubāḥatha · 20 minutes</div><p class="read">Call your partner. Each of you says this week’s belief lesson in your own words, without notes. Then each asks the other one question the lesson did not answer. Add the best one to your Ask list.</p></div>
      <div class="card stack"><div class="eyebrow">3 · Your weekly card · 10 minutes</div><p class="small muted">Grade honestly. An F is allowed; it tells us what to change.</p>
        ${["q:Qurʾān","a:Arabic","b:Belief","p:Practice"].map(x=>{const [id,l]=x.split(":"); return `<div><b>${l}</b><div class="grades" data-g="${id}">${["A","B","C","D","E","F"].map(g=>`<button aria-pressed="${c[id]===g}">${g}</button>`).join("")}</div></div>`;}).join("")}
        <label class="small muted" for="hard">What was hard?</label><textarea id="hard">${esc(c.hard)}</textarea>
        <div class="row"><button class="btn primary" id="sv">Save the card</button><button class="btn" id="cp">Copy to send</button></div><p class="small muted" id="msg"></p></div>`,
      () => {
        panel.querySelectorAll(".grades").forEach(g => g.addEventListener("click", e => { const b=e.target.closest("button"); if(!b) return; g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b)); }));
        const read = () => { const o={}; panel.querySelectorAll(".grades").forEach(g=>{ const b=g.querySelector('[aria-pressed="true"]'); if(b) o[g.dataset.g]=b.textContent; }); o.hard=$("#hard").value.trim(); return o; };
        $("#sv").onclick = () => { S.cards[weekKey()] = read(); mark("friday"); save(); $("#msg").textContent="Saved. Jazāki Allāhu khayran."; };
        $("#cp").onclick = () => { const o=read(); const txt=`Week ${weekNo()} card\nQurʾān ${o.q||"-"} · Arabic ${o.a||"-"} · Belief ${o.b||"-"} · Practice ${o.p||"-"}\nWhat was hard: ${o.hard||"(nothing written)"}`; copy(txt, $("#msg")); };
      });
  }
}
function openExam(){
  openPanel(`<div class="eyebrow">Exam mode</div><h1>Keep the thread, nothing more.</h1>
    <p class="read">Until you switch it off, the day is fifteen minutes: your words and three questions from memory. No new lessons. This is the plan, not a failure of it.</p>
    <label class="small muted" for="rs">When do you start again? (the day after your last exam works well)</label><input type="date" id="rs" value="${S.restart||""}">
    <button class="btn primary" id="ok">Set</button>`, () => $("#ok").onclick=()=>{ S.restart=$("#rs").value; save(); closePanel(); });
}

/* Words */
let flashIdx=null, flashShow=false;
function renderWords(){
  const due=dueWords(), n=unlocked(), k=knownCount(), cov=coverage();
  if(flashIdx===null || !due.includes(flashIdx)){ flashIdx = due.length ? due[0] : null; flashShow=false; }
  const w = flashIdx!==null ? DATA.words[flashIdx] : null;
  app.innerHTML = `<div class="wrap stack"><div class="top"><div><div class="eyebrow">The words of the Qurʾān</div><h1>Ten a week</h1></div></div>
    <div class="card stack"><div class="grid2"><div><div class="big-num">${k}</div><div class="small muted">words you know well</div></div><div><div class="big-num">${cov}%</div><div class="small muted">of the Qurʾān’s words they make up</div></div></div>
      <div class="meter" aria-hidden="true"><i style="width:${Math.min(100,cov/DATA.cov500*100)}%"></i></div>
      <p class="small muted">The 500 words in this list make up about ${Math.round(DATA.cov500)}% of all the words in the Qurʾān. You unlock ten each week; ${n} are open now.</p></div>
    ${w ? `<div class="card flash" id="fc" role="button" tabindex="0" aria-label="Show the meaning">
        <div class="big">${esc(w.a)}</div>
        ${flashShow ? `<div class="gloss">${esc(w.g)}</div><div class="small muted">${w.p}${w.r?` · root ${esc(w.r)}`:""} · about ${w.f.toLocaleString()} times in the Qurʾān</div>` : `<div class="small muted">Say what it means, then tap</div>`}
      </div>
      ${flashShow ? `<div class="grid2"><button class="btn" id="again">Again</button><button class="btn primary" id="knew">I knew it</button></div>` : `<div class="row"><button class="btn" id="say">Hear it</button><span class="small muted">${due.length} waiting</span></div>`}`
      : `<div class="card"><h3>All caught up.</h3><p class="read muted">Nothing is waiting. The next words arrive as the week turns, and the ones you know come back when they are about to slip.</p></div>`}
    <details class="card"><summary style="cursor:pointer"><b>All ${n} open words</b></summary><div class="scroll"><table><thead><tr><th>Word</th><th>Meaning</th><th>Times</th></tr></thead><tbody>
      ${DATA.words.slice(0,n).map(x=>`<tr><td class="ar" style="font-size:1.2rem;line-height:1.6">${esc(x.a)}</td><td>${esc(x.g)}</td><td style="font-variant-numeric:tabular-nums">${x.f}</td></tr>`).join("")}</tbody></table></div></details>
    <p class="src">Word list and meanings: counted by lemma from the Quranic Arabic Corpus; meanings from the Sabaq word list, Basma Press.</p></div>`;
  const fc=$("#fc"); if(fc){ const show=()=>{ flashShow=true; renderWords(); }; fc.onclick=show; fc.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); show(); } }; }
  const say=$("#say"); if(say) say.onclick=()=>{ if(!speak(w.a)) say.textContent="No Arabic voice on this phone"; };
  const ag=$("#again"), kn=$("#knew");
  if(ag) ag.onclick=()=>{ grade(flashIdx,false); flashIdx=null; renderWords(); };
  if(kn) kn.onclick=()=>{ grade(flashIdx,true); flashIdx=null; if(!dueWords().length) mark("words"); renderWords(); };
}

/* Ask */
function renderAsk(){
  const open=S.questions.filter(q=>!q.ans), done=S.questions.filter(q=>q.ans);
  app.innerHTML = `<div class="wrap stack"><div class="top"><div><div class="eyebrow">Its key is the question</div><h1>Ask</h1></div></div>
    <p class="ar" style="font-size:1.25rem">إِنَّمَا يَهْلِكُ النَّاسُ لِأَنَّهُمْ لَا يَسْأَلُونَ</p>
    <p class="read">“People perish only because they do not ask.” <span class="src">Imam al‑Ṣādiq (ʿa), al‑Kāfī, vol. 1, chapter on asking the scholar, ḥadīth 2; al‑Majlisī: ṣaḥīḥ.</span></p>
    <div class="card stack"><label for="nq"><b>A new question</b></label><textarea id="nq" placeholder="Anything you want to understand"></textarea><button class="btn primary" id="add">Add to my list</button></div>
    <div class="row" style="justify-content:space-between"><h2>For my teacher (${open.length})</h2>${open.length?`<button class="btn" id="cp">Copy all</button>`:""}</div><p class="small muted" id="msg"></p>
    <div class="stack">${open.map(q=>`<div class="qitem"><p class="read">${esc(q.t)}</p><div class="row"><span class="small muted">${parse(q.date).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</span><button class="btn ghost" data-ans="${q.id}">Answered</button><button class="btn ghost" data-del="${q.id}">Remove</button></div></div>`).join("") || `<p class="muted read">No open questions. Every lesson should leave you with at least one.</p>`}</div>
    ${done.length?`<h2>Answered (${done.length})</h2><div class="stack">${done.map(q=>`<div class="qitem ans"><p class="read"><b>${esc(q.t)}</b></p><p class="read">${esc(q.ans)}</p><span class="small muted">${q.by?esc(q.by)+", ":""}${parse(q.ansDate).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}</span></div>`).join("")}</div>`:""}
    <p class="honest">Questions of belief and law are answered by your teacher, a person. Nothing in this app answers them.</p></div>`;
  $("#add").onclick=()=>{ const t=$("#nq").value.trim(); if(!t) return; S.questions.push({id:Date.now(), t, date:today()}); save(); renderAsk(); };
  const cp=$("#cp"); if(cp) cp.onclick=()=>copy("My questions\n\n"+open.map((q,i)=>`${i+1}. ${q.t}`).join("\n"), $("#msg"));
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ S.questions=S.questions.filter(q=>q.id!=b.dataset.del); save(); renderAsk(); });
  app.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>{ const q=S.questions.find(x=>x.id==b.dataset.ans);
    openPanel(`<div class="eyebrow">Answered</div><h2>${esc(q.t)}</h2><label class="small muted" for="at">The answer, in your words</label><textarea id="at"></textarea><label class="small muted" for="ab">Who answered</label><input type="text" id="ab" placeholder="Your teacher’s name"><button class="btn primary" id="ok">Save</button>`,
      ()=>$("#ok").onclick=()=>{ q.ans=$("#at").value.trim()||"(answered)"; q.by=$("#ab").value.trim(); q.ansDate=today(); save(); TAB="ask"; closePanel(); }); });
}

/* Year */
function renderYear(){
  const wn=weekNo(), mi=Math.min(11,Math.floor((wn-1)/4.3));
  const days=Object.values(S.log).filter(v=>v.daily).length;
  const cards=Object.entries(S.cards).sort((a,b)=>+b[0].slice(1)-+a[0].slice(1));
  app.innerHTML = `<div class="wrap stack"><div class="top"><div><div class="eyebrow">Year One</div><h1>Where you are going</h1></div></div>
    <div class="card"><p class="read"><b>To worship knowingly:</b> to pray, fast and live by your religion correctly and with understanding; to read the Qurʾān and the words of the Ahl al‑Bayt (ʿa) in their own Arabic with a teacher; and to know why you believe what you believe.</p></div>
    <div class="grid2"><div class="card"><div class="big-num">${days}</div><div class="small muted">days kept</div></div><div class="card"><div class="big-num">${S.sessions.arabic+S.sessions.belief}</div><div class="small muted">lessons heard</div></div></div>
    <div class="card"><h2 style="margin-bottom:4px">Together</h2><p class="small muted">Each of you keeps your own year. Here you see each other’s last seven days, lessons, words and latest weekly card.</p><div data-together="full">${togetherHTML(true)}</div></div>
    <h2>The four boxes</h2>
    <div class="box4">
      <div><div class="ar-t">القرآن</div><b>Qurʾān</b><p class="small muted">Tajwīd from zero, then the second half of Juzʾ 30 by heart.</p></div>
      <div><div class="ar-t">العربيّة</div><b>Arabic</b><p class="small muted">Morphology, then syntax. Ten words a week.</p></div>
      <div><div class="ar-t">العقائد</div><b>Belief</b><p class="small muted">Al‑Muẓaffar’s ʿAqāʾid with Shaykh Shomali’s 32 lessons.</p></div>
      <div><div class="ar-t">العمل</div><b>Practice</b><p class="small muted">Munyat al‑Murīd; the fiqh you live by; Kumayl.</p></div>
    </div>
    <h2>The year</h2>
    <div class="stack" style="gap:8px">${MONTHS.map((m,i)=>`<details class="card month" ${i===mi?"open":""}><summary style="cursor:pointer;display:flex;justify-content:space-between;gap:10px"><b>${i+1}. ${m[0]}</b>${i===mi?`<span class="pill">Now</span>`:""}</summary>
      <dl class="mdl"><dt>Qurʾān</dt><dd>${m[1]}</dd><dt>Arabic</dt><dd>${m[2]}</dd><dt>Belief</dt><dd>${m[3]}</dd><dt>Practice</dt><dd>${m[4]}</dd></dl></details>`).join("")}</div>
    <p class="small muted">Months follow the Hijri year from your Day One. Exams will move some of them; the destination does not move.</p>
    <details class="card"><summary style="cursor:pointer"><b>Waiting for later (${LATER.length})</b></summary><p class="small muted" style="margin-top:8px">Good things, deliberately left for Year Two and after, so that the four boxes get your whole attention.</p><ul class="read">${LATER.map(x=>`<li>${x}</li>`).join("")}</ul></details>
    ${cards.length?`<details class="card"><summary style="cursor:pointer"><b>Weekly cards (${cards.length})</b></summary><table><thead><tr><th>Week</th><th>Q</th><th>A</th><th>B</th><th>P</th></tr></thead><tbody>${cards.map(([k,c])=>`<tr><td>${k.slice(1)}</td><td>${c.q||""}</td><td>${c.a||""}</td><td>${c.b||""}</td><td>${c.p||""}</td></tr>`).join("")}</tbody></table></details>`:""}
    <details class="card"><summary style="cursor:pointer"><b>Settings and backup</b></summary><div class="stack" style="margin-top:10px">
      <label class="small muted" for="lb">My name, as my study partner sees it</label><input type="text" id="lb" value="${esc(S.label)}">
      <label class="small muted" for="mm">My moment</label><input type="text" id="mm" value="${esc(S.moment)}">
      <div class="grid2"><div><label class="small muted" for="da">Arabic day</label><select id="da">${WD.map((d,i)=>`<option value="${i}" ${i==S.days.arabic?"selected":""}>${d}</option>`).join("")}</select></div>
      <div><label class="small muted" for="db">Belief day</label><select id="db">${WD.map((d,i)=>`<option value="${i}" ${i==S.days.belief?"selected":""}>${d}</option>`).join("")}</select></div></div>
      <label class="small muted" for="wy">Why I am doing this</label><textarea id="wy">${esc(S.why)}</textarea>
      <button class="btn primary" id="sv">Save</button>
      <p class="small muted">${DB ? "Your progress is kept on this phone and saved to the course, where only the two personal links can see it." : "Your progress is kept on this phone."} The progress code is a backup: send it to Abdulahi on WhatsApp, or paste it on a new phone.</p>
      <div class="row"><button class="btn" id="bk1">Copy my progress code</button><button class="btn" id="bk2">Restore from a backup</button></div>
      <textarea id="bkt" hidden placeholder="Paste a backup here, then press Restore again"></textarea><p class="small muted" id="msg"></p></div></details>
    <details class="card"><summary style="cursor:pointer"><b>Sources</b></summary><ul class="small read">
      <li>al‑Shahīd al‑Thānī, Munyat al‑Murīd, ed. Riḍā al‑Mukhtārī (Qom, 1409 AH), pp. 224, 262, 388; English in full: Alexander Khaleeli, <i>Desire of the Aspirant</i> (ICAS Press, 2016).</li>
      <li>al‑Kulaynī, al‑Kāfī, vol. 1, Kitāb Faḍl al‑ʿIlm, chapter on asking the scholar, ḥadīths 2, 3, 5; vol. 2, chapter on balance and constancy in deeds, ḥadīth 2; gradings from al‑Majlisī, Mirʾāt al‑ʿUqūl, as printed on thaqalayn.net (checked 27 November 2026).</li>
      <li>The office of Sayyid al‑Sīstānī, sistani.org/15510 and 15307.</li>
      <li>Qom seminary handbook for 1404 to 1405 SH (the first semester this year follows).</li>
      <li>Recitation: al‑Ḥuṣarī, the teaching recitation, everyayah.com. English of the Qurʾān: ʿAlī Qulī Qarāʾī.</li>
      <li>Lessons: Shaykh Dr Mohammad Ali Shomali (belief); Al‑Qalam Institute (morphology).</li></ul></details>
    <p class="honest">Prepared by Basma Press. Not yet read by a teacher.</p></div>`;
  $("#sv").onclick=()=>{ S.label=$("#lb").value.trim(); S.moment=$("#mm").value.trim(); S.days={arabic:+$("#da").value, belief:+$("#db").value}; S.why=$("#wy").value.trim(); save(); $("#msg").textContent="Saved."; };
  $("#bk1").onclick=()=>copy(JSON.stringify(S), $("#msg"));
  $("#bk2").onclick=()=>{ const t=$("#bkt"); if(t.hidden){ t.hidden=false; t.focus(); return; } try{ const o=JSON.parse(t.value); if(!o.log) throw 0; S=o; save(); $("#msg").textContent="Restored."; render(); }catch(e){ $("#msg").textContent="That does not look like a progress code from this app. Copy it again and paste the whole text."; } };
}

function copy(txt, msgEl){
  const fall = () => { const t=document.createElement("textarea"); t.value=txt; document.body.appendChild(t); t.select(); try{ document.execCommand("copy"); msgEl.textContent="Copied."; }catch(e){ msgEl.textContent="Select the text and copy it."; } t.remove(); };
  try{ navigator.clipboard.writeText(txt).then(()=>msgEl.textContent="Copied.", fall); }catch(e){ fall(); }
}
render();
(API ? connectRest : connect)();
if(API && "serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
</script>
</body></html>
