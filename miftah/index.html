<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#1E5A4A"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Miftāḥ"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest"><script>window.MIFTAH_API="https://miftah-study.netlify.app/api/progress";window.MIFTAH_BOOK_API="https://miftah-study.netlify.app/api/book";</script><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style></head><body><title>Miftāḥ</title>

<style>
/* Layout: one column, a phone in the hand; four rooms on a bottom bar; the day's work on one card. */
:root{
  --paper:#F4F6F1; --surface:#FFFFFF; --ink:#18261F; --muted:#5B6A62; --line:#D7DDD4;
  --green:#1E5A4A; --green-soft:#E3EEE8; --gold:#A8781E; --gold-soft:#F5ECD8; --warn:#9B3B2C;
  --t-gr:#9A9385; --t-gn:#2E7D3B; --t-bl:#2463A8; --t-m2:#A87A0B; --t-m246:#D2621A; --t-m45:#BF2A2A; --t-m6:#7A1C1C;
  --f-ar:"Amiri","Geeza Pro","Noto Naskh Arabic",serif; --f-q:"Amiri Quran","Amiri","Geeza Pro",serif;
  --f-read:"Newsreader","Iowan Old Style","Georgia",serif; --f-ui:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1713; --surface:#15211C; --ink:#E7EEE9; --muted:#9DADA4; --line:#26362F;
  --green:#79C7AC; --green-soft:#1C3029; --gold:#E2B55C; --gold-soft:#2C2616; --warn:#E58A79;
  --t-gr:#8E887C; --t-gn:#6BC27A; --t-bl:#7FB1EE; --t-m2:#E3B544; --t-m246:#F09553; --t-m45:#F07070; --t-m6:#D27B7B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1713; --surface:#15211C; --ink:#E7EEE9; --muted:#9DADA4; --line:#26362F;
  --green:#79C7AC; --green-soft:#1C3029; --gold:#E2B55C; --gold-soft:#2C2616; --warn:#E58A79;
  --t-gr:#8E887C; --t-gn:#6BC27A; --t-bl:#7FB1EE; --t-m2:#E3B544; --t-m246:#F09553; --t-m45:#F07070; --t-m6:#D27B7B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-ui);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 14px;font:500 .92rem var(--f-ui);color:var(--ink);cursor:pointer;min-height:42px}
.chip[aria-pressed="true"]{background:var(--green);color:var(--paper);border-color:var(--green)}
.progress-dots{display:flex;gap:6px}
.progress-dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.progress-dots i.on{background:var(--green)}
.person{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}

.toggle{width:52px;height:30px;border-radius:99px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .2s}
.toggle[aria-checked="true"]{background:var(--gold)}
.toggle[aria-checked="true"]::after{left:25px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* reader */
.matn{font-family:var(--f-read);font-size:1.12rem;line-height:1.6;padding:14px 16px;border-radius:12px;background:var(--gold-soft);border-left:3px solid var(--gold)}
.matn .orig{display:block;margin-top:8px}

.dars .seg{margin:6px 0 14px}
.linkish{background:none;border:0;padding:0;color:var(--green);font:500 .84rem var(--f-ui);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.argument ol{margin:6px 0 0;padding-left:22px;font-family:var(--f-read);font-size:1.02rem;line-height:1.55}
.argument li{margin-bottom:6px}
.terms dl{display:grid;grid-template-columns:1fr;gap:10px;margin:8px 0 0}
.terms dt{font-weight:600}
.terms dt .ar-s{font-family:var(--f-ar);font-weight:400;color:var(--green);margin-left:8px}
.terms dd{margin:2px 0 0;font-family:var(--f-read);color:var(--ink)}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font:inherit;color:var(--ink);cursor:pointer;margin-top:8px;min-height:44px}
.opt[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--paper))}
.lesson-row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer}
.lesson-row[disabled]{cursor:default;opacity:.55}
.lesson-row .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.lesson-row.done .n{color:var(--green);font-weight:600}
.chapter{margin-top:14px}
.book{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start}
.spine{width:52px;height:72px;border-radius:5px 8px 8px 5px;background:var(--green);color:var(--paper);display:grid;place-items:center;font-family:var(--f-read);font-weight:600;font-size:1.2rem;box-shadow:inset 6px 0 0 color-mix(in srgb,var(--ink) 18%,transparent)}
.spine.soon{background:var(--line);color:var(--muted)}
.wordcount{font-size:.8rem;color:var(--muted);text-align:right}
</style>

<script>
/* Miftāḥ, the ḥawza in English. One book open at a time; each lesson runs the ḥawza's cycle:
   muṭālaʿa, dars, ishkāl, taqrīr, imtiḥān, mubāḥatha. */
const SHELF = [{"no": 1, "id": "bab", "title": "The Eleventh Chapter", "author": "al‑ʿAllāma al‑Ḥillī (d. 726 AH / 1325 CE), with al‑Miqdād al‑Suyūrī (d. 826 AH / 1423 CE)", "discipline": "Creed by proof", "year": 1, "status": "open", "spine": "١"}, {"no": 2, "title": "The Student’s Way", "author": "al‑Shahīd al‑Thānī (d. 965 AH / 1558 CE), Munyat al‑Murīd", "discipline": "Adab", "year": 1, "status": "soon", "spine": "٢"}, {"no": 3, "title": "The Rule of Thought", "author": "al‑Taftāzānī (d. 792 AH / 1390 CE), Tahdhīb al‑Manṭiq, with the Ḥāshiya of Mullā ʿAbd Allāh al‑Yazdī", "discipline": "Logic", "year": 1, "status": "soon", "spine": "٣"}, {"no": 4, "title": "The Damascene Gleam: Worship", "author": "al‑Shahīd al‑Awwal (d. 786 AH / 1384 CE), al‑Lumʿa al‑Dimashqiyya", "discipline": "Fiqh", "year": 1, "status": "soon", "spine": "٤"}, {"no": 5, "title": "The Radiant Garden", "author": "al‑Shahīd al‑Thānī, al‑Rawḍa al‑Bahiyya (Sharḥ al‑Lumʿa)", "discipline": "Fiqh with its proofs", "year": 2, "status": "soon", "spine": "٥"}, {"no": 6, "title": "The Landmarks", "author": "Ḥasan ibn Zayn al‑Dīn (d. 1011 AH / 1602 CE), Maʿālim al‑Uṣūl", "discipline": "Legal theory", "year": 2, "status": "soon", "spine": "٦"}, {"no": 7, "title": "The Care of Reports", "author": "al‑Shahīd al‑Thānī, al‑Riʿāya fī ʿIlm al‑Dirāya", "discipline": "Ḥadīth sciences", "year": 2, "status": "soon", "spine": "٧"}, {"no": 8, "title": "Unveiling the Intent", "author": "al‑ʿAllāma al‑Ḥillī, Kashf al‑Murād, on al‑Ṭūsī’s Tajrīd", "discipline": "Advanced theology", "year": 3, "status": "soon", "spine": "٨"}];
const LINK_KEY = (() => { try{ const k=new URL(location.href).searchParams.get("k"); if(k){ localStorage.setItem("miftah.key",k); return k; } return localStorage.getItem("miftah.key"); }catch(e){ return null; } })();
const API = window.MIFTAH_API || null;                 // progress service
const BOOK_API = window.MIFTAH_BOOK_API || null;       // book text, personal links only
const STORE = API && LINK_KEY ? "miftah.v2." + LINK_KEY : "miftah.v2";
const OLD_STORE = API && LINK_KEY ? "miftah.v1." + LINK_KEY : "miftah.v1";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g,"$1<i>$2</i>");
const app=$("#app"), tabs=$("#tabs"), panel=$("#panel");
let TAB="today";

/* ---------- state ---------- */
const fresh = () => ({v:2, questions:[], L:{}, exams:{}, log:{}, calls:{}});
function migrate(o){
  if(!o) return fresh();
  if(o.v===2) return Object.assign(fresh(), o);
  const n = fresh();                      // carry Day One over from the first Miftāḥ
  for(const k of ["owner","label","start","why","moment","updatedAt"]) if(o[k]!=null) n[k]=o[k];
  n.questions = (o.questions||[]).map(q=>({...q}));
  if(o.start) n.dayOne = true;
  return n;
}
function load(){
  try{ const t=localStorage.getItem(STORE); if(t) return migrate(JSON.parse(t)); }catch(e){}
  try{ const t=localStorage.getItem(OLD_STORE); if(t) return migrate(JSON.parse(t)); }catch(e){}
  return fresh();
}
let S = load();
function save(){ S.updatedAt=new Date().toISOString(); try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} schedulePush(); }

/* ---------- dates ---------- */
const DAY=86400000;
const iso = d => { const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const today = () => iso(new Date());
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const fmt = s => parse(s).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const WD=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const HMA=["محرّم","صفر","ربيع الأوّل","ربيع الثاني","جمادى الأولى","جمادى الآخرة","رجب","شعبان","رمضان","شوّال","ذو القعدة","ذو الحجّة"];
function hijri(d){
  const y=d.getFullYear(), m=d.getMonth()+1, day=d.getDate();
  const a=Math.floor((14-m)/12), yy=y+4800-a, mm=m+12*a-3;
  const jd=day+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;
  const l0=jd-1948440+10632, n=Math.floor((l0-1)/10631); let l=l0-10631*n+354;
  const j=Math.floor((10985-l)/5316)*Math.floor(50*l/17719)+Math.floor(l/5670)*Math.floor(43*l/15238);
  l=l-Math.floor((30-j)/15)*Math.floor(17719*j/50)-Math.floor(j/16)*Math.floor(15238*j/43)+29;
  const hm=Math.floor(24*l/709), hd=l-Math.floor(709*hm/24), hy=30*n+j-30; return {y:hy,m:hm,d:hd};
}
const toAr = n => String(n).replace(/\d/g, x => "٠١٢٣٤٥٦٧٨٩"[x]);
const weekStart = () => { const d=new Date(); d.setDate(d.getDate()-((d.getDay()+1)%7)); return iso(d); };   // weeks run Saturday to Friday
function logToday(k){ const t=today(); S.log[t]={...(S.log[t]||{}), [k]:(S.log[t]?.[k]||0)+1}; }

/* ---------- the book text (served only to personal links) ---------- */
let BOOK = null, BOOK_STATE = "loading";
const BOOK_CACHE = id => "miftah.book." + id + "." + (LINK_KEY||"local");
async function loadBook(id){
  if(window.MIFTAH_BOOKS && window.MIFTAH_BOOKS[id]){ BOOK=window.MIFTAH_BOOKS[id]; BOOK_STATE="ok"; return; }
  try{ const t=localStorage.getItem(BOOK_CACHE(id)); if(t){ BOOK=JSON.parse(t); BOOK_STATE="ok"; } }catch(e){}
  if(!BOOK_API || !LINK_KEY){ if(!BOOK) BOOK_STATE = LINK_KEY ? "offline" : "nokey"; return; }
  try{
    const r = await fetch(BOOK_API+"?id="+encodeURIComponent(id)+"&k="+encodeURIComponent(LINK_KEY)+"&have="+encodeURIComponent(BOOK?BOOK.rev:""),{cache:"no-store"});
    if(r.status===304) return;
    if(r.status===403){ if(!BOOK) BOOK_STATE="nokey"; return; }
    if(!r.ok) throw 0;
    BOOK = await r.json(); BOOK_STATE="ok";
    try{ localStorage.setItem(BOOK_CACHE(id), JSON.stringify(BOOK)); }catch(e){}
  }catch(e){ if(!BOOK) BOOK_STATE="offline"; }
}
const lessonsOf = () => BOOK ? BOOK.lessons : [];
const LK = n => BOOK.id+":"+n;
const passed = n => !!(S.L[LK(n)]||{}).passed;
const chapters = () => { const out=[]; for(const l of lessonsOf()){ let c=out.find(x=>x.title===l.chapter); if(!c){ c={title:l.chapter, n:out.length+1, lessons:[]}; out.push(c);} c.lessons.push(l.n); } return out; };
const chapterOf = n => chapters().find(c=>c.lessons.includes(n));
const examKey = c => BOOK.id+":s"+c.n;
function nextThing(){
  if(!BOOK) return null;
  for(const c of chapters()){
    for(const n of c.lessons) if(!passed(n)) return {kind:"lesson", n};
    if(!(S.exams[examKey(c)]||{}).passed) return {kind:"exam", c};
  }
  if(!(S.exams[BOOK.id+":book"]||{}).passed) return {kind:"bookexam"};
  return {kind:"done"};
}
const unlockedLesson = n => n===1 || passed(n-1) && (()=>{ const prev=chapterOf(n-1), cur=chapterOf(n); return prev===cur || (S.exams[examKey(prev)]||{}).passed; })();

/* ---------- shared progress ---------- */
let DB=null, UID=null, PEOPLE={}, SYNC="local", pushTimer=null, pushing=false, pushAgain=false;
function summary(){
  const last7=[...Array(7)].map((_,i)=>{ const d=iso(new Date(Date.now()-(6-i)*DAY)); return !!S.log[d]; });
  const nt = nextThing();
  const passedN = BOOK ? lessonsOf().filter(l=>passed(l.n)).length : Object.values(S.L).filter(x=>x.passed).length;
  return {v:2, label:S.label||"", start:S.start||null, last7, days:Object.keys(S.log).length,
    book: BOOK ? BOOK.title : "The Eleventh Chapter", total: BOOK ? lessonsOf().length : 26, passed: passedN,
    taqrir: Object.values(S.L).filter(x=>x.taqrir).length,
    exams: Object.values(S.exams).filter(x=>x.passed).length,
    now: nt && nt.kind==="lesson" ? ("Lesson "+nt.n+": "+lessonsOf()[nt.n-1].title) : nt && nt.kind==="exam" ? ("Exam: "+nt.c.title) : nt && nt.kind==="bookexam" ? "Book exam" : nt && nt.kind==="done" ? "Book finished" : "",
    openQ:S.questions.filter(q=>!q.ans).length, active:Object.keys(S.log).sort().pop()||null};
}
function schedulePush(){ if(!DB||!UID||!S.start) return; clearTimeout(pushTimer); pushTimer=setTimeout(push,1200); }
async function push(){
  if(pushing){ pushAgain=true; return; } pushing=true;
  try{ const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({k:LINK_KEY,state:S,summary:summary()})}); if(!r.ok) throw 0; PEOPLE[UID]={summary:summary()}; SYNC="shared"; paintTogether(); }
  catch(e){}
  pushing=false; if(pushAgain){ pushAgain=false; push(); }
}
async function connectRest(){
  if(!API) return;
  if(!LINK_KEY){ SYNC="nokey"; paintTogether(); return; }
  try{
    const r=await fetch(API+"?k="+encodeURIComponent(LINK_KEY),{cache:"no-store"});
    if(!r.ok){ SYNC = r.status===403 ? "badkey" : "local"; paintTogether(); return; }
    const j=await r.json(); DB="rest"; UID=j.me.id;
    if(S.owner && S.owner!==UID) S=fresh();
    S.owner=UID; if(!S.label) S.label=j.me.label;
    const rs = j.me.state ? migrate(j.me.state) : null;
    if(rs && (!S.updatedAt || (rs.updatedAt||"")>S.updatedAt || (S.v===2 && j.me.state.v!==2 && !Object.keys(S.L).length))){
      S = Object.assign(rs, {owner:UID});
      try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){}
      if(panel.hidden) render();
    }
    if(S.start && (!j.me.state || j.me.state.v!==2 || (S.updatedAt||"")>(j.me.state.updatedAt||""))) push();
    SYNC="shared"; PEOPLE=j.people||{}; paintTogether();
    document.addEventListener("visibilitychange", async () => { if(document.visibilityState!=="visible") return; try{ const r2=await fetch(API+"?k="+encodeURIComponent(LINK_KEY),{cache:"no-store"}); if(r2.ok){ PEOPLE=(await r2.json()).people||{}; paintTogether(); } }catch(e){} });
  }catch(e){ SYNC="local"; paintTogether(); }
}
const personName = id => id===UID ? "You" : ((PEOPLE[id]&&PEOPLE[id].summary.label) || "Your study partner");
function togetherHTML(){
  if(SYNC==="nokey") return `<p class="small muted">Open Miftāḥ from your personal link once, and your progress will be kept beside your study partner’s.</p>`;
  if(SYNC==="badkey") return `<p class="small muted">This is not one of Miftāḥ’s personal links. Your progress is kept on this phone.</p>`;
  if(!DB) return `<p class="small muted">Your progress is kept on this phone, and shared with your study partner when you are online.</p>`;
  const ids=Object.keys(PEOPLE).sort((a,b)=>a===UID?-1:b===UID?1:0);
  return (ids.length<2?`<p class="small muted">When your study partner begins, their week appears here beside yours.</p>`:"") + ids.map(personRow).join("");
}
function personRow(id){
  const s=PEOPLE[id].summary||{}, nm=esc(personName(id));
  const dots=`<div class="days" aria-label="Last seven days">${(s.last7||[]).map(on=>`<i class="${on?"on":""}"></i>`).join("")}</div>`;
  if(s.v!==2) return `<div class="person"><div class="row" style="justify-content:space-between"><b>${nm}</b><span class="pill gold">${s.start?"Day One done":"Not started"}</span></div>${dots}<p class="small muted">Opens the new Miftāḥ next time.</p></div>`;
  const quiet = s.active && s.active < iso(new Date(Date.now()-3*DAY));
  return `<div class="person"><div class="row" style="justify-content:space-between"><b>${nm}</b>${quiet?`<span class="pill gold">Quiet since ${fmt(s.active)}</span>`:s.start?`<span class="pill">${s.passed} of ${s.total}</span>`:`<span class="pill gold">Not started</span>`}</div>
    ${dots}<p class="small muted">${esc(s.book)} · ${s.passed} lessons passed · ${s.taqrir} taqrīrs · ${s.exams} exams · ${s.openQ} open question${s.openQ===1?"":"s"}</p>${s.now?`<p class="small">Now: ${esc(s.now)}</p>`:""}</div>`;
}
function paintTogether(){ document.querySelectorAll("[data-together]").forEach(el => el.innerHTML = togetherHTML()); }

/* ---------- shell ---------- */
function render(){
  if(!S.dayOne){ tabs.hidden=true; return dayOne(0); }
  tabs.hidden=false;
  tabs.querySelectorAll("button").forEach(b => b.setAttribute("aria-current", b.dataset.tab===TAB ? "page" : "false"));
  ({today:renderToday, shelf:renderShelf, ask:renderAsk, record:renderRecord})[TAB]();
  window.scrollTo(0,0);
}
tabs.addEventListener("click", e => { const b=e.target.closest("button"); if(!b) return; TAB=b.dataset.tab; render(); });
function header(eyebrow, title){
  const d=new Date(), h=hijri(d);
  return `<div class="top"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1></div>
  <div style="text-align:right"><div class="date-ar">${toAr(h.d)} ${HMA[h.m-1]} ${toAr(h.y)}</div><div class="small muted">${d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}</div></div></div>`;
}
function openPanel(html, after){ panel.innerHTML=`<div class="wrap stack"><button class="back" id="bk">‹ Back</button>${html}</div>`; panel.hidden=false; panel.scrollTop=0; $("#bk").onclick=closePanel; if(after) after(); }
function closePanel(){ panel.hidden=true; panel.innerHTML=""; render(); }
const bookMissing = () => BOOK_STATE==="loading" ? `<p class="muted">Opening the book…</p>` :
  BOOK_STATE==="nokey" ? `<div class="note">The books open from your personal link. Use the link you were sent, once, on this phone.</div>` :
  `<div class="note">The book could not be fetched. Connect to the internet once and it will stay on this phone.</div>`;

/* ---------- Day One ---------- */
function dayOne(step){
  const dots=`<div class="progress-dots">${[0,1,2].map(i=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div>`;
  const shell=(inner,next,label="Next")=>{ app.innerHTML=`<div class="wrap stack" style="padding-top:28px">${dots}${inner}<button class="btn primary" id="nx">${label}</button><p class="honest">Basma Press. A draft, not yet read by a ḥawza teacher.</p></div>`; $("#nx").onclick=next; window.scrollTo(0,0); };
  if(step===0) return shell(`<div class="stack"><div class="eyebrow">Day One</div><h1>Before any book, the intention.</h1>
    <blockquote class="read">“That he make his intention good, and cleanse his heart of stains, so that it is fit to receive knowledge, to keep it, and to go on in it.”</blockquote>
    <p class="src">al‑Shahīd al‑Thānī (d. 965 AH / 1558 CE), Munyat al‑Murīd, the first of the student’s disciplines, ed. al‑Mukhtārī, p. 224. English ours.</p>
    <p class="read">He likens it to preparing the ground before planting. Write one sentence: why are you doing this? No one grades it.</p>
    <label class="small muted" for="why">Why I am doing this</label><textarea id="why">${esc(S.why)}</textarea></div>`, ()=>{ S.why=$("#why").value.trim(); save(); dayOne(1); });
  if(step===1) return shell(`<div class="stack"><div class="eyebrow">Day One</div><h1>The key is the question.</h1>
    <blockquote class="read">“This knowledge has a lock on it, and its key is the question.”</blockquote>
    <p class="src">Imam Jaʿfar al‑Ṣādiq (ʿa), in al‑Kulaynī, al‑Kāfī, vol. 1, Kitāb Faḍl al‑ʿIlm, chapter on asking the scholar, ḥadīth 3. English ours.</p>
    <p class="read">Write the first question you want answered. Anything at all. It waits in Ask for a teacher, a person, to answer.</p>
    <textarea id="q1" placeholder="My first question"></textarea></div>`, ()=>{ const t=$("#q1").value.trim(); if(t) S.questions.push({id:Date.now(), t, date:today()}); save(); dayOne(2); });
  return shell(`<div class="stack"><div class="eyebrow">Day One</div><h1>Your first book.</h1>
    <div class="book"><div class="spine">١١</div><div><h2>The Eleventh Chapter</h2><p class="small muted">al‑ʿAllāma al‑Ḥillī (d. 726 AH / 1325 CE), with the commentary of al‑Miqdād al‑Suyūrī (d. 826 AH / 1423 CE)</p></div></div>
    <p class="read">Al‑Ḥillī wrote it about seven hundred years ago, and the seminaries still teach it, usually with this commentary. He wrote it for everyone: “what all who are charged with duty must know of the foundations of religion”, held “by proof, not by imitation”.</p>
    <p class="read">You will read it the way the ḥawza reads it. Each lesson: questions before you read, the text, the lesson on it, the classic objection, your own written summary, four questions, and two prompts for your study partner. Three lessons a week. About ten weeks.</p></div>`,
    ()=>{ S.dayOne=true; if(!S.start) S.start=today(); logToday("dayone"); save(); TAB="today"; render(); }, "Begin");
}

/* ---------- Today ---------- */
function renderToday(){
  if(!BOOK){ app.innerHTML=`<div class="wrap stack">${header("Miftāḥ","Today")}${bookMissing()}</div>`; return; }
  const nt=nextThing(), ws=weekStart();
  const weekLessons=Object.entries(S.L).filter(([k,v])=>v.passedOn && v.passedOn>=ws).length;
  let main="";
  if(nt.kind==="lesson"){ const l=lessonsOf()[nt.n-1], st=(S.L[LK(nt.n)]||{}).step||0;
    main=`<div class="card main stack"><div class="eyebrow">${esc(l.chapter)}</div><h2>Lesson ${l.n}. ${esc(l.title)}</h2>
      <div class="progress-dots">${STEPS.map((s,i)=>`<i class="${i<st?"on":""}"></i>`).join("")}</div>
      <p class="small muted">${st? "You stopped at "+STEPS[st].name.toLowerCase()+"." : "About "+(l.minutes||45)+" minutes. It can be split across the day."}</p>
      <button class="btn primary" id="go">${st?"Continue":"Begin the lesson"}</button></div>`; }
  else if(nt.kind==="exam") main=`<div class="card main stack"><div class="eyebrow">Imtiḥān</div><h2>${esc(nt.c.title)}: the section exam</h2><p class="read">Every lesson of this section is passed. Before the next section, an exam on all of it. Eighty percent passes.</p><button class="btn primary" id="go">Sit the exam</button></div>`;
  else if(nt.kind==="bookexam") main=`<div class="card main stack"><div class="eyebrow">Imtiḥān</div><h2>The book exam</h2><p class="read">Twenty questions from the whole book. Eighty percent closes the book.</p><button class="btn primary" id="go">Sit the book exam</button></div>`;
  else main=`<div class="card main stack"><div class="eyebrow">Finished</div><h2>${esc(BOOK.title)} is closed.</h2><p class="read">Every lesson, every section exam and the book exam are passed. Your transcript is in Record. The next book opens when it is ready.</p></div>`;
  const mub = Object.entries(S.L).filter(([k,v])=>v.passedOn && v.passedOn>=ws).map(([k])=>lessonsOf()[+k.split(":")[1]-1]).filter(Boolean);
  const called = S.calls[ws];
  app.innerHTML=`<div class="wrap stack">${header(esc(BOOK.title),"Today")}${main}
    <div class="card stack"><div class="row" style="justify-content:space-between"><h3>This week</h3><span class="pill ${weekLessons>=3?"":"gold"}">${weekLessons>=3? weekLessons+" lessons ✓" : weekLessons+" of 3 lessons"}</span></div>
      <p class="small muted">Weeks run Saturday to Friday. Three lessons, then one call with your study partner.</p>
      <button class="wk ${called?"done":""}" id="call"><span class="tick"></span><span><b>Mubāḥatha</b><br><span class="when">${mub.length?mub.length+" lesson"+(mub.length===1?"":"s")+" to argue over":"After your first lesson of the week"}</span></span><span class="small muted">30 min</span></button></div>
    <div class="card"><h3 style="margin-bottom:4px">Studying together</h3><div data-together>${togetherHTML()}</div></div>
    <p class="honest">Basma Press. A draft, not yet read by a ḥawza teacher.</p></div>`;
  const go=$("#go"); if(go) go.onclick=()=>{ if(nt.kind==="lesson") openLesson(nt.n); else if(nt.kind==="exam") openExam(nt.c); else openBookExam(); };
  $("#call").onclick=()=>openCall(ws, mub);
}
function openCall(ws, mub){
  openPanel(`<div class="eyebrow">Mubāḥatha · this week</div><h1>The call with your partner</h1>
    <p class="read">Each of you explains each lesson in your own words, without notes, while the other listens for gaps. Then each asks the other the prompts below. Disagree out loud: that is the point.</p>
    ${mub.length? mub.map(l=>`<div class="card stack"><b>Lesson ${l.n}. ${esc(l.title)}</b><ol class="read" style="margin:0;padding-left:20px">${(l.mubahatha||[]).map(p=>`<li>${rich(p)}</li>`).join("")}</ol></div>`).join("") : `<p class="muted read">Pass a lesson this week and its prompts appear here.</p>`}
    <button class="btn primary" id="dn">${S.calls[ws]?"Done this week ✓":"We had the call"}</button>`,
    ()=>$("#dn").onclick=()=>{ S.calls[ws]=today(); logToday("call"); save(); closePanel(); });
}

/* ---------- a lesson ---------- */
const STEPS=[{k:"before",name:"Before you read"},{k:"text",name:"The text"},{k:"dars",name:"The lesson"},{k:"ishkal",name:"The objection"},{k:"taqrir",name:"Your taqrīr"},{k:"check",name:"Four questions"},{k:"mub",name:"For your partner"}];
function openLesson(n, at){
  const l=lessonsOf()[n-1], rec=S.L[LK(n)]=S.L[LK(n)]||{step:0};
  let i = at!=null ? at : (rec.passed ? 0 : Math.min(rec.step||0, STEPS.length-1));
  const segs = l.segs.map(s=>BOOK.segments[s]);
  const draw = () => {
    const step=STEPS[i];
    const dots=`<div class="progress-dots" aria-label="Step ${i+1} of ${STEPS.length}">${STEPS.map((s,j)=>`<i class="${j<=i?"on":""}"></i>`).join("")}</div>`;
    let body="", nextLabel="Next", canNext=()=>true;
    if(step.k==="before") body=`<p class="read muted">${rich(l.why||"")}</p><div class="card stack"><b>Hold these in mind while you read.</b><p class="small muted">You do not need to answer them yet. You will, by the end.</p><ol class="read" style="margin:0;padding-left:20px">${(l.before||[]).map(q=>`<li>${rich(q)}</li>`).join("")}</ol></div>`, nextLabel="Read the text";
    if(step.k==="text") body=`<p class="small muted">Al‑Ḥillī’s words, in our English. Read them slowly, twice.</p>${segs.map(s=>`<div class="matn">${esc(s.en)}<span class="orig"><button class="linkish" data-ar="${s.i}">Show the original</button></span><p class="ar" hidden id="ar${s.i}" style="margin-top:8px;font-size:1.3rem">${esc(s.ar)}</p></div>`).join("")}`, nextLabel="The lesson";
    if(step.k==="dars") body=`<div class="dars">${(l.dars||[]).map(b=>`<div class="seg"><div class="matn" style="font-size:1rem;margin-bottom:12px">${esc((BOOK.segments[b.seg]||{}).en||"")}</div>${b.paras.map(p=>`<p>${rich(p)}</p>`).join("")}</div>`).join("")}</div>
      ${l.argument?`<div class="card argument"><b>${esc(l.argument.title||"The proof, step by step")}</b><ol>${l.argument.steps.map(s=>`<li>${rich(s.replace(/^\d+\.\s*/,""))}</li>`).join("")}</ol></div>`:""}
      ${(l.terms||[]).length?`<details class="card terms"><summary style="cursor:pointer"><b>Terms in this lesson (${l.terms.length})</b></summary><dl>${l.terms.map(t=>`<div><dt>${esc(t.t)}<span class="ar-s">${esc(t.ar||"")}</span></dt><dd>${esc(t.en?t.en+". ":"")}${rich(t.def||"")}</dd></div>`).join("")}</dl></details>`:""}`, nextLabel="The objection";
    if(step.k==="ishkal") body=`<p class="read">The ḥawza learns a position by defending it. Read each objection, answer it in your head, then reveal the answer.</p>${(l.ishkal||[]).map((x,j)=>`<div class="card stack"><p class="read"><b>${rich(x.q)}</b></p><button class="btn" data-rev="${j}">I have my answer. Show it.</button><p class="read" hidden id="rev${j}">${rich(x.a)}${x.by?` <span class="src">(${esc(x.by)})</span>`:""}</p></div>`).join("")}`, nextLabel="Write your taqrīr";
    if(step.k==="taqrir"){ body=`<p class="read">${rich(l.taqrir||"Write the lesson in your own words.")}</p><p class="small muted">Without looking back. At least forty words. This is how the ḥawza makes a lesson yours.</p><textarea id="tq" style="min-height:220px">${esc(rec.taqrir||"")}</textarea><div class="wordcount" id="wc"></div>`; nextLabel="Four questions"; canNext=()=>wc()>=40; }
    if(step.k==="check") body=checkHTML(l, rec), nextLabel="Next";
    if(step.k==="mub") body=`<p class="read">Lesson passed. These two prompts are saved for this week’s call with your partner.</p><div class="card"><ol class="read" style="margin:0;padding-left:20px">${(l.mubahatha||[]).map(p=>`<li>${rich(p)}</li>`).join("")}</ol></div><p class="read">Anything still unclear? Put it in Ask for your teacher.</p><button class="btn" id="toask">Add a question</button>`, nextLabel="Finish";
    panel.innerHTML=`<div class="wrap stack"><button class="back" id="bk">‹ Close</button><div class="eyebrow">Lesson ${l.n} · ${esc(step.name)}</div><h1>${esc(l.title)}</h1>${dots}${body}
      <div class="row" style="justify-content:space-between">${i>0?`<button class="btn ghost" id="pv">‹ ${esc(STEPS[i-1].name)}</button>`:"<span></span>"}${step.k==="check"&&!rec.passed?"":`<button class="btn primary" id="nx">${nextLabel}</button>`}</div></div>`;
    panel.hidden=false; panel.scrollTop=0;
    $("#bk").onclick=()=>{ save(); closePanel(); };
    const pv=$("#pv"); if(pv) pv.onclick=()=>{ i--; draw(); };
    panel.querySelectorAll("[data-ar]").forEach(b=>b.onclick=()=>{ const p=$("#ar"+b.dataset.ar); p.hidden=!p.hidden; b.textContent=p.hidden?"Show the original":"Hide the original"; });
    panel.querySelectorAll("[data-rev]").forEach(b=>b.onclick=()=>{ $("#rev"+b.dataset.rev).hidden=false; b.remove(); });
    const tq=$("#tq"); function wc(){ const n=(tq.value.trim().match(/\S+/g)||[]).length; $("#wc").textContent=n+" words"+(n<40?" · "+(40-n)+" more to continue":""); const nx=$("#nx"); if(nx) nx.disabled=n<40; return n; }
    if(tq){ tq.oninput=()=>{ rec.taqrir=tq.value; wc(); }; wc(); }
    if(step.k==="check") wireCheck(l, rec, ()=>{ draw(); });
    const ta=$("#toask"); if(ta) ta.onclick=()=>{ save(); TAB="ask"; closePanel(); };
    const nx=$("#nx"); if(nx) nx.onclick=()=>{ if(!canNext()) return;
      if(step.k==="taqrir"){ rec.taqrir=tq.value.trim(); rec.taqrirOn=today(); }
      if(i===STEPS.length-1){ save(); closePanel(); return; }
      i++; if(!rec.passed) rec.step=Math.max(rec.step||0,i); logToday("study"); save(); draw(); };
  };
  draw();
}
function shuffleSeed(n, seed){ const a=[...Array(n).keys()]; let s=seed||1; for(let i=n-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function checkHTML(l, rec){
  const tries=rec.tries||0;
  return `<p class="read">${rec.passed?"Passed. You can look again at the questions below.":"Answer all four, then check. Three right passes."}</p>` + (l.check||[]).map((q,j)=>{
    const ord=shuffleSeed(q.options.length, tries*7+j+1);
    return `<div class="card stack" data-q="${j}"><p class="read"><b>${j+1}. ${rich(q.q)}</b></p>${ord.map(o=>`<button class="opt" data-o="${o}" aria-pressed="false">${rich(q.options[o])}</button>`).join("")}<p class="small" hidden data-why></p></div>`; }).join("") +
    (rec.passed?"":`<button class="btn primary" id="chk" disabled>Check my answers</button><p class="read" id="res"></p>`);
}
function wireCheck(l, rec, redraw){
  const pick={};
  panel.querySelectorAll("[data-q]").forEach(card=>{ const j=+card.dataset.q;
    card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(card.dataset.locked) return; card.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); pick[j]=+b.dataset.o; const c=$("#chk"); if(c) c.disabled=Object.keys(pick).length<l.check.length; }); });
  const c=$("#chk"); if(!c) return;
  c.onclick=()=>{
    let right=0;
    panel.querySelectorAll("[data-q]").forEach(card=>{ const j=+card.dataset.q, q=l.check[j]; card.dataset.locked=1;
      card.querySelectorAll(".opt").forEach(b=>{ const o=+b.dataset.o; if(o===q.answer) b.classList.add("right"); else if(o===pick[j]) b.classList.add("wrong"); });
      if(pick[j]===q.answer) right++; const w=card.querySelector("[data-why]"); w.hidden=false; w.innerHTML=rich(q.why||""); });
    const ok = right >= Math.ceil(l.check.length*0.75);
    rec.tries=(rec.tries||0)+1; rec.best=Math.max(rec.best||0, right);
    if(ok){ rec.passed=true; rec.passedOn=today(); rec.score=right+"/"+l.check.length; rec.step=STEPS.length-1; logToday("passed"); }
    save();
    $("#res").innerHTML = ok ? `<b>${right} of ${l.check.length}.</b> Passed.` : `<b>${right} of ${l.check.length}.</b> Not yet. Read the lesson again, then try once more; the answers will be in a new order.`;
    c.outerHTML = ok ? `<button class="btn primary" id="nx2">Next</button>` : `<div class="row"><button class="btn" id="rd">Read the lesson again</button><button class="btn primary" id="ag">Try again</button></div>`;
    const n2=$("#nx2"); if(n2) n2.onclick=()=>{ openLesson(l.n, STEPS.length-1); };
    const rd=$("#rd"); if(rd) rd.onclick=()=>openLesson(l.n, 2);
    const ag=$("#ag"); if(ag) ag.onclick=redraw;
  };
}

/* ---------- exams ---------- */
function examPanel(title, intro, qs, key, onDone){
  const ans={};
  openPanel(`<div class="eyebrow">Imtiḥān</div><h1>${esc(title)}</h1><p class="read">${intro}</p>
    ${qs.map((x,j)=>{ const ord=shuffleSeed(x.q.options.length, j*13+((S.exams[key]||{}).tries||0)+3); return `<div class="card stack" data-e="${j}"><p class="small muted">From lesson ${x.n}</p><p class="read"><b>${j+1}. ${rich(x.q.q)}</b></p>${ord.map(o=>`<button class="opt" data-o="${o}" aria-pressed="false">${rich(x.q.options[o])}</button>`).join("")}<p class="small" hidden data-why></p></div>`; }).join("")}
    <button class="btn primary" id="sub" disabled>Hand in</button><p class="read" id="res"></p>`, ()=>{
    panel.querySelectorAll("[data-e]").forEach(card=>{ const j=+card.dataset.e; card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(card.dataset.locked) return; card.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); ans[j]=+b.dataset.o; $("#sub").disabled=Object.keys(ans).length<qs.length; }); });
    $("#sub").onclick=()=>{
      let right=0; panel.querySelectorAll("[data-e]").forEach(card=>{ const j=+card.dataset.e, q=qs[j].q; card.dataset.locked=1;
        card.querySelectorAll(".opt").forEach(b=>{ const o=+b.dataset.o; if(o===q.answer) b.classList.add("right"); else if(o===ans[j]) b.classList.add("wrong"); });
        if(ans[j]===q.answer) right++; const w=card.querySelector("[data-why]"); w.hidden=false; w.innerHTML=rich(q.why||""); });
      const pct=Math.round(100*right/qs.length), ok=pct>=80, e=S.exams[key]=S.exams[key]||{};
      e.tries=(e.tries||0)+1; e.best=Math.max(e.best||0,pct); if(ok && !e.passed){ e.passed=true; e.on=today(); e.score=pct; }
      logToday("exam"); save();
      $("#res").innerHTML = ok ? `<b>${pct} percent.</b> Passed.` : `<b>${pct} percent.</b> Eighty passes. Look again at the lessons where you missed, then sit it again; the questions will be in a new order.`;
      $("#sub").outerHTML=`<button class="btn primary" id="cl">${ok?"Continue":"Close"}</button>`; $("#cl").onclick=()=>{ closePanel(); if(ok&&onDone) onDone(); };
    };
  });
}
function examQs(ns, limit, seed){
  let qs=[]; for(const n of ns){ const l=lessonsOf()[n-1]; (l.check||[]).forEach((q,j)=>qs.push({n, q})); }
  const ord=shuffleSeed(qs.length, seed); qs=ord.map(i=>qs[i]); return limit? qs.slice(0,limit) : qs;
}
function openExam(c){ const k=examKey(c); examPanel(c.title+": section exam", "Every question from this section, in a new order. Eighty percent passes.", examQs(c.lessons, 0, 5+((S.exams[k]||{}).tries||0)), k); }
function openBookExam(){ const k=BOOK.id+":book"; examPanel("The book exam", "Twenty questions from the whole book. Eighty percent closes the book.", examQs(lessonsOf().map(l=>l.n), 20, 11+((S.exams[k]||{}).tries||0)), k); }

/* ---------- Shelf ---------- */
function renderShelf(){
  const open = SHELF.filter(b=>b.status==="open"), soon = SHELF.filter(b=>b.status!=="open");
  let list="";
  if(BOOK){ list = chapters().map(c=>{ const ex=S.exams[examKey(c)]||{};
    return `<div class="chapter"><div class="row" style="justify-content:space-between"><h3>${esc(c.title)}</h3>${ex.passed?`<span class="pill">Exam ${ex.score}%</span>`:""}</div>${c.lessons.map(n=>{ const l=lessonsOf()[n-1], r=S.L[LK(n)]||{}, un=unlockedLesson(n);
      return `<button class="lesson-row ${r.passed?"done":""}" data-l="${n}" ${un?"":"disabled"}><span class="n">${r.passed?"✓":n}</span><span>${esc(l.title)}</span><span class="small muted">${r.passed?r.score:un?"open":""}</span></button>`; }).join("")}</div>`; }).join(""); }
  app.innerHTML=`<div class="wrap stack">${header("Basma Press","The shelf")}
    <p class="read muted">The books the ḥawza teaches, in the order it teaches them. One book open at a time.</p>
    ${open.map(b=>`<div class="card stack"><div class="book"><div class="spine">${b.spine}</div><div><div class="eyebrow">Book ${b.no} · ${esc(b.discipline)}</div><h2>${esc(b.title)}</h2><p class="small muted">${esc(b.author)}</p></div></div>${BOOK?list:bookMissing()}</div>`).join("")}
    <h2>In translation</h2>
    ${soon.map(b=>`<div class="book" style="padding:6px 0"><div class="spine soon">${b.spine}</div><div><div class="eyebrow">Book ${b.no} · ${esc(b.discipline)} · Year ${b.year}</div><h3>${esc(b.title)}</h3><p class="small muted">${esc(b.author)}</p></div></div>`).join("")}
    <p class="honest">Every book is a classical text, translated by Basma Press from the Arabic.</p></div>`;
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>openLesson(+b.dataset.l));
}

/* ---------- Ask ---------- */
function renderAsk(){
  const open=S.questions.filter(q=>!q.ans), done=S.questions.filter(q=>q.ans);
  app.innerHTML=`<div class="wrap stack">${header("Its key is the question","Ask")}
    <p class="read">“People perish only because they do not ask.” <span class="src">Imam al‑Ṣādiq (ʿa), al‑Kāfī, vol. 1, chapter on asking the scholar, ḥadīth 2; al‑Majlisī: ṣaḥīḥ.</span></p>
    <div class="card stack"><label for="nq"><b>A new question</b></label><textarea id="nq" placeholder="Anything you want to understand"></textarea><button class="btn primary" id="add">Add to my list</button></div>
    <div class="row" style="justify-content:space-between"><h2>For my teacher (${open.length})</h2>${open.length?`<button class="btn" id="cp">Copy all</button>`:""}</div><p class="small muted" id="msg"></p>
    <div class="stack">${open.map(q=>`<div class="qitem"><p class="read">${esc(q.t)}</p><div class="row"><span class="small muted">${fmt(q.date)}</span><button class="btn ghost" data-ans="${q.id}">Answered</button><button class="btn ghost" data-del="${q.id}">Remove</button></div></div>`).join("") || `<p class="muted read">No open questions. Every lesson should leave you with at least one.</p>`}</div>
    ${done.length?`<h2>Answered (${done.length})</h2><div class="stack">${done.map(q=>`<div class="qitem ans"><p class="read"><b>${esc(q.t)}</b></p><p class="read">${esc(q.ans)}</p><span class="small muted">${q.by?esc(q.by)+", ":""}${q.ansDate?fmt(q.ansDate):""}</span></div>`).join("")}</div>`:""}
    <p class="honest">Questions of belief and law are answered by a teacher, a person. Nothing in this app answers them.</p></div>`;
  $("#add").onclick=()=>{ const t=$("#nq").value.trim(); if(!t) return; S.questions.push({id:Date.now(), t, date:today()}); save(); renderAsk(); };
  const cp=$("#cp"); if(cp) cp.onclick=()=>copy("My questions\n\n"+open.map((q,i)=>`${i+1}. ${q.t}`).join("\n"), $("#msg"));
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ S.questions=S.questions.filter(q=>q.id!=b.dataset.del); save(); renderAsk(); });
  app.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>{ const q=S.questions.find(x=>x.id==b.dataset.ans);
    openPanel(`<div class="eyebrow">Answered</div><h2>${esc(q.t)}</h2><label class="small muted" for="at">The answer, in your words</label><textarea id="at"></textarea><label class="small muted" for="ab">Who answered</label><input type="text" id="ab" placeholder="Your teacher’s name"><button class="btn primary" id="ok">Save</button>`,
      ()=>$("#ok").onclick=()=>{ q.ans=$("#at").value.trim()||"(answered)"; q.by=$("#ab").value.trim(); q.ansDate=today(); save(); TAB="ask"; closePanel(); }); });
}

/* ---------- Record ---------- */
function renderRecord(){
  const lp = BOOK ? lessonsOf().filter(l=>passed(l.n)) : [];
  const tq = BOOK ? lessonsOf().filter(l=>(S.L[LK(l.n)]||{}).taqrir) : [];
  const exams = BOOK ? chapters().map(c=>({t:c.title, e:S.exams[examKey(c)]})).concat([{t:"Book exam", e:S.exams[BOOK.id+":book"]}]).filter(x=>x.e) : [];
  app.innerHTML=`<div class="wrap stack">${header("Your record","Record")}
    <div class="grid2"><div class="card"><div class="big-num">${lp.length}</div><div class="small muted">lessons passed${BOOK?" of "+lessonsOf().length:""}</div></div><div class="card"><div class="big-num">${tq.length}</div><div class="small muted">taqrīrs written</div></div></div>
    ${S.why?`<div class="card"><div class="eyebrow">Why I am doing this</div><p class="read" style="margin-top:6px">${esc(S.why)}</p></div>`:""}
    <div class="card"><h3 style="margin-bottom:4px">Together</h3><div data-together>${togetherHTML()}</div></div>
    ${exams.length?`<div class="card"><h3>Exams</h3><table><tbody>${exams.map(x=>`<tr><td>${esc(x.t)}</td><td>${x.e.passed?"passed, "+x.e.score+"%":"best "+x.e.best+"%"}</td><td class="small muted">${x.e.on?fmt(x.e.on):""}</td></tr>`).join("")}</tbody></table></div>`:""}
    ${tq.length?`<details class="card"><summary style="cursor:pointer"><b>My taqrīrs (${tq.length})</b></summary><div class="stack" style="margin-top:10px">${tq.map(l=>{ const r=S.L[LK(l.n)]; return `<div><b>Lesson ${l.n}. ${esc(l.title)}</b><p class="read" style="white-space:pre-wrap;margin-top:4px">${esc(r.taqrir)}</p><p class="small muted">${r.taqrirOn?fmt(r.taqrirOn):""}${r.score?" · "+r.score:""}</p></div>`; }).join("")}</div></details>`:""}
    <details class="card"><summary style="cursor:pointer"><b>Settings and backup</b></summary><div class="stack" style="margin-top:10px">
      <label class="small muted" for="lb">My name, as my study partner sees it</label><input type="text" id="lb" value="${esc(S.label)}">
      <label class="small muted" for="wy">Why I am doing this</label><textarea id="wy">${esc(S.why)}</textarea>
      <button class="btn primary" id="sv">Save</button>
      <p class="small muted">${DB?"Your progress is kept on this phone and saved to Miftāḥ, where only the personal links can see it.":"Your progress is kept on this phone."} The progress code is a backup you can paste on a new phone.</p>
      <div class="row"><button class="btn" id="bk1">Copy my progress code</button><button class="btn" id="bk2">Restore from a backup</button></div>
      <textarea id="bkt" hidden placeholder="Paste a backup here, then press Restore again"></textarea><p class="small muted" id="msg"></p></div></details>
    <details class="card"><summary style="cursor:pointer"><b>About this edition</b></summary><div class="stack small read" style="margin-top:10px">
      <p>${BOOK?esc(BOOK.edition||""):""}</p>
      <p>The English of the text and the lessons are by Basma Press. This is a draft: it has been checked against the Arabic, and it has not yet been read by a teacher trained in the ḥawza. Nothing here is a fatwa; in practice, follow the office of your marjaʿ.</p></div></details>
    <p class="honest">Basma Press.</p></div>`;
  $("#sv").onclick=()=>{ S.label=$("#lb").value.trim(); S.why=$("#wy").value.trim(); save(); $("#msg").textContent="Saved."; };
  $("#bk1").onclick=()=>copy(JSON.stringify(S), $("#msg"));
  $("#bk2").onclick=()=>{ const t=$("#bkt"); if(t.hidden){ t.hidden=false; t.focus(); return; } try{ const o=JSON.parse(t.value); if(!o.questions) throw 0; S=migrate(o); save(); $("#msg").textContent="Restored."; render(); }catch(e){ $("#msg").textContent="That does not look like a progress code from Miftāḥ. Copy it again and paste the whole text."; } };
}
function copy(txt, msgEl){
  const fall=()=>{ const t=document.createElement("textarea"); t.value=txt; document.body.appendChild(t); t.select(); try{ document.execCommand("copy"); msgEl.textContent="Copied."; }catch(e){ msgEl.textContent="Select the text and copy it."; } t.remove(); };
  try{ navigator.clipboard.writeText(txt).then(()=>msgEl.textContent="Copied.", fall); }catch(e){ fall(); }
}
