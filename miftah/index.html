function renderAsk(){
  const open=S.questions.filter(q=>!q.ans), done=S.questions.filter(q=>q.ans);
  app.innerHTML=`<div class="wrap stack">${header("Its key is the question","Questions")}
    <p class="read">“People perish only because they do not ask.” <span class="src">Imam al‑Ṣādiq (ʿa), al‑Kāfī, vol. 1, chapter on asking the scholar, ḥadīth 2; al‑Majlisī: ṣaḥīḥ.</span></p>
    <div class="card stack"><label for="nq"><b>A new question</b></label><textarea id="nq" placeholder="Anything you want to understand"></textarea><button class="btn primary" id="add">Add to my list</button></div>
    <div class="row" style="justify-content:space-between"><h2>Open (${open.length})</h2>${open.length?`<button class="btn" id="cp">Copy all</button>`:""}</div><p class="small muted" id="msg" aria-live="polite"></p>
    <div class="stack">${open.map(q=>`<div class="qitem"><p class="read">${esc(q.t)}</p><div class="row"><span class="small muted">${fmt(q.date)}</span><button class="btn ghost" data-ans="${q.id}">Answered</button><button class="btn ghost" data-del="${q.id}">Remove</button></div></div>`).join("") || `<p class="muted read">No open questions. Every lesson should leave you with at least one.</p>`}</div>
    ${done.length?`<h2>Answered (${done.length})</h2><div class="stack">${done.map(q=>`<div class="qitem ans"><p class="read"><b>${esc(q.t)}</b></p><p class="read">${esc(q.ans)}</p><span class="small muted">${q.by?esc(q.by)+", ":""}${q.ansDate?fmt(q.ansDate):""}</span></div>`).join("")}</div>`:""}
    <p class="honest">When a lesson or your study partner answers one of your questions, mark it answered and write the answer in your own words. Questions of practice go to the office of your marjaʿ.</p></div>`;
  $("#add").onclick=()=>{ const t=$("#nq").value.trim(); if(!t) return; S.questions.push({id:Date.now(), t, date:today()}); save(); renderAsk(); };
  const cp=$("#cp"); if(cp) cp.onclick=()=>copy("My questions\n\n"+open.map((q,i)=>`${i+1}. ${q.t}`).join("\n"), $("#msg"));
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ if(!confirm("Remove this question?")) return; S.questions=S.questions.filter(q=>q.id!=b.dataset.del); save(); renderAsk(); });
  app.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>{ const q=S.questions.find(x=>x.id==b.dataset.ans);
    openPanel(`<div class="eyebrow">Answered</div><h2>${esc(q.t)}</h2><label class="small muted" for="at">The answer, in your words</label><textarea id="at"></textarea><label class="small muted" for="ab">Where I found it</label><input type="text" id="ab" placeholder="Lesson 7, or my study partner"><button class="btn primary" id="ok">Save</button>`,
      ()=>$("#ok").onclick=()=>{ q.ans=$("#at").value.trim()||"(answered)"; q.by=$("#ab").value.trim(); q.ansDate=today(); save(); TAB="ask"; closePanel(); }); });
}

/* ---------- Record ---------- */
function transcriptHTML(){
  const up = unitsReady().filter(u=>unitPassed(u.id));
  const unitsPart = up.length ? `<h2>Level One units</h2><ul>${up.map(u=>{ const x=S.U[u.id]; return `<li>${esc(u.meta.discipline)}, Unit ${u.meta.unit}: ${esc(u.meta.title)}. ${x.score??""} points, ${x.passedOn?fmtH(x.passedOn):""}</li>`; }).join("")}</ul>` : "";
  if(!BOOK) return `<h1>Miftāḥ · Record of study</h1><p>${esc(S.label||"")}</p><p>Begun ${S.start?fmtH(S.start):""}. Printed ${fmtH(today())}.</p>${S.why?`<p><b>Intention:</b> ${esc(S.why)}</p>`:""}${unitsPart}<p><i>A record of private study kept by the learner. Not an ijāza, a certificate or a qualification.</i></p>`;
  const lp = lessonsOf().filter(l=>passed(l.n));
  const ex = chapters().map(c=>({t:c.title, e:S.exams[examKey(c)]})).concat([{t:"Book exam", e:S.exams[BOOK.id+":book"]}]).filter(x=>x.e&&x.e.passed);
  return `<h1>Miftāḥ · Record of study</h1><p>${esc(S.label||"")} · ${esc(BOOK.title)}, ${esc(BOOK.author)}</p>
    <p>Begun ${S.start?fmtH(S.start):""}. Printed ${fmtH(today())}. Edition ${esc(BOOK.rev)}.</p>
    ${S.why?`<p><b>Intention:</b> ${esc(S.why)}</p>`:""}${unitsPart}
    <h2>The Eleventh Chapter: exams</h2>${ex.length?`<ul>${ex.map(x=>`<li>${esc(x.t)}: ${x.e.score} percent, ${fmtH(x.e.on)}</li>`).join("")}</ul>`:"<p>None yet.</p>"}
    <h2>Lessons and taqrīrs</h2>${lp.map(l=>{ const r=S.L[LK(l.n)]; return `<h3>Lesson ${l.n}. ${esc(l.title)} <small>(${esc(r.score||"")}, ${r.passedOn?fmtH(r.passedOn):""})</small></h3><p style="white-space:pre-wrap">${esc(r.taqrir||"")}</p>`; }).join("")||"<p>None yet.</p>"}
    <p><i>A record of private study kept by the learner. Not an ijāza, a certificate or a qualification.</i></p>`;
}
function renderRecord(){
  const lp = BOOK ? lessonsOf().filter(l=>passed(l.n)) : [];
  const tq = BOOK ? lessonsOf().filter(l=>(S.L[LK(l.n)]||{}).taqrir) : [];
  const exams = BOOK ? chapters().map(c=>({t:c.title, e:S.exams[examKey(c)]})).concat([{t:"Book exam", e:S.exams[BOOK.id+":book"]}]).filter(x=>x.e) : [];
  const ch = (BOOK&&BOOK.changes)||[], emend=(BOOK&&BOOK.emendations)||[];
  app.innerHTML=`<div class="wrap stack">${header("Your record","Record")}
    ${(()=>{ const up=unitsReady().filter(u=>unitPassed(u.id)); return `<div class="grid2"><div class="card"><div class="big-num">${up.length}</div><div class="small muted">Level One units passed of 48</div></div><div class="card"><div class="big-num">${lp.length}</div><div class="small muted">lessons of The Eleventh Chapter</div></div></div>${up.length?`<div class="card"><h3>Level One</h3><table><tbody>${up.map(u=>{ const x=S.U[u.id]; return `<tr><td>${esc(u.meta.discipline)} ${u.meta.unit}. ${esc(u.meta.title)}</td><td>${x.score??""} points</td><td class="small muted">${x.passedOn?fmtH(x.passedOn):""}</td></tr>`; }).join("")}</tbody></table></div>`:""}`; })()}
    ${S.why?`<div class="card"><div class="eyebrow">Why I am doing this</div><p class="read" style="margin-top:6px">${esc(S.why)}</p>${(S.whyHist||[]).length>1?`<details><summary class="small muted" style="cursor:pointer">Renewed ${S.whyHist.length-1} time${S.whyHist.length===2?"":"s"}</summary><ul class="small read">${S.whyHist.map(h=>`<li>${fmt(h.on)}: ${h.kept?"kept":esc(h.t)}</li>`).join("")}</ul></details>`:""}</div>`:""}
    <div class="card"><h3 style="margin-bottom:4px">Together</h3><div data-together>${togetherHTML()}</div></div>
    ${exams.length?`<div class="card"><h3>Exams</h3><table><tbody>${exams.map(x=>`<tr><td>${esc(x.t)}</td><td>${x.e.passed?"passed, "+x.e.score+"%":"best "+x.e.best+"%"}</td><td class="small muted">${x.e.on?fmtH(x.e.on):""}</td></tr>`).join("")}</tbody></table></div>`:""}
    ${tq.length?`<details class="card"><summary style="cursor:pointer"><b>My taqrīrs (${tq.length})</b></summary><div class="stack" style="margin-top:10px">${tq.map(l=>{ const r=S.L[LK(l.n)]; return `<div><b>Lesson ${l.n}. ${esc(l.title)}</b><p class="read" style="white-space:pre-wrap;margin-top:4px">${esc(r.taqrir)}</p><p class="small muted">${r.taqrirOn?fmtH(r.taqrirOn):""}${r.score?" · "+r.score:""}</p></div>`; }).join("")}</div></details>`:""}
    ${(BOOK&&lp.length)||Object.values(S.U||{}).some(x=>x.passed)?`<button class="btn" id="print">Print my record</button>`:""}
    ${LINK_KEY&&API?`<details class="card"><summary style="cursor:pointer"><b>My private link</b></summary><div class="stack" style="margin-top:10px"><p class="small muted">This link opens your Miftāḥ on any phone or computer. Keep it to yourself: whoever has it can see and change your progress.</p><input type="text" readonly value="${esc(myLink())}"><div class="row"><button class="btn" id="cpl">Copy my link</button><button class="btn" id="inv2">Invite a study partner</button></div><p class="small muted" id="lmsg" aria-live="polite"></p></div></details>`:""}
    <details class="card"><summary style="cursor:pointer"><b>Settings and backup</b></summary><div class="stack" style="margin-top:10px">
      <label class="small muted" for="lb">My name, as my study partner sees it</label><input type="text" id="lb" value="${esc(S.label)}">
      <label class="small muted" for="mo">My moment</label><input type="text" id="mo" value="${esc(S.moment||"")}">
      <div class="switch"><span class="small muted">Reading size</span><div class="chips" role="group" aria-label="Reading size">${["Smaller","Normal","Larger"].map((nm,i)=>`<button class="chip" data-sz="${i}" aria-pressed="${(S.size??1)===i}">${nm}</button>`).join("")}</div></div>
      <button class="btn primary" id="sv">Save</button>
      <p class="small muted">${DB?"Your progress is kept on this phone and saved to Miftāḥ under your private link"+(S._synced?"; last saved "+new Date(S._synced).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"")+".":"Your progress is kept on this phone only. Download a backup now and then."}</p>
      <div class="row"><button class="btn" id="bkf">Download a backup</button><button class="btn" id="bk1">Copy my progress code</button><button class="btn" id="bk2">Restore from a backup</button></div>
      <textarea id="bkt" hidden placeholder="Paste a backup here, then press Restore again"></textarea><p class="small muted" id="msg" aria-live="polite"></p></div></details>
    <details class="card"><summary style="cursor:pointer"><b>What is kept, and who sees it</b></summary><div class="stack small read" style="margin-top:10px">
      <p>You can delete everything, here and on the service, with the button below.</p><p>On this phone: your progress, your taqrīrs, notes and questions, and a copy of the book so that it opens offline.</p>
      <p>On the Miftāḥ service, under your private link only: the same progress, so that it is safe and your study partners can see your week. They see a summary (lessons, exams, open question count, last seven days and your one line on the week), never your taqrīrs, notes or questions.</p>
      <p>Nothing else: no account, no email, no advertising, no tracking. To stop abuse, the service counts how many new links are made from each connection in an hour, under a one way scrambled code from which the address cannot be read back. The page loads its fonts from itself, not from any outside service.</p>
      <button class="btn ghost" id="wipe">Remove Miftāḥ from this phone</button></div></details>
    ${BOOK?`<details class="card"><summary style="cursor:pointer"><b>About this edition</b></summary><div class="stack small read" style="margin-top:10px">
      <p>${esc(BOOK.edition||"")}</p>
      <p><b>How it was made.</b> Basma Press prepared this edition with the help of AI tools. The translation was checked passage by passage against the Arabic, and every lesson against al‑Miqdād’s commentary, in separate passes. Where al‑Miqdād leaves an objection unanswered, the lesson gives al‑Ḥillī’s reply from Kashf al‑Murād and says so; where the publisher speaks in its own voice, the paragraph is marked. No scholar has signed this edition. Nothing here is a fatwa; in practice, follow the office of your marjaʿ.</p>
      ${emend.length?`<p><b>Note on the text.</b> Where we depart from the printed Arabic:</p><ul>${emend.map(x=>`<li>${rich(x)}</li>`).join("")}</ul>`:""}
      <p><b>Edition</b> ${esc(BOOK.rev)}${BOOK.built?", "+esc(BOOK.built):""}.</p>
      ${ch.length?`<p><b>Changes</b></p><ul>${ch.map(x=>`<li>${rich(x)}</li>`).join("")}</ul>`:""}</div></details>`:""}
    ${FOOT}</div>`;
  $("#sv").onclick=()=>{ S.label=$("#lb").value.trim(); S.moment=$("#mo").value.trim(); save(); $("#msg").textContent="Saved."; };
  const cpl=$("#cpl"); if(cpl) cpl.onclick=()=>copy(myLink(), $("#lmsg"));
  const iv2=$("#inv2"); if(iv2) iv2.onclick=openInvite;
  app.querySelectorAll("[data-sz]").forEach(b=>b.onclick=()=>{ S.size=+b.dataset.sz; applySize(); save(); renderRecord(); });
  $("#bk1").onclick=()=>copy(JSON.stringify(S), $("#msg"));
  $("#bkf").onclick=()=>downloadBackup($("#msg"));
  $("#bk2").onclick=()=>{ const t=$("#bkt"); if(t.hidden){ t.hidden=false; t.focus(); return; } let o; try{ o=JSON.parse(t.value); if(!o.questions) throw 0; }catch(e){ $("#msg").textContent="That does not look like a progress code from Miftāḥ. Copy it again and paste the whole text."; return; }
    const m=migrate(o), nL=Object.values(m.L).filter(x=>x.passed).length, nT=Object.values(m.L).filter(x=>x.taqrir).length;
    if(!confirm(`This replaces everything on this phone with the backup: ${nL} lessons passed, ${nT} taqrīrs, ${m.questions.length} questions. Your current progress will be gone. Replace?`)) return;
    S=Object.assign(m,{owner:S.owner}); save(); $("#msg").textContent="Restored."; render(); };
  const pr=$("#print"); if(pr) pr.onclick=()=>{ const p=$("#printout"); p.innerHTML=transcriptHTML(); p.hidden=false; window.print(); setTimeout(()=>{ p.hidden=true; p.innerHTML=""; }, 500); };
  $("#wipe").onclick=()=>{ if(!confirm("Download a backup first? Press OK to download it, or Cancel to go on without one.")){ } else downloadBackup($("#msg"));
    setTimeout(()=>{ if(!confirm("Remove Miftāḥ’s progress, notes, taqrīrs and the book from this phone? Your progress on the Miftāḥ service stays under your link.")) return;
      const alsoServer = DB && confirm("Also delete your progress from the Miftāḥ service? Your private link will stop working, and this cannot be undone. Press Cancel to keep it there.");
      if(alsoServer){ fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({k:LINK_KEY,erase:true})}).catch(()=>{}); }
      try{ Object.keys(localStorage).filter(k=>k.startsWith("miftah.")).forEach(k=>localStorage.removeItem(k)); }catch(e){}
      try{ caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))); }catch(e){}
      app.innerHTML=`<div class="wrap stack" style="padding-top:40px"><h1>Removed.</h1><p class="read">Miftāḥ’s data is gone from this phone. Close this page. To study again, open your personal link.</p></div>`; tabs.hidden=true; }, 400); };
}
function downloadBackup(msgEl){
  try{ const blob=new Blob([JSON.stringify(S)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="miftah-backup-"+today()+".json"; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); if(msgEl) msgEl.textContent="Backup downloaded."; }
  catch(e){ if(msgEl) msgEl.textContent="This browser would not download; use Copy my progress code instead."; }
}
function copy(txt, msgEl){
  const fall=()=>{ const t=document.createElement("textarea"); t.value=txt; document.body.appendChild(t); t.select(); try{ document.execCommand("copy"); msgEl.textContent="Copied."; }catch(e){ msgEl.textContent="Select the text and copy it."; } t.remove(); };
  try{ navigator.clipboard.writeText(txt).then(()=>msgEl.textContent="Copied.", fall); }catch(e){ fall(); }
}

/* ---------- start ---------- */
function applySize(){ document.documentElement.style.fontSize = ["93.75%","100%","112.5%"][S.size??1]; }
applySize();
render();
loadL1().then(()=>{ if(panel.hidden) render(); paintTogether(); });
loadBook("bab").then(()=>{ if(panel.hidden) render(); paintTogether(); });
connectRest();
if(API && "serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
</script>
