<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#1E5A4A"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Miftāḥ"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest"><script>window.MIFTAH_API="https://miftah-study.netlify.app/api/progress";window.MIFTAH_BOOK_API="https://miftah-study.netlify.app/api/book";window.MIFTAH_HOME="https://miftah-study.netlify.app/";</script><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style><title>Miftāḥ</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://miftah-study.netlify.app; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">

<style>
/* Layout: one column, a phone in the hand; four rooms on a bottom bar; the day's work on one card. */
:root{
  --paper:#F4F6F1; --surface:#FFFFFF; --ink:#18261F; --muted:#5B6A62; --line:#D7DDD4;
  --green:#1E5A4A; --green-soft:#E3EEE8; --gold:#A8781E; --gold-soft:#F5ECD8; --warn:#9B3B2C;
  --t-gr:#9A9385; --t-gn:#2E7D3B; --t-bl:#2463A8; --t-m2:#A87A0B; --t-m246:#D2621A; --t-m45:#BF2A2A; --t-m6:#7A1C1C;
  --f-ar:"Amiri","Geeza Pro","Noto Naskh Arabic",serif; --f-q:"Amiri Quran","Amiri","Geeza Pro",serif;
  --f-read:"Newsreader","Iowan Old Style","Georgia",serif; --f-ui:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1713; --surface:#15211C; --ink:#E7EEE9; --muted:#9DADA4; --line:#26362F;
  --green:#79C7AC; --green-soft:#1C3029; --gold:#E2B55C; --gold-soft:#2C2616; --warn:#E58A79;
  --t-gr:#8E887C; --t-gn:#6BC27A; --t-bl:#7FB1EE; --t-m2:#E3B544; --t-m246:#F09553; --t-m45:#F07070; --t-m6:#D27B7B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1713; --surface:#15211C; --ink:#E7EEE9; --muted:#9DADA4; --line:#26362F;
  --green:#79C7AC; --green-soft:#1C3029; --gold:#E2B55C; --gold-soft:#2C2616; --warn:#E58A79;
  --t-gr:#8E887C; --t-gn:#6BC27A; --t-bl:#7FB1EE; --t-m2:#E3B544; --t-m246:#F09553; --t-m45:#F07070; --t-m6:#D27B7B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:1rem/1.5 var(--f-ui);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-read);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:1.75rem;line-height:1.15}
h2{font-size:1.3rem;line-height:1.2}
h3{font-size:1.05rem}
p{margin:0}
.read{font-family:var(--f-read);font-size:1.06rem;line-height:1.55}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:8px 16px}
.date-ar{font-family:var(--f-ar);font-size:1.15rem;color:var(--green)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card.main{border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.note{background:var(--gold-soft);border-radius:12px;padding:12px 14px;font-size:.93rem}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .95rem var(--f-ui);padding:10px 14px;border-radius:10px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--paper)}
.btn.ghost{background:transparent}
.btn:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--gold) 70%,transparent);outline-offset:2px}
.btn[disabled]{opacity:.5}
a{color:var(--green)}
textarea,input[type=text],input[type=date],select{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:84px;resize:vertical;font-family:var(--f-read);font-size:1.02rem}
.ar{font-family:var(--f-ar);direction:rtl;text-align:right;font-size:1.45rem;line-height:2.1}
.src{font-size:.82rem;color:var(--muted);font-style:italic;font-family:var(--f-read)}
blockquote{margin:0;padding:0 0 0 14px;border-left:3px solid var(--gold)}
/* steps */
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.step .dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.85rem;font-weight:600;color:var(--muted)}
.step.done .dot{background:var(--green);border-color:var(--green);color:var(--paper)}
.step b{display:block;font-weight:600}
.step span.sub{font-size:.85rem;color:var(--muted)}
.step .min{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.week{display:flex;flex-direction:column;gap:0}
.wk{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.wk:last-child{border-bottom:0}
.tick{width:20px;height:20px;border-radius:6px;border:2px solid var(--line)}
.wk.done .tick{background:var(--green);border-color:var(--green)}
.wk .when{font-size:.8rem;color:var(--muted)}
.pill{font-size:.75rem;padding:3px 9px;border-radius:99px;background:var(--green-soft);color:var(--green);font-weight:600;white-space:nowrap}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
/* panel */
.panel{position:fixed;inset:0;background:var(--paper);z-index:20;overflow:auto}
.panel .wrap{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--green);font:500 1rem var(--f-ui);padding:8px 0;cursor:pointer;min-height:44px}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;font:500 .78rem var(--f-ui);color:var(--muted);padding:10px 4px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
nav.tabs button .ar-l{font-family:var(--f-ar);font-size:1.15rem;line-height:1.2}
nav.tabs button[aria-current="page"]{color:var(--green)}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green);border-radius:99px}
.big-num{font-family:var(--f-read);font-size:2.2rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
tr.now td{background:var(--green-soft)}
.scroll{overflow-x:auto}
.month{padding:12px 16px}
.month summary{list-style:none}
.month summary::-webkit-details-marker{display:none}
.mdl{display:grid;grid-template-columns:84px 1fr;gap:6px 12px;margin:10px 0 0;font-size:.92rem}
.mdl dt{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.mdl dd{margin:0;font-family:var(--f-read)}
.grades{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.grades button{min-height:42px;border-radius:9px;border:1px solid var(--line);background:var(--paper);font:600 .95rem var(--f-ui);color:var(--ink);cursor:pointer}
.grades button[aria-pressed="true"]{background:var(--green);color:var(--paper);border-color:var(--green)}
.qitem{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.qitem.ans{border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 14px;font:500 .92rem var(--f-ui);color:var(--ink);cursor:pointer;min-height:42px}
.chip[aria-pressed="true"]{background:var(--green);color:var(--paper);border-color:var(--green)}
.progress-dots{display:flex;gap:6px}
.progress-dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.progress-dots i.on{background:var(--green)}
.person{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.days{display:flex;gap:5px}
.days i{flex:1;height:8px;border-radius:4px;background:var(--line);max-width:34px}
.days i.on{background:var(--green)}
.honest{font-size:.78rem;color:var(--muted);text-align:center;padding-top:8px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.toggle{width:52px;height:30px;border-radius:99px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .2s}
.toggle[aria-checked="true"]{background:var(--gold)}
.toggle[aria-checked="true"]::after{left:25px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* reader */
.matn{font-family:var(--f-read);font-size:1.12rem;line-height:1.6;padding:14px 16px;border-radius:12px;background:var(--gold-soft);border-left:3px solid var(--gold)}
.matn .orig{display:block;margin-top:8px}
.dars p{font-family:var(--f-read);font-size:1.06rem;line-height:1.62;margin:0 0 12px}
.dars .seg{margin:6px 0 14px}
.linkish{background:none;border:0;padding:0;color:var(--green);font:500 .84rem var(--f-ui);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.argument ol{margin:6px 0 0;padding-left:22px;font-family:var(--f-read);font-size:1.02rem;line-height:1.55}
.argument li{margin-bottom:6px}
.terms dl{display:grid;grid-template-columns:1fr;gap:10px;margin:8px 0 0}
.terms dt{font-weight:600}
.terms dt .ar-s{font-family:var(--f-ar);font-weight:400;color:var(--green);margin-left:8px}
.terms dd{margin:2px 0 0;font-family:var(--f-read);color:var(--ink)}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font:inherit;color:var(--ink);cursor:pointer;margin-top:8px;min-height:44px}
.opt[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--paper))}
button.card.wk{width:100%;text-align:left;border-radius:14px;padding:14px 18px;background:var(--surface)}
.lesson-row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer}
.lesson-row[disabled]{cursor:default;opacity:.55}
.lesson-row .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.lesson-row.done .n{color:var(--green);font-weight:600}
.chapter{margin-top:14px}
.book{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start}
.spine{width:52px;height:72px;border-radius:5px 8px 8px 5px;background:var(--green);color:var(--paper);display:grid;place-items:center;font-family:var(--f-read);font-weight:600;font-size:1.2rem;box-shadow:inset 6px 0 0 color-mix(in srgb,var(--ink) 18%,transparent)}
.spine.soon{background:var(--line);color:var(--muted)}
.wordcount{font-size:.8rem;color:var(--muted);text-align:right}

.supplied{border-left:3px solid var(--line);padding-left:10px}
.tag{display:inline-block;font:600 .68rem var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;vertical-align:1px}
.tickrow{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-family:var(--f-read);font-size:1rem;line-height:1.5;cursor:pointer}
.tickrow input{width:20px;height:20px;margin-top:3px;accent-color:var(--green)}
mark{background:var(--gold-soft);color:inherit;border-radius:3px;padding:0 2px}
textarea,input[type=text],input[type=date],input[type=search],select{font-size:max(16px,1rem)}
input[type=search]{width:100%;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit}
.printout{display:none}
@media print{
  body > *:not(.printout){display:none!important}
  .printout{display:block!important;font-family:var(--f-read);color:#000;background:#fff;padding:0 8mm}
  .printout h1{font-size:20pt}.printout h2{font-size:14pt;margin-top:14pt}.printout h3{font-size:11.5pt;margin-top:10pt}
  .printout p,.printout li{font-size:10.5pt;line-height:1.45}
}
</style>

<script>
/* Miftāḥ, the ḥawza in English. Self taught. One book open at a time; each lesson runs the ḥawza's cycle:
   muṭālaʿa, dars, ishkāl, taqrīr, imtiḥān, mubāḥatha; murājaʿa keeps what was learned. */
const SHELF = [{"no": 1, "id": "bab", "title": "The Eleventh Chapter", "author": "al‑ʿAllāma al‑Ḥillī (d. 726 AH / 1325 CE), with al‑Miqdād al‑Suyūrī (d. 826 AH / 1423 CE)", "discipline": "Creed by proof", "year": 1, "status": "open", "spine": "١"}, {"no": 2, "title": "The Student’s Way", "author": "al‑Shahīd al‑Thānī (d. 965 AH / 1558 CE), Munyat al‑Murīd", "discipline": "Adab", "year": 1, "status": "soon", "spine": "٢"}, {"no": 3, "title": "The Rule of Thought", "author": "al‑Taftāzānī (d. 792 AH / 1390 CE), Tahdhīb al‑Manṭiq, with the Ḥāshiya of Mullā ʿAbd Allāh al‑Yazdī", "discipline": "Logic", "year": 1, "status": "soon", "spine": "٣"}, {"no": 4, "title": "The Damascene Gleam: Worship", "author": "al‑Shahīd al‑Awwal (d. 786 AH / 1384 CE), al‑Lumʿa al‑Dimashqiyya", "discipline": "Fiqh", "year": 1, "status": "soon", "spine": "٤"}, {"no": 5, "title": "The Radiant Garden", "author": "al‑Shahīd al‑Thānī, al‑Rawḍa al‑Bahiyya (Sharḥ al‑Lumʿa)", "discipline": "Fiqh with its proofs", "year": 2, "status": "soon", "spine": "٥"}, {"no": 6, "title": "The Landmarks", "author": "Ḥasan ibn Zayn al‑Dīn (d. 1011 AH / 1602 CE), Maʿālim al‑Uṣūl", "discipline": "Legal theory", "year": 2, "status": "soon", "spine": "٦"}, {"no": 7, "title": "The Care of Reports", "author": "al‑Shahīd al‑Thānī, al‑Riʿāya fī ʿIlm al‑Dirāya", "discipline": "Ḥadīth sciences", "year": 2, "status": "soon", "spine": "٧"}, {"no": 8, "title": "Unveiling the Intent", "author": "al‑ʿAllāma al‑Ḥillī, Kashf al‑Murād, on al‑Ṭūsī’s Tajrīd", "discipline": "Advanced theology", "year": 3, "status": "soon", "spine": "٨"}];
let LINK_KEY = (() => { try{ const k=new URL(location.href).searchParams.get("k"); if(k){ localStorage.setItem("miftah.key",k); return k; } return localStorage.getItem("miftah.key"); }catch(e){ return null; } })();
const API = window.MIFTAH_API || null;                 // progress service
const BOOK_API = window.MIFTAH_BOOK_API || null;       // book text, personal links only
const JOIN_API = window.MIFTAH_JOIN_API || null;       // makes a private link for a new reader
const INVITE = (() => { try{ const c=new URL(location.href).searchParams.get("invite"); if(c){ localStorage.setItem("miftah.invite",c); return c; } return localStorage.getItem("miftah.invite"); }catch(e){ return null; } })();
if(!LINK_KEY && !JOIN_API && window.MIFTAH_HOME){ location.replace(window.MIFTAH_HOME); }
let STORE = API && LINK_KEY ? "miftah.v2." + LINK_KEY : "miftah.v2";
let OLD_STORE = API && LINK_KEY ? "miftah.v1." + LINK_KEY : "miftah.v1";
const myLink = () => location.origin + location.pathname + "?k=" + encodeURIComponent(LINK_KEY||"");
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g,"$1<i>$2</i>");
const AR = s => `<span lang="ar" dir="rtl">${esc(s)}</span>`;
const app=$("#app"), tabs=$("#tabs"), panel=$("#panel");
let TAB="today";

/* ---------- state ---------- */
const fresh = () => ({v:2, questions:[], L:{}, exams:{}, log:{}, calls:{}, rv:{}, mubw:{}, size:1, notes:{}, hard:{}, whyHist:[], reports:[], seenEx:{}, plan:null, paused:null, U:{}, path:null});
function migrate(o){
  if(!o) return fresh();
  if(o.v===2){ const n=Object.assign(fresh(), o); for(const k of ["rv","mubw","notes","hard","seenEx","exams","calls","L","log","U"]) n[k]=n[k]||{}; for(const k of ["whyHist","reports","questions"]) n[k]=n[k]||[]; if(n.size==null) n.size=1; return n; }
  const n = fresh();                      // carry Day One over from the first Miftāḥ
  for(const k of ["owner","label","start","why","moment","updatedAt"]) if(o[k]!=null) n[k]=o[k];
  n.questions = (o.questions||[]).map(q=>({...q}));
  if(o.start) n.dayOne = true;
  return n;
}
function load(){
  try{ const t=localStorage.getItem(STORE); if(t) return migrate(JSON.parse(t)); }catch(e){}
  try{ const t=localStorage.getItem(OLD_STORE); if(t) return migrate(JSON.parse(t)); }catch(e){}
  return fresh();
}
let S = load();
function save(){ S.updatedAt=new Date().toISOString(); try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} schedulePush(); }

/* ---------- dates ---------- */
const DAY=86400000;
const iso = d => { const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const today = () => iso(new Date());
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const fmt = s => parse(s).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const daysSince = s => Math.round((parse(today())-parse(s))/DAY);
const WD=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const HMA=["محرّم","صفر","ربيع الأوّل","ربيع الثاني","جمادى الأولى","جمادى الآخرة","رجب","شعبان","رمضان","شوّال","ذو القعدة","ذو الحجّة"];
const HM=["Muḥarram","Ṣafar","Rabīʿ al‑Awwal","Rabīʿ al‑Thānī","Jumādā al‑Ūlā","Jumādā al‑Ākhira","Rajab","Shaʿbān","Ramaḍān","Shawwāl","Dhū al‑Qaʿda","Dhū al‑Ḥijja"];
function hijri(d){
  const y=d.getFullYear(), m=d.getMonth()+1, day=d.getDate();
  const a=Math.floor((14-m)/12), yy=y+4800-a, mm=m+12*a-3;
  const jd=day+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;
  const l0=jd-1948440+10632, n=Math.floor((l0-1)/10631); let l=l0-10631*n+354;
  const j=Math.floor((10985-l)/5316)*Math.floor(50*l/17719)+Math.floor(l/5670)*Math.floor(43*l/15238);
  l=l-Math.floor((30-j)/15)*Math.floor(17719*j/50)-Math.floor(j/16)*Math.floor(15238*j/43)+29;
  const hm=Math.floor(24*l/709), hd=l-Math.floor(709*hm/24), hy=30*n+j-30; return {y:hy,m:hm,d:hd};
}
const fmtH = s => { const h=hijri(parse(s)); return `${h.d} ${HM[h.m-1]} ${h.y} AH · ${parse(s).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}`; };
const toAr = n => String(n).replace(/\d/g, x => "٠١٢٣٤٥٦٧٨٩"[x]);
const weekStart = () => { const d=new Date(); d.setDate(d.getDate()-((d.getDay()+1)%7)); return iso(d); };   // weeks run Saturday to Friday
function logToday(k){ const t=today(); S.log[t]={...(S.log[t]||{}), [k]:(S.log[t]?.[k]||0)+1}; }
const isPaused = () => S.paused && S.paused >= today();

/* ---------- the book (served only to personal links) ---------- */
let BOOK = null, BOOK_STATE = "loading";
const BOOK_CACHE = id => "miftah.book." + id + "." + (LINK_KEY||"local");
async function loadBook(id){
  if(window.MIFTAH_BOOKS && window.MIFTAH_BOOKS[id]){ BOOK=window.MIFTAH_BOOKS[id]; BOOK_STATE="ok"; return; }
  try{ const t=localStorage.getItem(BOOK_CACHE(id)); if(t){ BOOK=JSON.parse(t); BOOK_STATE="ok"; } }catch(e){}
  if(!BOOK_API || !LINK_KEY){ if(!BOOK) BOOK_STATE = LINK_KEY ? "offline" : "nokey"; return; }
  try{
    const r = await fetch(BOOK_API+"?id="+encodeURIComponent(id)+"&k="+encodeURIComponent(LINK_KEY)+"&have="+encodeURIComponent(BOOK?BOOK.rev:""),{cache:"no-store"});
    if(r.status===304) return;
    if(r.status===403){ if(!BOOK) BOOK_STATE="nokey"; return; }
    if(!r.ok) throw 0;
    BOOK = await r.json(); BOOK_STATE="ok";
    try{ localStorage.setItem(BOOK_CACHE(id), JSON.stringify(BOOK)); }catch(e){}
  }catch(e){ if(!BOOK) BOOK_STATE="offline"; }
}
let L1=null, L1_STATE="loading";
async function loadL1(){
  if(window.MIFTAH_BOOKS && window.MIFTAH_BOOKS.level1){ L1=window.MIFTAH_BOOKS.level1; L1_STATE="ok"; return; }
  try{ const t=localStorage.getItem(BOOK_CACHE("level1")); if(t){ L1=JSON.parse(t); L1_STATE="ok"; } }catch(e){}
  if(!BOOK_API || !LINK_KEY){ if(!L1) L1_STATE = LINK_KEY ? "offline" : "nokey"; return; }
  try{
    const r = await fetch(BOOK_API+"?id=level1&k="+encodeURIComponent(LINK_KEY)+"&have="+encodeURIComponent(L1?L1.rev:""),{cache:"no-store"});
    if(r.status===304) return;
    if(r.status===403){ if(!L1) L1_STATE="nokey"; return; }
    if(!r.ok) throw 0;
    L1 = await r.json(); L1_STATE="ok";
    try{ localStorage.setItem(BOOK_CACHE("level1"), JSON.stringify(L1)); }catch(e){}
  }catch(e){ if(!L1) L1_STATE="offline"; }
}
const pathNow = () => S.path || (Object.keys(S.L||{}).length && !Object.keys(S.U||{}).length ? "bab" : "level1");
const lessonsOf = () => BOOK ? BOOK.lessons : [];
const LK = n => BOOK.id+":"+n;
const qid = (n,q,j) => LK(n)+":"+(q.id||("q"+(j+1)));
const passed = n => !!(S.L[LK(n)]||{}).passed;
let _chapters=null;
const chapters = () => { if(_chapters && _chapters.book===BOOK) return _chapters.list; const out=[]; for(const l of lessonsOf()){ let c=out.find(x=>x.title===l.chapter); if(!c){ c={title:l.chapter, n:out.length+1, lessons:[]}; out.push(c);} c.lessons.push(l.n); } _chapters={book:BOOK,list:out}; return out; };
const chapterOf = n => chapters().find(c=>c.lessons.includes(n));
const examKey = c => BOOK.id+":s"+c.n;
function nextThing(){
  if(!BOOK) return null;
  for(const c of chapters()){
    for(const n of c.lessons) if(!passed(n)) return {kind:"lesson", n};
    if(!(S.exams[examKey(c)]||{}).passed) return {kind:"exam", c};
  }
  if(!(S.exams[BOOK.id+":book"]||{}).passed) return {kind:"bookexam"};
  return {kind:"done"};
}
const unlockedLesson = n => n===1 || (passed(n-1) && (()=>{ const prev=chapterOf(n-1), cur=chapterOf(n); return prev.n===cur.n || !!(S.exams[examKey(prev)]||{}).passed; })());

/* ---------- murājaʿa: spaced review of passed lessons ---------- */
const RV=[1,3,7,16,35,90];
function dueReview(){
  const t=today(), out=[];
  for(const u of unitsReady()){ const r=S.U[u.id]; if(!r||!r.passed) continue;
    recallItems(u).forEach(it=>{ const s=S.rv[it.id]||{box:0,due:addDays(r.passedOn||t,1)}; if(s.due<=t) out.push({...it, box:s.box}); }); }
  if(!BOOK) return out.sort((a,b)=>a.box-b.box);
  for(const l of lessonsOf()){ const r=S.L[LK(l.n)]; if(!r||!r.passed) continue;
    const start=addDays(r.passedOn||t,1);
    (l.check||[]).forEach((q,j)=>{ const id=qid(l.n,q,j); const s=S.rv[id]||{box:0,due:start}; if(s.due<=t) out.push({kind:"q",id,n:l.n,q,box:s.box}); });
    const st=(l.argument||{}).steps||[];
    if(st.length>=3 && st.length<=12){ const id=LK(l.n)+":arg"; const s=S.rv[id]||{box:0,due:addDays(r.passedOn||t,2)}; if(s.due<=t) out.push({kind:"order",id,n:l.n,steps:st,title:l.argument.title||"The proof",box:s.box}); }
  }
  return out.sort((a,b)=>a.box-b.box||a.n-b.n);
}
function gradeReview(id, ok){ const s=S.rv[id]||{box:0}; s.box = ok ? Math.min(RV.length-1, s.box+1) : 0; s.due = addDays(today(), RV[s.box]); S.rv[id]=s; }
function pickReview(){ const all=dueReview(); const qs=all.filter(x=>x.kind==="q").slice(0,5), ord=all.filter(x=>x.kind==="order").slice(0,1); return qs.concat(ord); }
function openReview(then){
  const items=pickReview(); if(!items.length){ if(then) then(); return; }
  let k=0, right=0;
  const done=()=>{ logToday("review"); save(); openPanel(`<div class="eyebrow">Murājaʿa</div><h1>${right} of ${items.length}</h1><p class="read">What you missed comes back tomorrow; what you knew comes back later each time.</p>${MUNYA_WIRD}<button class="btn primary" id="cl">${then?"On to the lesson":"Close"}</button>`, ()=>$("#cl").onclick=()=>{ closePanel(); if(then) then(); }); };
  const draw=()=>{
    if(k>=items.length) return done();
    const it=items[k], head=`<div class="eyebrow">Murājaʿa · ${k+1} of ${items.length} · from lesson ${it.n}</div>`;
    if(it.kind==="order"){
      const order=shuffleSeed(it.steps.length, Date.now()%997+k), picked=[];
      openPanel(`${head}<h2>${esc(it.title)}</h2><p class="read">Put the steps in order. Tap them from first to last.</p><ol class="read" id="ordd" style="padding-left:22px"></ol><div class="stack" id="ordp">${order.map(i=>`<button class="opt" data-s="${i}">${rich(it.steps[i].replace(/^\d+\.\s*/,""))}</button>`).join("")}</div><p class="read" id="ordr" aria-live="polite"></p><button class="btn primary" id="nx" hidden>Next</button>`, ()=>{
        panel.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ picked.push(+b.dataset.s); b.remove(); $("#ordd").insertAdjacentHTML("beforeend",`<li>${rich(it.steps[+b.dataset.s].replace(/^\d+\.\s*/,""))}</li>`);
          if(picked.length===it.steps.length){ const ok=picked.every((v,i)=>v===i); if(ok) right++; gradeReview(it.id, ok);
            $("#ordr").innerHTML = ok ? "✓ <b>In order.</b>" : `✗ <b>Not quite.</b> The order in the lesson:<ol style="padding-left:22px">${it.steps.map(s=>`<li>${rich(s.replace(/^\d+\.\s*/,""))}</li>`).join("")}</ol>`; $("#nx").hidden=false; $("#nx").focus(); } });
        $("#nx").onclick=()=>{ k++; draw(); };
      }); return;
    }
    const ord=shuffleSeed(it.q.options.length, k*17+Date.now()%97);
    openPanel(`${head.replace("from lesson "+it.n, it.unitTitle? esc(it.unitTitle) : "from lesson "+it.n)}<p class="read"><b>${rich(it.q.q)}</b></p><p class="small muted" id="rh">Answer it in your head first.</p><button class="btn" id="show">I have my answer</button><div id="opts" hidden>${ord.map(o=>`<button class="opt" data-o="${o}">${rich(it.q.options[o])}</button>`).join("")}</div><p class="small" id="why" hidden aria-live="polite"></p><button class="btn primary" id="nx" hidden>Next</button>`, ()=>{
      $("#show").onclick=()=>{ $("#opts").hidden=false; $("#show").remove(); $("#rh").textContent="Now choose the answer you had."; };
      let locked=false;
      panel.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(locked) return; locked=true; const o=+b.dataset.o, ok=o===it.q.answer;
        panel.querySelectorAll(".opt").forEach(x=>{ if(+x.dataset.o===it.q.answer){ x.classList.add("right"); x.insertAdjacentText("afterbegin","✓ "); } else if(x===b){ x.classList.add("wrong"); x.insertAdjacentText("afterbegin","✗ "); } });
        if(ok) right++; gradeReview(it.id, ok); const w=$("#why"); w.hidden=false;
        w.innerHTML = (ok?"":(it.q.whynot&&it.q.whynot[o]?rich(it.q.whynot[o])+" ":""))+rich(it.q.why||""); $("#nx").hidden=false; $("#nx").focus(); });
      $("#nx").onclick=()=>{ k++; draw(); };
    });
  };
  draw();
}
const MUNYA_WIRD = `<p class="small muted">Al‑Shahīd al‑Thānī tells the student to keep returning to what he has learned “every day, then every few days, then every week, always”. He says it of the Qurʾān; it is how any text is kept. <span class="src">Munyat al‑Murīd, ed. al‑Mukhtārī, p. 262.</span></p>`;

/* ---------- shared progress ---------- */
let DB=null, UID=null, PEOPLE={}, SYNC="local", pushTimer=null, pushing=false, pushAgain=false;
function summary(){
  const last7=[...Array(7)].map((_,i)=>{ const d=iso(new Date(Date.now()-(6-i)*DAY)); return !!S.log[d]; });
  const nt = nextThing();
  const passedN = BOOK ? lessonsOf().filter(l=>passed(l.n)).length : Object.values(S.L).filter(x=>x.passed).length;
  const uPassed=Object.values(S.U||{}).filter(x=>x.passed).length, nu=(typeof nextUnit==="function"&&L1)?nextUnit():null;
  if(pathNow()==="level1") return {v:2, label:S.label||"", start:S.start||null, last7, days:Object.keys(S.log).length, book:"Level One", total:48, passed:uPassed,
    taqrir:Object.values(S.U||{}).filter(x=>x.assess&&x.assess.submitted).length, exams:uPassed, now: nu ? nu.meta.discipline+" "+nu.meta.unit+": "+nu.meta.title : "",
    paused: isPaused() ? S.paused : null, hard: S.hard[weekStart()] || "", openQ:S.questions.filter(q=>!q.ans).length, reports:(S.reports||[]).length, active:Object.keys(S.log).sort().pop()||null, units:true};
  return {v:2, label:S.label||"", start:S.start||null, last7, days:Object.keys(S.log).length,
    book: BOOK ? BOOK.title : "The Eleventh Chapter", total: BOOK ? lessonsOf().length : 26, passed: passedN,
    taqrir: Object.values(S.L).filter(x=>x.taqrir).length,
    exams: Object.values(S.exams).filter(x=>x.passed).length,
    now: nt && nt.kind==="lesson" ? ("Lesson "+nt.n+": "+lessonsOf()[nt.n-1].title) : nt && nt.kind==="exam" ? ("Exam: "+nt.c.title) : nt && nt.kind==="bookexam" ? "Book exam" : nt && nt.kind==="done" ? "Book finished" : "",
    paused: isPaused() ? S.paused : null, hard: S.hard[weekStart()] || "",
    openQ:S.questions.filter(q=>!q.ans).length, reports:(S.reports||[]).length, active:Object.keys(S.log).sort().pop()||null};
}
function schedulePush(){ if(!DB||!UID||!S.start) return; clearTimeout(pushTimer); pushTimer=setTimeout(push,1200); }
async function push(){
  if(pushing){ pushAgain=true; return; } pushing=true;
  try{ const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({k:LINK_KEY,state:S,summary:summary()})}); if(!r.ok) throw 0; PEOPLE[UID]={summary:summary()}; SYNC="shared"; S._synced=new Date().toISOString(); paintTogether(); }
  catch(e){}
  pushing=false; if(pushAgain){ pushAgain=false; push(); }
}
async function connectRest(){
  if(!API) return;
  if(!LINK_KEY){ SYNC="nokey"; paintTogether(); return; }
  try{
    const r=await fetch(API+"?k="+encodeURIComponent(LINK_KEY),{cache:"no-store"});
    if(!r.ok){ SYNC = r.status===403 ? "badkey" : "local"; paintTogether(); return; }
    const j=await r.json(); DB="rest"; UID=j.me.id;
    if(S.owner && S.owner!==UID) S=fresh();
    S.owner=UID; if(!S.label) S.label=j.me.label;
    const rs = j.me.state ? migrate(j.me.state) : null;
    if(rs && (!S.updatedAt || (rs.updatedAt||"")>S.updatedAt || (j.me.state.v!==2 && !Object.keys(S.L).length))){
      S = Object.assign(rs, {owner:UID});
      try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){}
      if(panel.hidden) render();
    }
    if(S.start && (!j.me.state || j.me.state.v!==2 || (S.updatedAt||"")>(j.me.state.updatedAt||""))) push();
    SYNC="shared"; PEOPLE=j.people||{}; paintTogether();
    document.addEventListener("visibilitychange", async () => { if(document.visibilityState!=="visible") return; try{ const r2=await fetch(API+"?k="+encodeURIComponent(LINK_KEY),{cache:"no-store"}); if(r2.ok){ PEOPLE=(await r2.json()).people||{}; paintTogether(); } }catch(e){} });
  }catch(e){ SYNC="local"; paintTogether(); }
}
const personName = id => id===UID ? "You" : ((PEOPLE[id]&&PEOPLE[id].summary.label) || "Your study partner");
function togetherHTML(){
  if(SYNC==="nokey") return `<p class="small muted">Open Miftāḥ from your personal link once, and your progress will be kept beside your study partner’s.</p>`;
  if(SYNC==="badkey") return `<p class="small muted">This is not one of Miftāḥ’s personal links. Your progress is kept on this phone.</p>`;
  if(!DB) return `<p class="small muted">Your progress is kept on this phone, and shared with your study partner when you are online.</p>`;
  const ids=Object.keys(PEOPLE).sort((a,b)=>a===UID?-1:b===UID?1:0);
  return (ids.length<2?`<p class="small muted">When your study partner begins, their week appears here beside yours.</p>`:"") + ids.map(personRow).join("");
}
function personRow(id){
  const s=PEOPLE[id].summary||{}, nm=esc(personName(id));
  const dots=`<div class="days" role="img" aria-label="Days studied in the last seven">${(s.last7||[]).map(on=>`<i class="${on?"on":""}"></i>`).join("")}</div>`;
  if(s.v!==2) return `<div class="person"><div class="row" style="justify-content:space-between"><b>${nm}</b><span class="pill gold">${s.start?"Day One done":"Not started"}</span></div>${dots}<p class="small muted">Opens the new Miftāḥ next time.</p></div>`;
  const quiet = !s.paused && s.active && s.active < iso(new Date(Date.now()-3*DAY));
  const pill = s.paused ? `<span class="pill gold">Paused until ${fmt(s.paused)}</span>` : quiet ? `<span class="pill gold">Quiet since ${fmt(s.active)}</span>` : s.start ? `<span class="pill">${s.passed} of ${s.total}</span>` : `<span class="pill gold">Not started</span>`;
  return `<div class="person"><div class="row" style="justify-content:space-between"><b>${nm}</b>${pill}</div>
    ${dots}<p class="small muted">${esc(s.book)} · ${s.units? s.passed+" units passed" : s.passed+" lessons passed · "+s.taqrir+" taqrīrs · "+s.exams+" exams"} · ${s.openQ} open question${s.openQ===1?"":"s"}</p>${s.now?`<p class="small">Now: ${esc(s.now)}</p>`:""}${s.hard?`<p class="small"><span class="muted">Hard this week:</span> ${esc(s.hard)}</p>`:""}</div>`;
}
function paintTogether(){ document.querySelectorAll("[data-together]").forEach(el => el.innerHTML = togetherHTML()); }

/* ---------- shell ---------- */
function render(){
  if(!LINK_KEY && JOIN_API){ tabs.hidden=true; return welcome(); }
  if(!S.dayOne){ tabs.hidden=true; return dayOne(0); }
  tabs.hidden=false;
  tabs.querySelectorAll("button").forEach(b => b.setAttribute("aria-current", b.dataset.tab===TAB ? "page" : "false"));
  ({today:renderToday, shelf:renderShelf, ask:renderAsk, record:renderRecord})[TAB]();
  window.scrollTo(0,0);
}
tabs.addEventListener("click", e => { const b=e.target.closest("button"); if(!b) return; TAB=b.dataset.tab; render(); });
function header(eyebrow, title){
  const d=new Date(), h=hijri(d);
  return `<div class="top"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1></div>
  <div style="text-align:right"><div class="date-ar" lang="ar" dir="rtl">${toAr(h.d)} ${HMA[h.m-1]} ${toAr(h.y)}</div><div class="small muted">${d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}</div></div></div>`;
}
let lastFocus=null;
function openPanel(html, after, backLabel="‹ Back"){
  if(panel.hidden) lastFocus=document.activeElement;
  panel.innerHTML=`<div class="wrap stack"><button class="back" id="bk">${backLabel}</button>${html}</div>`; panel.hidden=false; panel.scrollTop=0;

}
function closePanel(){ panel.hidden=true; panel.innerHTML=""; render(); try{ lastFocus&&lastFocus.focus&&lastFocus.focus(); }catch(e){} }
document.addEventListener("keydown", e => { if(e.key==="Escape" && !panel.hidden){ const b=$("#bk"); if(b) b.click(); } });
const FOOT = `<p class="honest">Basma Press. Translated from the Arabic. Self taught: no teacher is needed.</p>`;
const bookMissing = () => BOOK_STATE==="loading" ? `<p class="muted">Opening the book…</p>` :
  BOOK_STATE==="nokey" ? `<div class="note">The books open from your personal link. Use the link you were sent, once, on this phone.</div>` :

function adoptKey(k, label){
  LINK_KEY=k; try{ localStorage.setItem("miftah.key",k); }catch(e){}
  STORE="miftah.v2."+k; OLD_STORE="miftah.v1."+k;

async function openInvite(){
  if(!API||!LINK_KEY) return;
  openPanel(`<div class="eyebrow">Study together</div><h1>Invite a study partner</h1><p class="read" id="iv">Making your invitation…</p>`, async()=>{
    try{ const r=await fetch(API.replace(/progress$/,"invite")+"?k="+encodeURIComponent(LINK_KEY),{cache:"no-store"}); const j=await r.json();
      if(!j.invite){ $("#iv").textContent = j.note==="founding circle" ? "You are already studying with your partner." : "Invitations are not available for this link."; return; }
      const link=location.origin+location.pathname+"?invite="+encodeURIComponent(j.invite);
      $("#iv").outerHTML=`<p class="read">Send this link to one person you will study with (up to ${j.max} in a circle; ${j.members} so far). They get their own private link, and you each see the other’s week: lessons, exams and one line on what was hard. Never your taqrīrs, notes or questions.</p>
        <input type="text" readonly value="${esc(link)}" id="il"><div class="row"><button class="btn primary" id="sh">Share</button><button class="btn" id="cp">Copy</button></div><p class="small muted" id="msg" aria-live="polite"></p>`;
      $("#cp").onclick=()=>copy(link,$("#msg"));
      $("#sh").onclick=()=>{ const text="Study the ḥawza’s books with me, in English: "+link; if(navigator.share) navigator.share({text}).catch(()=>{}); else copy(text,$("#msg")); };
    }catch(e){ $("#iv").textContent="Miftāḥ could not be reached. Try again when you are online."; } });
}

/* ---------- Day One ---------- */
function dayOne(step){
  const dots=`<div class="progress-dots" role="img" aria-label="Step ${step+1} of 4">${[0,1,2,3].map(i=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div>`;
  const shell=(inner,next,label="Next")=>{ app.innerHTML=`<div class="wrap stack" style="padding-top:28px">${dots}${inner}<button class="btn primary" id="nx">${label}</button>${FOOT}</div>`; $("#nx").onclick=next; window.scrollTo(0,0); };
  if(step===0) return shell(`<div class="stack"><div class="eyebrow">Day One</div><h1>Before any book, the intention.</h1>
    <blockquote class="read">“That he make his intention good, and cleanse his heart of stains, so that it is fit to receive knowledge, to keep it, and to go on in it.”</blockquote>
    <p class="src">al‑Shahīd al‑Thānī (d. 965 AH / 1558 CE), Munyat al‑Murīd, the first of the student’s disciplines, ed. al‑Mukhtārī, p. 224. English ours.</p>
    <p class="read">He likens it to preparing the ground before planting. Write one sentence: why are you doing this? No one grades it.</p>
    <label class="small muted" for="why">Why I am doing this</label><textarea id="why">${esc(S.why)}</textarea></div>`, ()=>{ S.why=$("#why").value.trim(); if(S.why) S.whyHist=[{t:S.why,on:today()}]; save(); dayOne(1); });
  if(step===1) return shell(`<div class="stack"><div class="eyebrow">Day One</div><h1>The key is the question.</h1>
    <blockquote class="read">“This knowledge has a lock on it, and its key is the question.”</blockquote>
    <p class="src">Imam Jaʿfar al‑Ṣādiq (ʿa), in al‑Kulaynī, al‑Kāfī, vol. 1, Kitāb Faḍl al‑ʿIlm, chapter on asking the scholar, ḥadīth 3. English ours.</p>
    <p class="read">Write the first question you want answered. Anything at all. It goes in Questions. Most questions are answered by a lesson further on; when you find the answer, you write it down in your own words.</p>
    <textarea id="q1" placeholder="My first question"></textarea></div>`, ()=>{ const t=$("#q1").value.trim(); if(t) S.questions.push({id:Date.now(), t, date:today()}); save(); dayOne(2); });
  if(step===2){ const days=(S.plan&&S.plan.days)||[0,2,4];
    shell(`<div class="stack"><div class="eyebrow">Day One</div><h1>A small plan you can keep.</h1>
    <blockquote class="read">“The most beloved of deeds to Allah, Mighty and Majestic, is the one the servant keeps up, even if it is small.”</blockquote>
    <p class="src">Imam al‑Bāqir (ʿa), in al‑Kāfī, vol. 2, chapter on constancy in deeds, ḥadīth 2; al‑Majlisī: ḥasan, like ṣaḥīḥ. English ours.</p>
    <p class="read">Choose three days for your lessons, and the moment in the day when you will sit down. About 45 minutes each, and a lesson can be split.</p>
    <div class="chips" role="group" aria-label="Lesson days">${WD.map((d,i)=>`<button class="chip" data-d="${i}" aria-pressed="${days.includes(i)}">${d.slice(0,3)}</button>`).join("")}</div>
    <label class="small muted" for="mo">My moment</label><input type="text" id="mo" value="${esc(S.moment||"")}" placeholder="After ʿIshāʾ, at my desk">
    <div class="note"><b>This is a plan, not a vow.</b> Nothing here is a nadhr, an ʿahd or an oath, and nothing is owed if a day is missed. Imam al‑Ṣādiq (ʿa) warned against taking on a duty and then leaving it; keep the plan small enough to keep. Missing one day does no harm. Never miss two. <span class="src">al‑Kāfī, vol. 2, the same chapter, ḥadīth 6; al‑Majlisī: muwaththaq.</span></div></div>`,
    ()=>{ const ds=[...app.querySelectorAll("[data-d][aria-pressed=true]")].map(b=>+b.dataset.d); S.plan={days:ds.length?ds:days}; S.moment=$("#mo").value.trim(); save(); dayOne(3); });
    app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>b.setAttribute("aria-pressed", b.getAttribute("aria-pressed")==="true"?"false":"true")); return; }
  return shell(`<div class="stack"><div class="eyebrow">Day One</div><h1>Where you begin.</h1>
    <p class="read">Miftāḥ begins where the tradition begins: with the man. Before the proofs of belief, before the rules of prayer, you meet the Prophet ﷺ in his life and his household in his story. Then the five roots of belief, held by proof; then the worship you do every day, done knowingly; then the Qurʾān, the ḥadīth, and the logic that runs beneath them all.</p>
    <div class="card stack"><div class="eyebrow">Level One · Six disciplines · 48 units</div><p class="read">Sīrah → ʿAqīdah → Aḥkām → ʿUlūm al‑Qurʾān → Ḥadīth → Manṭiq</p><p class="small muted">About one unit a week, three sessions of about 45 minutes. Each unit: three lessons, the Qurʾān on the subject, a scholar of the tradition, the words that carry it, an assessment you mark yourself, and a journal.</p></div>
    <p class="read">Your first unit: <b>Sīrah, Unit 1. Before the Mission.</b></p>
    ${JOIN_API&&LINK_KEY?`<div class="note"><b>This page is now your private link.</b> Add it to your home screen (Share, then Add to Home Screen). To open Miftāḥ on another device, copy your link from Record.</div>`:""}</div>`,
    ()=>{ S.dayOne=true; if(!S.start) S.start=today(); if(!S.path) S.path="level1"; logToday("dayone"); save(); TAB="today"; render(); }, "Begin");
}

/* ---------- Today ---------- */
function renderToday(){
  if(pathNow()==="level1") return renderTodayUnits();
  if(!BOOK){ app.innerHTML=`<div class="wrap stack">${header("Miftāḥ","Today")}${bookMissing()}</div>`; return; }
  const nt=nextThing(), ws=weekStart(), dow=new Date().getDay();
  const weekLessons=Object.values(S.L).filter(v=>v.passedOn && v.passedOn>=ws).length;
  const due=dueReview().length, last=Object.keys(S.log).sort().pop(), gap=last?daysSince(last):0;
  const lessonDay = S.plan && S.plan.days && S.plan.days.includes(dow);
  let main="";
  if(isPaused()) main=`<div class="card main stack"><div class="eyebrow">Paused</div><h2>New lessons wait until ${fmtH(S.paused)}.</h2><p class="read">Only murājaʿa until then, a few minutes when you can. Al‑Shahīd al‑Thānī allows “one lesson, or less”: what is possible.</p><button class="btn" id="resume">Resume now</button></div>`;
  else if(nt.kind==="lesson"){ const l=lessonsOf()[nt.n-1], st=(S.L[LK(nt.n)]||{}).step||0;
    main=`<div class="card main stack"><div class="eyebrow">${esc(l.chapter)}${lessonDay?" · a lesson day":""}</div><h2>Lesson ${l.n}. ${esc(l.title)}</h2>
      <div class="progress-dots" role="img" aria-label="${st} of ${STEPS.length} steps done">${STEPS.map((s,i)=>`<i class="${i<st?"on":""}"></i>`).join("")}</div>
      <p class="small muted">${st? "You stopped at "+STEPS[st].name.toLowerCase()+"." : "About "+(l.minutes||45)+" minutes. It can be split across the day."}${due&&!st?" Murājaʿa first, then the lesson.":""}</p>
      <button class="btn primary" id="go">${st?"Continue":"Begin the lesson"}</button></div>`; }
  else if(nt.kind==="exam") main=`<div class="card main stack"><div class="eyebrow">Imtiḥān</div><h2>${esc(nt.c.title)}: the section exam</h2><p class="read">Every lesson of this section is passed. Before the next section, an exam with questions you have not seen, and one proof to set out in writing. Eighty percent passes.</p><button class="btn primary" id="go">Sit the exam</button></div>`;
  else if(nt.kind==="bookexam") main=`<div class="card main stack"><div class="eyebrow">Imtiḥān</div><h2>The book exam</h2><p class="read">Twenty questions from the whole book. Eighty percent closes the book.</p><button class="btn primary" id="go">Sit the book exam</button></div>`;
  else main=`<div class="card main stack"><div class="eyebrow">Finished</div><h2>${esc(BOOK.title)} is closed.</h2><p class="read">Every lesson, every section exam and the book exam are passed. Your record and taqrīrs are in Record, ready to print. Murājaʿa keeps the book with you.</p></div>`;
  const back = !isPaused() && gap>=3 ? `<div class="note"><b>Welcome back.</b> It has been ${gap} days. Start small: the murājaʿa, then one lesson or less. Never miss two from here.</div>` : "";
  const mub = Object.entries(S.L).filter(([k,v])=>v.passedOn && v.passedOn>=ws).map(([k])=>lessonsOf()[+k.split(":")[1]-1]).filter(Boolean);
  const called = S.calls[ws];
  const rvCard = due ? `<button class="card wk" id="rvw"><span class="tick"></span><span><b>Murājaʿa</b><br><span class="when">${Math.min(due,6)} items from earlier lessons</span></span><span class="small muted">3 min</span></button>` : "";
  const mubCard = `<button class="wk ${called?"done":""}" id="call"><span class="tick"></span><span><b>Mubāḥatha</b><br><span class="when">${mub.length?mub.length+" lesson"+(mub.length===1?"":"s")+" to argue over, with your partner or alone":"After your first lesson of the week"}</span></span><span class="small muted">30 min</span></button>`;
  const friday = dow===5;
  const week = `<div class="card stack"><div class="row" style="justify-content:space-between"><h3>${friday?"Friday":"This week"}</h3><span class="pill ${weekLessons>=3?"":"gold"}">${weekLessons>=3? weekLessons+" lessons ✓" : weekLessons+" of 3 lessons"}</span></div>
      ${friday?`<p class="small muted">Friday is for the matter of your religion: the mubāḥatha, your open questions, and one line on the week. The report in al‑Kāfī (vol. 1, chapter on asking the scholar, ḥadīth 5) is mursal, so it is held as a report, not a proof.</p>`:`<p class="small muted">Weeks run Saturday to Friday. Three lessons, then the mubāḥatha: a call with your study partner, or the prompts in writing if you study alone.</p>`}
      ${mubCard}
      <label class="small muted" for="hard">What was hard this week? <span class="muted">(your partner sees this line)</span></label><input type="text" id="hard" value="${esc(S.hard[ws]||"")}" placeholder="One line"></div>`;
  app.innerHTML=`<div class="wrap stack">${header(esc(BOOK.title),"Today")}${back}${friday?week+main+rvCard:main+rvCard+week}
    <div class="card"><h3 style="margin-bottom:4px">Studying together</h3><div data-together>${togetherHTML()}</div>${DB&&Object.keys(PEOPLE).length<2?`<button class="btn" id="inv" style="margin-top:8px">Invite a study partner</button>`:""}</div>
    ${!isPaused()&&nt.kind!=="done"?`<button class="linkish" id="pause" style="align-self:center">Exams or a hard month? Pause new lessons</button>`:""}
    ${FOOT}</div>`;
  const go=$("#go"); if(go) go.onclick=()=>{ if(nt.kind==="lesson"){ const st=(S.L[LK(nt.n)]||{}).step||0; if(due && !st) openReview(()=>openLesson(nt.n)); else openLesson(nt.n); } else if(nt.kind==="exam") openExam(nt.c); else openBookExam(); };
  $("#call").onclick=()=>openCall(ws, mub);
  const rv=$("#rvw"); if(rv) rv.onclick=()=>openReview();
  $("#hard").onchange=e=>{ S.hard[ws]=e.target.value.trim(); save(); };
  const ps=$("#pause"); if(ps) ps.onclick=openPause;
  const iv=$("#inv"); if(iv) iv.onclick=openInvite;
  const rs=$("#resume"); if(rs) rs.onclick=()=>{ S.paused=null; save(); render(); };
}
function openPause(){
  const def=addDays(today(),14);
  openPanel(`<div class="eyebrow">Pause</div><h1>Pause new lessons</h1>
    <p class="read">For exams, travel, illness or a hard month. New lessons wait; the murājaʿa stays, a few minutes when you can, so nothing is lost. Your study partner sees “Paused until” instead of “Quiet”.</p>
    <p class="read">“If he can take several lessons a day, let him; otherwise let him keep to what is possible: one lesson, or less.” <span class="src">Munyat al‑Murīd, ed. al‑Mukhtārī, p. 262. English ours.</span></p>
    <label class="small muted" for="pd">Resume on</label><input type="date" id="pd" value="${def}" min="${addDays(today(),1)}">
    <button class="btn primary" id="ok">Pause until then</button>`, ()=>$("#ok").onclick=()=>{ const v=$("#pd").value; if(!v) return; S.paused=v; logToday("pause"); save(); closePanel(); });
}
function openCall(ws, mub){
  openPanel(`<div class="eyebrow">Mubāḥatha · this week</div><h1>Argue it out</h1>
    <p class="read"><b>With a partner,</b> lesson by lesson: one of you is the muqarrir and restates the lesson without notes; the other presses the objection and listens for gaps. Then swap. Before the call, each writes a one line answer to each prompt; afterwards, compare with the lesson’s objection and answer.</p>
    <p class="read"><b>Alone,</b> explain each lesson aloud as if to a friend, then answer the prompts in writing below. Argue against yourself.</p>
    ${mub.length? mub.map(l=>`<div class="card stack"><b>Lesson ${l.n}. ${esc(l.title)}</b>${(l.mubahatha||[]).map((p,j)=>`<p class="read" style="margin-top:6px">${j+1}. ${rich(p)}</p><textarea data-mw="${ws}:${l.n}:${j}" placeholder="My answer">${esc(S.mubw[ws+":"+l.n+":"+j]||"")}</textarea>`).join("")}</div>`).join("") : `<p class="muted read">Pass a lesson this week and its prompts appear here.</p>`}
    <button class="btn primary" id="dn">${S.calls[ws]?"Done this week ✓":"Done for this week"}</button>`,
    ()=>{ panel.querySelectorAll("[data-mw]").forEach(ta=>ta.oninput=()=>{ S.mubw[ta.dataset.mw]=ta.value; save(); }); $("#dn").onclick=()=>{ S.calls[ws]=today(); logToday("call"); save(); closePanel(); }; });
}

/* ---------- a lesson ---------- */
const STEPS=[{k:"before",name:"Before you read"},{k:"text",name:"The text"},{k:"dars",name:"The lesson"},{k:"ishkal",name:"The objection"},{k:"taqrir",name:"Your taqrīr"},{k:"check",name:"Four questions"},{k:"mub",name:"Mubāḥatha"}];
function openLesson(n, at){
  const l=lessonsOf()[n-1], rec=S.L[LK(n)]=S.L[LK(n)]||{step:0};
  let i = at!=null ? at : (rec.passed ? 0 : Math.min(rec.step||0, STEPS.length-1));
  const segs = l.segs.map(s=>BOOK.segments[s]);
  const supplied = new Set((l.supplied||[]).map(p=>p[0]+":"+p[1]));
  const draw = () => {
    const step=STEPS[i];
    const dots=`<div class="progress-dots" role="img" aria-label="Step ${i+1} of ${STEPS.length}">${STEPS.map((s,j)=>`<i class="${j<=i?"on":""}"></i>`).join("")}</div>`;
    let body="", nextLabel="Next", canNext=()=>true;
    if(step.k==="before") body=`<p class="read muted">${rich(l.why||"")}</p><div class="card stack"><b>Hold these in mind while you read.</b><p class="small muted">You do not need to answer them yet. You will answer them in your taqrīr.</p><ol class="read" style="margin:0;padding-left:20px">${(l.before||[]).map(q=>`<li>${rich(q)}</li>`).join("")}</ol></div>`, nextLabel="Read the text";
    if(step.k==="text") body=`<p class="small muted">Al‑Ḥillī’s words, in our English. Read them slowly, twice.</p>${segs.map(s=>`<div class="matn">${esc(s.en)}<span class="orig"><button class="linkish" data-ar="${s.i}" aria-expanded="false" aria-controls="ar${s.i}">Show the original</button></span><p class="ar" hidden id="ar${s.i}" lang="ar" dir="rtl" style="margin-top:8px;font-size:1.3rem">${esc(s.ar)}</p></div>`).join("")}`, nextLabel="The lesson";
    if(step.k==="dars") body=`${(l.supplied||[]).length?`<p class="small muted">Paragraphs marked <span class="tag">Miftāḥ</span> are the publisher’s own: a position stated for fairness, or a bridge. Everything else explains al‑Ḥillī and al‑Miqdād.</p>`:""}<div class="dars">${(l.dars||[]).map((b,bi)=>`<div class="seg"><div class="matn" style="font-size:1rem;margin-bottom:12px">${esc((BOOK.segments[b.seg]||{}).en||"")}</div>${b.paras.map((p,pi)=>supplied.has(bi+":"+pi)?`<p class="supplied"><span class="tag">Miftāḥ</span> ${rich(p)}</p>`:`<p>${rich(p)}</p>`).join("")}</div>`).join("")}</div>
      ${l.argument?`<div class="card argument"><b>${esc(l.argument.title||"The proof, step by step")}</b><ol>${l.argument.steps.map(s=>`<li>${rich(s.replace(/^\d+\.\s*/,""))}</li>`).join("")}</ol></div>`:""}
      ${(l.terms||[]).length?`<details class="card terms"><summary style="cursor:pointer"><b>Terms in this lesson (${l.terms.length})</b></summary><dl>${l.terms.map(t=>`<div><dt>${esc(t.t)}<span class="ar-s" lang="ar" dir="rtl">${esc(t.ar||"")}</span></dt><dd>${esc(t.en?t.en+". ":"")}${rich(t.def||"")}</dd></div>`).join("")}</dl></details>`:""}
      <details class="card"><summary style="cursor:pointer"><b>My ḥāshiya</b> <span class="small muted">notes in the margin, for you</span></summary><textarea id="note" style="margin-top:10px" placeholder="What struck you, what you doubt, what links to another lesson">${esc(S.notes[LK(n)]||"")}</textarea></details>
      ${l.pages?`<p class="src">Sources: ${esc(l.pages)}</p>`:""}`, nextLabel="The objection";
    if(step.k==="ishkal") body=`<p class="read">The ḥawza learns a position by defending it. Read each objection, answer it in your head, then reveal the answer.</p>${(l.ishkal||[]).map((x,j)=>`<div class="card stack"><p class="read"><b>${rich(x.q)}</b></p><button class="btn" data-rev="${j}" aria-expanded="false">I have my answer. Show it.</button><p class="read" hidden id="rev${j}">${rich(x.a)}${x.by?` <span class="src">(${esc(x.by)})</span>`:""}</p></div>`).join("")}`, nextLabel="Write your taqrīr";
    if(step.k==="taqrir"){ const keys=l.taqrir_keys||[], ticks=rec.keys||[];
      body=`<p class="read">${rich(l.taqrir||"Write the lesson in your own words.")}</p><div class="card"><p class="small muted">Answer the questions you held in mind while you read:</p><ol class="read" style="margin:6px 0 0;padding-left:20px">${(l.before||[]).map(q=>`<li>${rich(q)}</li>`).join("")}</ol></div>
        <p class="small muted">Without looking back. At least forty words. This is how the ḥawza makes a lesson yours.</p><textarea id="tq" style="min-height:220px">${esc(rec.taqrir||"")}</textarea><div class="wordcount" id="wc" aria-live="polite"></div>
        ${keys.length?`<div id="kbox" ${rec.checked?"":"hidden"} class="card stack"><b>Check your own taqrīr</b><p class="small muted">Tick each point your taqrīr has. No one grades it; a missing point is a reason to read that part again, or to add a line.</p>${keys.map((k,j)=>`<label class="tickrow"><input type="checkbox" data-k="${j}" ${ticks.includes(j)?"checked":""}> <span>${rich(k)}</span></label>`).join("")}${l.taqrir_model?`<details><summary style="cursor:pointer" class="small"><b>A model taqrīr</b></summary><p class="read" style="margin-top:8px">${rich(l.taqrir_model)}</p></details>`:""}</div>`:""}`;
      nextLabel = keys.length && !rec.checked ? "Check my taqrīr" : "Four questions"; canNext=()=>wc()>=40; }
    if(step.k==="check") body=checkHTML(l, rec), nextLabel="Next";
    if(step.k==="mub") body=`<p class="read">Lesson passed. These prompts are saved for this week’s mubāḥatha, with your partner or in writing on your own.</p><div class="card"><ol class="read" style="margin:0;padding-left:20px">${(l.mubahatha||[]).map(p=>`<li>${rich(p)}</li>`).join("")}</ol></div>${l.next?`<div class="card"><div class="eyebrow">Looking ahead</div><p class="read" style="margin-top:6px">${rich(l.next)}</p></div>`:""}<p class="read">Anything still unclear? Write it in Questions. A later lesson may answer it.</p><div class="row"><button class="btn" id="toask">Add a question</button><button class="btn ghost" id="rep">Report a problem in this lesson</button></div>`, nextLabel="Finish";
    panel.innerHTML=`<div class="wrap stack"><button class="back" id="bk">‹ Close</button><div class="eyebrow">Lesson ${l.n} · ${esc(step.name)}</div><h1>${esc(l.title)}</h1>${dots}${body}
      <div class="row" style="justify-content:space-between">${i>0?`<button class="btn ghost" id="pv">‹ ${esc(STEPS[i-1].name)}</button>`:"<span></span>"}${step.k==="check"&&!rec.passed?"":`<button class="btn primary" id="nx">${nextLabel}</button>`}</div></div>`;
    panel.hidden=false; panel.scrollTop=0;
    $("#bk").onclick=()=>{ save(); closePanel(); }; try{ $("#bk").focus({preventScroll:true}); }catch(e){}
    const pv=$("#pv"); if(pv) pv.onclick=()=>{ i--; draw(); };
    panel.querySelectorAll("[data-ar]").forEach(b=>b.onclick=()=>{ const p=$("#ar"+b.dataset.ar); p.hidden=!p.hidden; b.setAttribute("aria-expanded", String(!p.hidden)); b.textContent=p.hidden?"Show the original":"Hide the original"; });
    panel.querySelectorAll("[data-rev]").forEach(b=>b.onclick=()=>{ $("#rev"+b.dataset.rev).hidden=false; b.remove(); });
    const note=$("#note"); if(note) note.oninput=()=>{ S.notes[LK(n)]=note.value; save(); };
    const tq=$("#tq"); function wc(){ const c=(tq.value.trim().match(/\S+/g)||[]).length; $("#wc").textContent=c+" words"+(c<40?" · "+(40-c)+" more to continue":""); const nx=$("#nx"); if(nx) nx.disabled=c<40; return c; }
    if(tq){ tq.oninput=()=>{ rec.taqrir=tq.value; wc(); }; wc(); panel.querySelectorAll("[data-k]").forEach(c=>c.onchange=()=>{ rec.keys=[...panel.querySelectorAll("[data-k]:checked")].map(x=>+x.dataset.k); save(); }); }
    if(step.k==="check") wireCheck(l, rec, ()=>{ draw(); });
    const ta=$("#toask"); if(ta) ta.onclick=()=>{ save(); TAB="ask"; closePanel(); };
    const rp=$("#rep"); if(rp) rp.onclick=()=>openReport(l);
    const nx=$("#nx"); if(nx) nx.onclick=()=>{ if(!canNext()) return;
      if(step.k==="taqrir"){ rec.taqrir=tq.value.trim(); rec.taqrirOn=today(); if((l.taqrir_keys||[]).length && !rec.checked){ rec.checked=true; save(); draw(); const kb=$("#kbox"); if(kb) kb.scrollIntoView({block:"start"}); return; } }
      if(i===STEPS.length-1){ save(); closePanel(); return; }
      i++; if(!rec.passed) rec.step=Math.max(rec.step||0,i); logToday("study"); save(); draw(); };
  };
  draw();
}
function openReport(l){

function shuffleSeed(n, seed){ const a=[...Array(n).keys()]; let s=seed||1; for(let i=n-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

    return `<div class="card stack" data-q="${j}" role="group" aria-label="Question ${j+1}"><p class="read"><b>${j+1}. ${rich(q.q)}</b></p>${ord.map(o=>`<button class="opt" data-o="${o}" aria-pressed="false">${rich(q.options[o])}</button>`).join("")}<p class="small" hidden data-why></p></div>`; }).join("") +

function wireCheck(l, rec, redraw){
  const pick={};
  panel.querySelectorAll("[data-q]").forEach(card=>{ const j=+card.dataset.q;
    card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(card.dataset.locked) return; card.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); pick[j]=+b.dataset.o; const c=$("#chk"); if(c) c.disabled=Object.keys(pick).length<l.check.length; }); });
  const c=$("#chk"); if(!c) return;
  c.onclick=()=>{
    let right=0; const results=[];
    l.check.forEach((q,j)=>{ const ok=pick[j]===q.answer; results.push(ok); if(ok) right++; });
    const ok = right >= Math.ceil(l.check.length*0.75);
    panel.querySelectorAll("[data-q]").forEach(card=>{ const j=+card.dataset.q, q=l.check[j]; card.dataset.locked=1; const w=card.querySelector("[data-why]");
      card.querySelectorAll(".opt").forEach(b=>{ const o=+b.dataset.o;

        else if(o===pick[j] && o!==q.answer){ b.classList.add("wrong"); b.insertAdjacentText("afterbegin","✗ "); }
        else if(!ok && o===pick[j] && o===q.answer){ b.insertAdjacentText("afterbegin","✓ "); } });
      w.hidden=false;
      if(results[j]) w.innerHTML = ok ? rich(q.why||"") : "Right.";
      else w.innerHTML = (q.whynot&&q.whynot[pick[j]]) ? rich(q.whynot[pick[j]]) + (ok?" "+rich(q.why||""):"") : (ok?rich(q.why||""):"Not this one."); });
    rec.tries=(rec.tries||0)+1; rec.best=Math.max(rec.best||0, right);
    if(ok){ rec.passed=true; rec.passedOn=today(); rec.score=right+"/"+l.check.length; rec.step=STEPS.length-1; rec.rev=BOOK.rev; logToday("passed"); }
    save();
    $("#res").innerHTML = ok ? `<b>${right} of ${l.check.length}.</b> Passed.` : `<b>${right} of ${l.check.length}.</b> Not yet. The reasons are under the questions you missed; the right answers are not shown, so that your next try is your own. Read the lesson again, then try once more in a new order.`;
    c.outerHTML = ok ? `<button class="btn primary" id="nx2">Next</button>` : `<div class="row"><button class="btn" id="rd">Read the lesson again</button><button class="btn primary" id="ag">Try again</button></div>`;
    const n2=$("#nx2"); if(n2){ n2.onclick=()=>openLesson(l.n, STEPS.length-1); n2.focus(); }
    const rd=$("#rd"); if(rd){ rd.onclick=()=>openLesson(l.n, 2); rd.focus(); }
    const ag=$("#ag"); if(ag) ag.onclick=redraw;
  };
}

    ${written?`<div class="card stack"><p class="read"><b>${qs.length+1}. ${rich(written.prompt)}</b></p><p class="small muted">Write it without looking back. You will check it yourself against the key points after you hand in.</p><textarea id="wr" style="min-height:200px"></textarea><div class="wordcount" id="wwc"></div></div>`:""}

    if(written) $("#wr").oninput=ready;

    $("#sub").onclick=()=>{

      const pct=Math.round(100*right/qs.length), ok=pct>=80;
      panel.querySelectorAll("[data-e]").forEach(card=>{ const j=+card.dataset.e, q=qs[j].q; card.dataset.locked=1; const w=card.querySelector("[data-why]");

        w.hidden=false; w.innerHTML = ans[j]===q.answer ? (ok?rich(q.why||""):"Right.") : ((q.whynot&&q.whynot[ans[j]])?rich(q.whynot[ans[j]]):"Not this one."); });

        ${written?`<b>Check your written answer</b><p class="small muted">Tick each point it has. This is for you; it does not change the score.</p>${written.keys.map((k,j)=>`<label class="tickrow"><input type="checkbox" data-wk="${j}"> <span>${rich(k)}</span></label>`).join("")}`:""}</div>`;

function poolFor(c){ const s=(BOOK.exams||[]).find(x=>x.n===c.n) || (BOOK.exams||[]).find(x=>x.title===c.title); return s||null; }
function drawFrom(list, limit){ const unseen=list.filter(x=>!S.seenEx[x.q.id]), seen=list.filter(x=>S.seenEx[x.q.id]); const t=Date.now()%991; const mix=a=>shuffleSeed(a.length,t+a.length).map(i=>a[i]); return mix(unseen).concat(mix(seen)).slice(0,limit); }
function lessonQs(ns){ const qs=[]; for(const n of ns){ const l=lessonsOf()[n-1]; (l.check||[]).forEach((q,j)=>qs.push({n, q:{...q, id:qid(n,q,j)}})); } return qs; }

}

function assessHTML(u, rec){
  const F=u.partF||{}, a=rec.assess||{}, done=!!a.submitted;
  let qn=0;
  const secs=(F.sections||[]).map((s,si)=>`<div class="card stack"><div class="row" style="justify-content:space-between"><b>${esc(s.title)}</b><span class="pill">${s.points} points</span></div>${(s.questions||[]).map(q=>{ qn++; const key=String(q.n||qn), v=(a.ans||{})[key];
      let inp="";
      const isTF=/true/i.test(q.type||""), isMC=!isTF && Array.isArray(q.options) && q.options.length>0;
      if(isMC) inp=q.options.map((o,oi)=>`<button class="opt ${done&&oi===q.answer?"right":""} ${done&&v===oi&&oi!==q.answer?"wrong":""}" data-a="${key}" data-v="${oi}" aria-pressed="${v===oi}" ${done?"disabled":""}>${done&&oi===q.answer?"✓ ":""}${done&&v===oi&&oi!==q.answer?"✗ ":""}${rich(o)}</button>`).join("");
      else if(isTF) inp=`<div class="row">${["True","False"].map((o,oi)=>`<button class="chip" data-a="${key}" data-v="${oi===0}" aria-pressed="${v===(oi===0)}" ${done?"disabled":""}>${o}</button>`).join("")}</div><input type="text" data-t="${key}c" placeholder="If false, the correction" value="${esc((a.ans||{})[key+"c"]||"")}" ${done?"readonly":""}>`;
      else if(/fill/i.test(q.type||"")) inp=`<input type="text" data-t="${key}" value="${esc(v||"")}" ${done?"readonly":""}>`;
      else inp=`<textarea data-t="${key}" style="min-height:${/paragraph/i.test(q.type||"")?200:120}px" ${done?"readonly":""}>${esc(v||"")}</textarea>`;
      const auto = isMC;
      const mark = done && !auto ? `<label class="small">My mark for this answer <input type="number" min="0" max="${q.points}" step="1" data-m="${key}" value="${(a.self||{})[key]??""}" style="width:80px;display:inline-block"> of ${q.points}</label>` : "";
      const key2 = done ? `${isTF?`<p class="small"><b>Answer:</b> ${rich(q.correction || (q.answer?"True":"False"))}</p>`:""}${/fill/i.test(q.type||"")&&typeof q.answer==="string"?`<p class="small"><b>Answer:</b> ${rich(q.answer)}</p>`:""}${q.why?`<p class="small">${rich(q.why)}</p>`:""}${(F.models||{})[key]?`<details open><summary class="small" style="cursor:pointer"><b>A model answer</b></summary><p class="read">${rich(F.models[key])}</p></details>`:""}${(F.rubric||{})[key]?`<p class="small muted"><b>Marking:</b> ${rich(F.rubric[key])}</p>`:""}${(!auto && !isTF && !/fill/i.test(q.type||"") && !(F.models||{})[key] && (F.answerKey||[]).find(x=>x.startsWith("Q"+key+":")))?`<p class="small"><b>Answer:</b> ${rich((F.answerKey||[]).find(x=>x.startsWith("Q"+key+":")).replace(/^Q\d+:\s*/,""))}</p>`:""}` : "";
      return `<div class="stack" style="gap:8px"><p class="read"><b>${key}.</b> ${rich(q.text)} <span class="small muted">(${q.points} points · ${esc(q.type||"")})</span></p>${inp}${key2}${mark}</div>`; }).join("")}</div>`).join("");
  const score = done ? assessScore(u, rec) : null;
  return `<h2>Assessment</h2><p class="read">${done?"Mark your written answers against the model and the marking notes, honestly. The multiple choice is marked for you. Seventy points passes.":"Answer everything without looking back. When you submit, you will see the answers, model answers and marking notes, and mark your written answers yourself."}</p>${secs}
    ${done?`<div class="card stack" aria-live="polite"><b id="tot">${score.total} of 100${score.complete?"":" so far (mark every written answer)"}</b>${rec.passed?`<p class="read">Passed. ${score.total>=85?"":"Read again the parts where you lost the most points before you move on."}</p>`:score.complete?`<p class="read">Not yet. Read the lessons again and sit it once more.</p><button class="btn" id="retry">Sit it again</button>`:""}</div>`:`<button class="btn primary" id="sub">Submit</button><p class="small muted" id="amsg" aria-live="polite"></p>`}`;
}
function assessScore(u, rec){
  const F=u.partF||{}, a=rec.assess||{}; let total=0, complete=true, qn=0;
  (F.sections||[]).forEach(s=>(s.questions||[]).forEach(q=>{ qn++; const key=String(q.n||qn);
    if(!/true/i.test(q.type||"") && Array.isArray(q.options)&&q.options.length){ if((a.ans||{})[key]===q.answer) total+=q.points; }
    else { const m=(a.self||{})[key]; if(m===undefined||m===""||m===null) complete=false; else total+=Math.max(0,Math.min(q.points,+m)); } }));
  return {total, complete};
}
function wireAssess(u, rec, redraw){
  const a=rec.assess=rec.assess||{ans:{}, self:{}};
  panel.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{ if(a.submitted) return; const k=b.dataset.a, v=b.dataset.v; a.ans[k]= v==="true"?true: v==="false"?false: +v; panel.querySelectorAll(`[data-a="${k}"]`).forEach(x=>x.setAttribute("aria-pressed", String(x===b))); save(); });
  panel.querySelectorAll("[data-t]").forEach(x=>x.oninput=()=>{ a.ans[x.dataset.t]=x.value; save(); });
  panel.querySelectorAll("[data-m]").forEach(x=>x.oninput=()=>{ a.self[x.dataset.m]=x.value; const sc=assessScore(u,rec); $("#tot").textContent=sc.total+" of 100"+(sc.complete?"":" so far (mark every written answer)"); if(sc.complete){ rec.score=sc.total; if(sc.total>=70 && !rec.passed){ rec.passed=true; rec.passedOn=today(); rec.rev=L1.rev; logToday("passed"); save(); redraw(); return; } } save(); });
  const sub=$("#sub"); if(sub) sub.onclick=()=>{ const F=u.partF||{}; let missing=0, qn=0; (F.sections||[]).forEach(s=>(s.questions||[]).forEach(q=>{ qn++; const k=String(q.n||qn); if(a.ans[k]===undefined||a.ans[k]==="") missing++; }));
    if(missing && !confirm(missing+" question"+(missing===1?" is":"s are")+" unanswered. Submit anyway?")) return;
    a.submitted=true; a.on=today(); a.tries=(a.tries||0)+1; save(); redraw(); };
  const rt=$("#retry"); if(rt) rt.onclick=()=>{ rec.assess={ans:{}, self:{}, tries:a.tries}; save(); redraw(); };
}

function glossary(){
  const met=new Set(lessonsOf().filter(l=>unlockedLesson(l.n)).map(l=>l.n));
  const g = BOOK.glossary && BOOK.glossary.length ? BOOK.glossary.filter(x=>met.has(x.first||1)).map(x=>({...x, n:x.first||1})) : (()=>{ const seen={}, out=[]; for(const l of lessonsOf()){ if(!met.has(l.n)) continue; for(const x of (l.terms||[])){ const k=x.t.toLowerCase(); if(seen[k]) continue; seen[k]=1; out.push({...x, n:l.n}); } } return out; })();
  const key=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/^al[‑-]/i,"").replace(/[ʿʾ‘’]/g,"").toLowerCase();
  return g.sort((a,b)=>key(a.t)<key(b.t)?-1:1);
}
function openGlossary(){
  const g=glossary();
  openPanel(`<div class="eyebrow">${esc(BOOK.title)}</div><h1>Terms</h1><p class="small muted">Every term defined in the lessons you have reached, with the lesson that first defines it. More appear as you go on.</p>
    <label class="small muted" for="gq">Find a term</label><input type="search" id="gq"><div class="terms" id="gl"></div>`, ()=>{
    const paint=()=>{ const q=($("#gq").value||"").toLowerCase(); $("#gl").innerHTML=`<dl>${g.filter(x=>!q||(x.t+" "+(x.en||"")+" "+(x.def||"")).toLowerCase().includes(q)).map(x=>`<div><dt>${esc(x.t)}<span class="ar-s" lang="ar" dir="rtl">${esc(x.ar||"")}</span> <button class="linkish" data-gl="${x.n}">lesson ${x.n}</button></dt><dd>${esc(x.en?x.en+". ":"")}${rich(x.def||"")}</dd></div>`).join("")}</dl>`;
      panel.querySelectorAll("[data-gl]").forEach(b=>b.onclick=()=>openLesson(+b.dataset.gl, 2)); };
    $("#gq").oninput=paint; paint(); });
}
function openSearch(){
  const strip=s=>String(s||"").replace(/\*/g,"");
  const docs=[];
  for(const l of lessonsOf()){ if(!unlockedLesson(l.n)) continue;
    l.segs.forEach(s=>docs.push({n:l.n, step:1, where:"The text", t:BOOK.segments[s].en}));
    (l.dars||[]).forEach(b=>b.paras.forEach(p=>docs.push({n:l.n, step:2, where:"The lesson", t:strip(p)})));
    (l.ishkal||[]).forEach(x=>docs.push({n:l.n, step:3, where:"The objection", t:strip(x.q+" "+x.a)}));
    const r=S.L[LK(l.n)]||{}; if(r.taqrir) docs.push({n:l.n, step:4, where:"My taqrīr", t:r.taqrir});
    if(S.notes[LK(l.n)]) docs.push({n:l.n, step:2, where:"My ḥāshiya", t:S.notes[LK(l.n)]}); }
  openPanel(`<div class="eyebrow">${esc(BOOK.title)}</div><h1>Search</h1><p class="small muted">The text, the lessons, the objections, and your own taqrīrs and notes, in every lesson you have reached.</p>
    <label class="small muted" for="sq">Search for</label><input type="search" id="sq"><div class="stack" id="sr" aria-live="polite"></div>`, ()=>{
    const go=()=>{ const q=$("#sq").value.trim().toLowerCase(); if(q.length<3){ $("#sr").innerHTML=""; return; }
      const hits=docs.filter(d=>d.t.toLowerCase().includes(q)).slice(0,40);
      $("#sr").innerHTML = hits.length ? hits.map((d,i)=>{ const at=d.t.toLowerCase().indexOf(q), a=Math.max(0,at-70); const snip=(a?"…":"")+d.t.slice(a,at)+"<mark>"+esc(d.t.slice(at,at+q.length))+"</mark>"+esc(d.t.slice(at+q.length,at+q.length+90))+"…";
        return `<button class="qitem" style="text-align:left;cursor:pointer;font:inherit;color:inherit" data-h="${i}"><span class="small muted">Lesson ${d.n} · ${esc(d.where)}</span><span class="read">${esc(d.t.slice(a,at)).replace(/^/, a?"…":"")}<mark>${esc(d.t.slice(at,at+q.length))}</mark>${esc(d.t.slice(at+q.length,at+q.length+90))}…</span></button>`; }).join("") : `<p class="muted read">Nothing found.</p>`;
      $("#sr").querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{ const d=hits[+b.dataset.h]; openLesson(d.n, d.step); }); };
    $("#sq").oninput=go; });
}
